<script>
// ─── Two datasets: real HOPE Shelters payroll/staff (parsed from PayrollDetail.csv
// + the org chart) and the original synthetic sample ─── both build a fresh
// Organization so reports/CRUD/designer can be tested against either. ───────
function buildSyntheticOrg() {
const org = new Organization({ name: 'Riverside Shelter (sample data)' });
const fy = '2026';
const payrollCat = org.addBudgetCategory(new BudgetCategory({ name: 'Payroll', fiscalYear: fy, allocatedAmount: 420000 }));
const opsCat = org.addBudgetCategory(new BudgetCategory({ name: 'Operations', fiscalYear: fy, allocatedAmount: 90000 }));

const alice = org.addStaff(new Staff({ name: 'Sample Staff A', employmentType: 'full-time', roleTitle: 'Case Manager', shiftPreference: 'day', payType: 'hourly', payRate: 24, hireDate: '2023-02-01', email: 'a@example.org', createdBy: 'system-admin' }));
const ben = org.addStaff(new Staff({ name: 'Sample Staff B', employmentType: 'part-time', roleTitle: 'Shelter Monitor', shiftPreference: 'night', payType: 'hourly', payRate: 19, hireDate: '2024-06-15', email: 'b@example.org', createdBy: 'system-admin' }));

org.addShift(new Shift({ staffId: alice.id, date: '2026-07-20', shiftType: 'Day', shiftLabel: '8a-4p', postAssignment: 'Front Desk', createdBy: alice.id }));
org.addShift(new Shift({ staffId: ben.id, date: '2026-07-20', shiftType: 'Night', shiftLabel: '4p-12a', postAssignment: 'Floor Monitor', createdBy: alice.id }));
org.addShift(new Shift({ staffId: '', date: '2026-07-21', shiftType: 'Night', status: 'open', createdBy: alice.id }));

org.addPayrollRecord(new PayrollRecord({
  staffId: alice.id, department: '10 - AS -- SCoordination', periodStart: '2026-07-01', periodEnd: '2026-07-15',
  earnings: [{ type: 'Regular', hours: 80, rate: 24, amount: 1920 }, { type: 'Overtime', hours: 2, rate: 36, amount: 72 }],
  totalHours: 82, totalEarnings: 1992,
  taxes: { fedSocSec: 123.50, fedMedcare: 28.88, stateSIT: 82.67, total: 235.05 },
  deductions: { medicalPreTax: 180, total: 180 }, netPay: 1576.95,
  employerLiability: { fedSocSecER: 123.50, fedMedcareER: 28.88, total: 152.38 },
  payments: [{ method: 'Direct Deposit', checkDate: '2026-07-18', transactionId: 'XXXX0001', amount: 1576.95 }],
  budgetCategoryId: payrollCat.id
}));
org.addPayrollRecord(new PayrollRecord({
  staffId: ben.id, department: '10 - AS -- SCoordination', periodStart: '2026-07-01', periodEnd: '2026-07-15',
  earnings: [{ type: 'Regular', hours: 60, rate: 19, amount: 1140 }],
  totalHours: 60, totalEarnings: 1140,
  taxes: { fedSocSec: 70.68, fedMedcare: 16.53, stateSIT: 47.31, total: 134.52 },
  deductions: { total: 0 }, netPay: 1005.48,
  employerLiability: { fedSocSecER: 70.68, fedMedcareER: 16.53, total: 87.21 },
  payments: [{ method: 'Direct Deposit', checkDate: '2026-07-18', transactionId: 'XXXX0002', amount: 1005.48 }],
  budgetCategoryId: payrollCat.id
}));

org.addExpense(new Expense({ date: '2026-07-05', category: 'Utilities', amount: 3200, vendor: 'City Power', budgetCategoryId: opsCat.id, approvedBy: alice.id, createdBy: alice.id }));
org.addGrant(new Grant({ source: 'County Housing Fund', amount: 50000, receivedDate: '2026-01-15', restricted: true, budgetCategoryId: payrollCat.id, createdBy: alice.id }));

// ─── Additional periods/seasons of synthetic data, for the month/season reports ──
function seedPayroll(staff, start, end, hours, otHours) {
  const rate = staff.payRate, otRate = rate * 1.5;
  const reg = hours * rate, ot = otHours * otRate, gross = reg + ot;
  const fedSocSec = gross * 0.062, fedMedcare = gross * 0.0145, stateSIT = gross * 0.0415;
  const taxTotal = fedSocSec + fedMedcare + stateSIT;
  org.addPayrollRecord(new PayrollRecord({
    staffId: staff.id, department: '10 - AS -- SCoordination', periodStart: start, periodEnd: end,
    earnings: otHours ? [{ type: 'Regular', hours, rate, amount: reg }, { type: 'Overtime', hours: otHours, rate: otRate, amount: ot }] : [{ type: 'Regular', hours, rate, amount: reg }],
    totalHours: hours + otHours, totalEarnings: gross,
    taxes: { fedSocSec, fedMedcare, stateSIT, total: taxTotal },
    deductions: { total: 0 }, netPay: gross - taxTotal,
    employerLiability: { fedSocSecER: fedSocSec, fedMedcareER: fedMedcare, total: fedSocSec + fedMedcare },
    payments: [{ method: 'Direct Deposit', checkDate: end, transactionId: 'XXXX' + Math.floor(Math.random()*9000+1000), amount: gross - taxTotal }],
    budgetCategoryId: payrollCat.id
  }));
}
seedPayroll(alice, '2026-01-01', '2026-01-15', 80, 0);
seedPayroll(ben, '2026-01-01', '2026-01-15', 55, 0);
seedPayroll(alice, '2026-04-01', '2026-04-15', 80, 4);
seedPayroll(ben, '2026-04-01', '2026-04-15', 62, 0);
seedPayroll(alice, '2026-10-01', '2026-10-15', 80, 1);
seedPayroll(ben, '2026-10-01', '2026-10-15', 58, 3);

org.addExpense(new Expense({ date: '2026-01-10', category: 'Utilities', amount: 2800, vendor: 'City Power', budgetCategoryId: opsCat.id, approvedBy: alice.id, createdBy: alice.id }));
org.addExpense(new Expense({ date: '2026-02-14', category: 'Supplies', amount: 450, vendor: 'Shelter Supply Co', budgetCategoryId: opsCat.id, approvedBy: ben.id, createdBy: ben.id }));
org.addExpense(new Expense({ date: '2026-04-08', category: 'Food Services', amount: 1900, vendor: 'Metro Food Bank', budgetCategoryId: opsCat.id, approvedBy: alice.id, createdBy: alice.id }));
org.addExpense(new Expense({ date: '2026-05-20', category: 'Maintenance', amount: 1200, vendor: 'Facilities Inc', budgetCategoryId: opsCat.id, approvedBy: ben.id, createdBy: ben.id }));
org.addExpense(new Expense({ date: '2026-08-12', category: 'Food Services', amount: 2100, vendor: 'Metro Food Bank', budgetCategoryId: opsCat.id, approvedBy: alice.id, createdBy: alice.id }));
org.addExpense(new Expense({ date: '2026-10-03', category: 'Utilities', amount: 3400, vendor: 'City Power', budgetCategoryId: opsCat.id, approvedBy: ben.id, createdBy: ben.id }));
org.addExpense(new Expense({ date: '2026-11-18', category: 'Supplies', amount: 620, vendor: 'Shelter Supply Co', budgetCategoryId: opsCat.id, approvedBy: alice.id, createdBy: alice.id }));

const orgChart = OrgPosition.buildHopeSheltersChart();
return { org, orgChart };
}

function buildRealOrg() {
  const org = new Organization({ name: 'HOPE Hospitality and Warming Center (real 2025 payroll)' });
  // Real per-employee annualized payroll estimate: sum each real payrollRecord's actual
  // totalEarnings, then annualize by that record's own real period span (not an assumed
  // full-year for everyone) — this is real data with real partial employment spans, not a
  // synthetic demo where a flat 2080hr/year assumption would be acceptable.
  // No real annual budget document exists for Payroll. Every attempt to annualize/estimate
  // from partial, sporadic real employment spans (some staff worked a single day) produces a
  // fabricated number, not a real one. Until a real budget figure is provided, Allocated is set
  // equal to real Actual spend (REAL_ORG_DATA.payrollRecords' true totalEarnings sum) — the
  // honest state is "no variance data available," not an invented projection.
  const validStaffIds = new Set(REAL_ORG_DATA.staff.map(s => s.id));
  const estimatedPayrollBudget = REAL_ORG_DATA.payrollRecords.filter(p => validStaffIds.has(p.staffId)).reduce((sum, p) => sum + (p.totalEarnings || 0), 0);
  const payrollCat = org.addBudgetCategory(new BudgetCategory({ name: 'Payroll (no budget doc \u2014 shown as actual)', fiscalYear: '2025', allocatedAmount: Math.round(estimatedPayrollBudget) }));
  // Real 2026 non-payroll expenses and donations, extracted line-by-line from the org's actual
  // finance workbook (one BudgetCategory per workbook category, matching its summary sheet's
  // columns). Note: this workbook's real dates are 2026, while the separate payroll CSV's real
  // dates are 2025 \u2014 two different real source documents covering different fiscal periods,
  // not one unified fiscal year. Tagged '2026' here so budgetProjection(fy) reflects that honestly.
  const expenseCatNames = ['Food', 'Supplies', 'Building and Membership Expenses', 'Loan Payment', 'Pro License & Fee', 'Utilities', 'Insurance', 'S2S', 'Payroll (ADP)'];
  const expenseCatMap = {};
  const expenseTotalsByCat = {};
  (REAL_ORG_DATA.expenses || []).forEach(e => { expenseTotalsByCat[e.category] = (expenseTotalsByCat[e.category] || 0) + e.amount; });
  expenseCatNames.forEach(name => {
    expenseCatMap[name] = org.addBudgetCategory(new BudgetCategory({ name, fiscalYear: '2026', allocatedAmount: Math.round((expenseTotalsByCat[name] || 0) * 100) / 100 }));
  });
  (REAL_ORG_DATA.expenses || []).forEach(e => {
    const cat = expenseCatMap[e.category];
    org.addExpense(new Expense({
      date: e.date, category: e.category, amount: e.amount, vendor: e.vendor,
      budgetCategoryId: cat ? cat.id : '', createdBy: 'system-import'
    }));
  });
  // Real deposits/donations/GoFundMe income, tagged to a dedicated income category so
  // budgetProjection's income filter (matched by budgetCategoryId) actually picks it up —
  // previously left untagged, so real donation income showed as $0 against every category.
  const donationCat = org.addBudgetCategory(new BudgetCategory({ name: 'Donations & Grants', fiscalYear: '2026', allocatedAmount: 0 }));
  (REAL_ORG_DATA.grants || []).forEach(g => {
    org.addGrant(new Grant({
      source: g.source, amount: g.amount, receivedDate: g.receivedDate, restricted: g.restricted,
      budgetCategoryId: donationCat.id, createdBy: 'system-import'
    }));
  });
  const staffIdMap = {};
  REAL_ORG_DATA.staff.forEach(s => {
    const created = org.addStaff(new Staff({
      name: s.name, roleTitle: s.roleTitle, employmentType: s.employmentType,
      payType: s.payType, payRate: s.payRate, status: s.status, hireDate: '', createdBy: 'system-import'
    }));
    staffIdMap[s.id] = created.id;
  });
  const shiftStaffIdMap = {};
  REAL_SHIFT_DATA.staff.forEach(s => {
    const created = org.addStaff(new Staff({
      name: s.name, roleTitle: s.roleTitle, employmentType: s.employmentType,
      payType: s.payType, payRate: s.payRate, status: s.status, hireDate: '', createdBy: 'system-import'
    }));
    shiftStaffIdMap[s.id] = created.id;
  });
  REAL_SHIFT_DATA.shifts.forEach(sh => {
    const staffId = shiftStaffIdMap[sh.staffId];
    if (!staffId) return;
    org.addShift(new Shift({
      staffId, date: sh.date, shiftType: sh.shiftType, shiftLabel: sh.shiftLabel,
      startEpoch: sh.startEpoch, endEpoch: sh.endEpoch, status: sh.status,
      hoursScheduled: sh.hoursScheduled, hoursActual: sh.hoursActual, payRateUsed: sh.payRateUsed,

// ─── Generic report-band engine ────────────────────────────────────────────
// Reports are declarative: a row list + an ordered list of {label, keyFn, sortFn}
// group definitions. This is the same engine both priority reports use, and the
// one any future report/schema-driven designer plugs into — grouping/subtotal/
// grand-total logic never has to be rewritten per report.
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthOf(dateStr) { return (dateStr || '').slice(0, 7); }
function monthLabel(key) { const [y, m] = key.split('-'); return MONTH_NAMES[parseInt(m, 10) - 1] + ' ' + y; }
const SEASON_ORDER = ['Winter', 'Spring', 'Summer', 'Fall'];
function seasonOf(dateStr) { const m = parseInt((dateStr || '').slice(5, 7), 10); if (m === 12 || m <= 2) return 'Winter'; if (m <= 5) return 'Spring'; if (m <= 8) return 'Summer'; return 'Fall'; }

function buildGroups(rows, groupDefs, amountFn, level) {
  level = level || 0;
  if (level >= groupDefs.length) return null;
  const def = groupDefs[level];
  const map = new Map();
  rows.forEach(r => { const k = def.keyFn(r); if (!map.has(k)) map.set(k, []); map.get(k).push(r); });
  const keys = [...map.keys()].sort(def.sortFn || ((a, b) => a < b ? -1 : a > b ? 1 : 0));
  return keys.map(k => {
    const groupRows = map.get(k);
    return { label: def.label, key: k, keyLabel: def.keyLabel ? def.keyLabel(k) : k, rows: groupRows,
      children: buildGroups(groupRows, groupDefs, amountFn, level + 1), subtotal: groupRows.reduce((s, r) => s + amountFn(r), 0) };
  });
}
function renderGroups(groups, depth, detailRenderer) {
  return groups.map(g => `
    <div class="grp-header" style="margin-left:${depth * 16}px">${g.label}: ${g.keyLabel}</div>
    <div style="margin-left:${depth * 16}px">${g.children ? renderGroups(g.children, depth + 1, detailRenderer) : detailRenderer(g.rows)}</div>
    <div class="grp-footer" style="margin-left:${depth * 16}px">Subtotal — ${g.keyLabel}: ${money(g.subtotal)}</div>
  `).join('');
}
// ─── Schema-driven field resolution ─────────────────────────────────────
// A report source names fields against its OWN class — either a raw
// static _schema property or a computed method of the same name — and
// this resolves either uniformly. No report hardcodes "payroll records
// have a totalEarnings column"; it names the field, this reads it. Adding
// a report against a new BaseClassX subclass needs a new source entry,
// never a new bespoke row-builder function.
function fieldLabel(Cls, field) {
  const meta = Cls && Cls._schema && Cls._schema.properties && Cls._schema.properties[field];
  if (meta && meta.label) return meta.label;
  return field.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase());
}
function resolveField(instance, field) {
  const v = instance[field];
  return typeof v === 'function' ? v.call(instance) : v;
}
function collectRows(sourceDefs) {
  const rows = [];
  sourceDefs.forEach(def => {
    const items = def.collection(org).filter(def.filter || (() => true));
    items.forEach(inst => {
      const staff = def.staffField ? org.staff.find(s => s.id === inst[def.staffField]) : null;
      const row = {
        date: inst[def.dateField], month: monthOf(inst[def.dateField]), season: seasonOf(inst[def.dateField]),
        year: (inst[def.dateField] || '').slice(0, 4) || null,
        staffName: staff ? staff.name : (def.staffField ? inst[def.staffField] : ''),
        sourceLabel: def.sourceLabel,
        detail: def.labelFields ? def.labelFields.map(f => resolveField(inst, f)).join(' \u2014 ') : def.labelFn(inst),
        category: def.categoryField ? inst[def.categoryField] : '',
        vendor: def.vendorField ? inst[def.vendorField] : '',
        amount: resolveField(inst, def.amountField), amountLabel: fieldLabel(def.class, def.amountField)
      };
      if (def.extraFields) Object.keys(def.extraFields).forEach(key => { row[key] = resolveField(inst, def.extraFields[key]); });
      rows.push(row);
    });
  });
  return rows;
}

// ─── Report Band Designer ───────────────────────────────────────────────
// Same Toolbox drag/resize canvas already used for VB6 form design,

const REPORT_LAYOUTS = {};

  names.push('reportFooter');

}
function bandDisplayLabel(def, bandName) {

}

    ];
    elements['groupFooter_' + i] = [
      mk('label', { text: 'Subtotal:' }, 8 + i * 16, 6, 90, 22),
      mk('runningTotal', { scope: 'group', level: i }, 100 + i * 16, 6, 160, 22)
    ];
  });
  elements.detail = def.detailColumns.map((c, i) => mk('field', { text: c.label, field: c.field, money: !!c.money }, 8 + i * 160, 6, 150, 24));

        lines.push(`${nid} --> ${idMap.get(child)}`);
      });
      return lines;
    }
    const idMap = new Map();
    let idCounter = 0;
    (function assignIds(node) { idMap.set(node, 'n' + (idCounter++)); (node.children || []).forEach(assignIds); })(orgChart);
    const mermaidDef = 'graph TD\n' + buildMermaidLines(orgChart, idMap).join('\n');
    main.innerHTML = `<h2>Org Chart</h2><div class="subtitle">HOPE Shelters — Diagram + Contact Directory, from one BaseClassX tree</div>` +

      <h3 style="font-size:13px">Payroll Summary</h3>` +
      table(['Staff','Total Earnings','Net Pay','Employer Liability','Total Cost'], payrollProj.records.map(r => [
        org.staff.find(x=>x.id===r.staffId)?.name || r.staffId, money(r.totalEarnings), money(r.netPay), money(r.totalEmployerLiability()), money(r.totalCostToOrg())
      ])) +
      `<h3 style="font-size:13px;margin-top:16px">Budget vs. Actual</h3>` +
      table(['Category','Allocated','Actual','Remaining','Grant Income'], budgetProj.map(b => [b.category, money(b.allocated), money(b.actualSpent), money(b.remaining), money(b.income)]));
    document.getElementById('report-footer-total').textContent = 'Grand Total \u2014 Payroll: ' + money(payrollProj.records.reduce((s,r)=>s+r.totalCostToOrg(),0));

      table(['Date','Shift','Staff','Post','Status'], proj.shifts.map(s => [s.date, s.shiftType, s.staffId ? (org.staff.find(x=>x.id===s.staffId)?.name || s.staffId) : '—', s.postAssignment || '—', s.status==='open' ? '<span class="gap-flag">OPEN — coverage gap</span>' : s.status])) +
      (proj.coverageGaps.length
        ? `<h3 style="margin-top:20px;color:#b3323d">Unfilled Slots (${proj.coverageGaps.length})</h3>` +
          table(['Date','Shift','Post','Status'], proj.coverageGaps.map(g => [g.date, g.shiftType, g.postAssignment || '—', g.status]))
        : `<p style="margin-top:10px;color:#555">No open shifts in this window.</p>`) +
      (proj.understaffedGaps.length
        ? `<h3 style="margin-top:20px;color:#b3323d">Understaffed Shifts (${proj.understaffedGaps.length}) \u2014 below minimum (Night=2, Day=1)</h3>` +

            proj.understaffedGaps.map(g => `<tr><td>${g.date}</td><td style="text-align:right">${g.shiftType}</td><td style="text-align:right">${g.required}</td><td style="text-align:right">${g.filled}</td></tr>`).join('')

// ─── Generic CRUD engine (schema + FieldACL binding, master-detail layout) ──
// Every field's visibility, editability, required-ness, and column set is
// read from Cls._fieldACL[field] (16-byte descriptor) resolved against the
// acting SESSION as owner/group/other for the record in question — one
// engine serves all four entities, and the touch-friendly master-detail
// shell (list left/top, form right/below, stacks on narrow viewports)
// works the same for iPad/iPhone without a separate mobile build.
const CRUD_DEFS = {
  'crud-staff': { class: Staff, collection: 'staff', title: 'Staff' },
  'crud-shifts': { class: Shift, collection: 'shifts', title: 'Shifts' },
  'crud-expenses': { class: Expense, collection: 'expenses', title: 'Expenses' },
  'crud-grants': { class: Grant, collection: 'grants', title: 'Grants' }
};
let crudEditingId = null; // null = nothing selected; '' = new-record form; id = editing that record
let crudSearchTerm = '';
const CRUD_PAGE_SIZE = 15;
let crudPage = 0;
function schemaFields(Cls) { return Object.keys(Cls._schema.properties); }
function fieldACLFor(Cls, field) { return Cls._fieldACL[field] || FieldACL.build({ owner: 'rw-', group: 'rw-', other: 'rw-' }); }
function fieldInputHtml(Cls, field, value) {
  const meta = Cls._schema.properties[field];
  const id = 'crud_f_' + field;
  if (meta.kind === 'set') {
    const selected = new Set(SetType.toArray(meta.options, value || 0n));
    if (meta.exclusive) {
      const currentLabel = SetType.toArray(meta.options, value || 0n)[0] || '';
      const activeOpts = SetType.activeOptions(meta.options);
      return `<div style="display:flex;flex-direction:column;gap:4px">${
        meta.allowBlank !== false ? `<label style="font:12px system-ui;display:flex;align-items:center;gap:6px"><input type="radio" name="${id}" id="${id}__blank" ${currentLabel === '' ? 'checked' : ''}>Blank</label>` : ''
      }${activeOpts.map((opt, i) => `<label style="font:12px system-ui;display:flex;align-items:center;gap:6px"><input type="radio" name="${id}" id="${id}__opt_${meta.options.findIndex(o => (typeof o === 'string' ? o : o.label) === opt)}" ${currentLabel === opt ? 'checked' : ''}>${opt}</label>`).join('')}</div>`;
    }
    const activeOpts = SetType.activeOptions(meta.options);
    return `<div style="display:flex;flex-direction:column;gap:4px">${meta.options.map((opt, i) => {
      const label = typeof opt === 'string' ? opt : opt.label;
      if (!activeOpts.includes(label) && !selected.has(label)) return ''; // retired + never set on this record — hide from entry entirely
      const retired = activeOpts.indexOf(label) === -1;
      return `<label style="font:12px system-ui;display:flex;align-items:center;gap:6px"><input type="checkbox" id="${id}__opt_${i}" ${selected.has(label) ? 'checked' : ''}>${label}${retired ? ' <span style="color:#999">(retired)</span>' : ''}</label>`;
    }).join('')}</div>`;
  }
  if (meta.type === 'boolean') return `<input type="checkbox" id="${id}" ${value ? 'checked' : ''}>`;
  if (meta.type === 'number') return `<input type="number" step="any" id="${id}" value="${value != null ? value : 0}">`;
  return `<input type="text" id="${id}" value="${(value != null ? String(value) : '').replace(/"/g, '&quot;')}">`;
}
function formatCrudValue(Cls, field, v) {
  const meta = Cls._schema.properties[field];
  if (meta.kind === 'set') return SetType.label(meta.options, v);
  if (meta.type === 'boolean') return v ? 'Yes' : 'No';
  if (meta.type === 'number') return /rate|amount/i.test(field) ? money(v) : v;
  return v || '\u2014';
}
function selectCrudRecord(id) { crudEditingId = id; renderCurrent(); }
function changeCrudPage(defKey, delta) { crudPage += delta; renderCurrent(); }
function saveCrudForm(defKey) {
  const def = CRUD_DEFS[defKey];
  const items = org.getCollection(def.collection);
  const editing = crudEditingId ? items.find(x => x.id === crudEditingId) : null;
  const patch = {};
  schemaFields(def.class).forEach(field => {
    const meta = def.class._schema.properties[field];
    if (meta.kind === 'set') {
      if (meta.exclusive) {
        if (!document.getElementById('crud_f_' + field + '__blank') && !document.getElementById('crud_f_' + field + '__opt_0')) return;
        let chosen = 0n;
        meta.options.forEach((opt, i) => {
          const radio = document.getElementById('crud_f_' + field + '__opt_' + i);
          if (radio && radio.checked) chosen = SetType.fromArray(meta.options, [typeof opt === 'string' ? opt : opt.label]);
        });
        patch[field] = chosen; // stays 0n (Blank) if the blank radio (or nothing rendered) was selected
        return;
      }
      const selected = meta.options.filter((opt, i) => {
        const cb = document.getElementById('crud_f_' + field + '__opt_' + i);
        return cb && cb.checked;
      }).map(opt => typeof opt === 'string' ? opt : opt.label);
      if (document.getElementById('crud_f_' + field + '__opt_0') || document.querySelector(`[id^="crud_f_${field}__opt_"]`)) patch[field] = SetType.fromArray(meta.options, selected);
      return;
    }
    const el = document.getElementById('crud_f_' + field);
    if (!el) return; // no writable input was rendered for this field — leave untouched
    patch[field] = meta.type === 'boolean' ? el.checked : meta.type === 'number' ? (parseFloat(el.value) || 0) : el.value;
  });
  const requiredFields = schemaFields(def.class).filter(f => fieldACLFor(def.class, f).hasFlag('REQUIRED'));
  for (const f of requiredFields) {
    const v = f in patch ? patch[f] : (editing ? editing[f] : undefined);
    if (v === '' || v === undefined || v === null) { alert(fieldLabel(def.class, f) + ' is required.'); return; }
  }
  if (editing) {
    org.updateInCollection(def.collection, editing.id, patch);
  } else {
    patch.createdBy = SESSION.staffId;
    const created = org.addToCollection(def.collection, new def.class(patch));
    crudEditingId = created.id;
  }
  renderCurrent();
}
function deleteCrudItem(defKey, id) {
  if (!confirm('Delete this record?')) return;
  org.removeFromCollection(CRUD_DEFS[defKey].collection, id);
  crudEditingId = null;
  renderCurrent();
}
function renderCrudModalBody(defKey) {
  const def = CRUD_DEFS[defKey];
  const items = org.getCollection(def.collection);
  const editing = crudEditingId ? items.find(x => x.id === crudEditingId) : null;
  // Admin viewpoint gets full write access regardless of FieldACL owner/group
  // match — the role-viewpoint is a deliberate override on top of per-record
  // ownership, not a replacement for it (payroll-finance/case-worker still
  // resolve by real ownership).
  const role = document.getElementById('role-select').value;
  const subject = role === 'admin' ? 'owner' : FieldACL.resolveSubject(editing, SESSION);
  return schemaFields(def.class).filter(f => f !== 'createdBy').map(f => {
    const acl = fieldACLFor(def.class, f);
    if (!acl.can(subject, 'r')) return '';
    const canWrite = acl.can(subject, 'w') && (!editing || !acl.hasFlag('IMMUTABLE_AFTER_CREATE'));
    const value = editing ? editing[f] : def.class._schema.properties[f].default;
    const required = acl.hasFlag('REQUIRED');
    return `<div class="crud-field-row"><label>${fieldLabel(def.class, f)}${required ? ' <span class="required-mark">*</span>' : ''}</label>${
      canWrite ? fieldInputHtml(def.class, f, value) : `<div class="crud-field-readonly">${formatCrudValue(def.class, f, value)}</div>`
    }</div>`;
  }).join('');
}
function renderCrudModal(defKey) {
  const def = CRUD_DEFS[defKey];
  const items = org.getCollection(def.collection);
  const editing = crudEditingId ? items.find(x => x.id === crudEditingId) : null;
  return `<div class="crud-modal-overlay" onclick="if(event.target===this) closeCrudModal()">
    <div class="crud-modal">
      <button class="crud-modal-close" title="Close" onclick="closeCrudModal()">
        <svg width="16" height="16" viewBox="0 0 16 16"><line x1="3" y1="3" x2="13" y2="13" stroke="#fff" stroke-width="2"/><line x1="13" y1="3" x2="3" y2="13" stroke="#fff" stroke-width="2"/></svg>
      </button>
      <div class="crud-modal-body">
        <h3 style="margin:0 0 10px 0">${editing ? 'Edit ' + def.title.replace(/s$/, '') : 'Add ' + def.title.replace(/s$/, '')}</h3>
        ${renderCrudModalBody(defKey)}
        ${editing ? `<div style="margin-top:10px"><button class="danger" onclick="deleteCrudItem('${defKey}','${editing.id}')" style="background:#fff;border:1px solid #e0b0aa;color:#c0392b;border-radius:3px;padding:5px 10px;font:11px system-ui;cursor:pointer">Delete Record</button></div>` : ''}
      </div>
      <div class="crud-modal-footer">
        <button class="btn-cancel" onclick="closeCrudModal()">Cancel</button>
        <button class="btn-save" onclick="saveCrudForm('${defKey}')">Save</button>
      </div>
    </div>
  </div>`;
}
function closeCrudModal() { crudEditingId = null; renderCurrent(); }
function renderCrud(defKey) {
  const def = CRUD_DEFS[defKey];
  const fields = schemaFields(def.class);
  const compactFields = fields.filter(f => fieldACLFor(def.class, f).hasFlag('VISIBLE_COMPACT'));
  const searchableFields = fields.filter(f => fieldACLFor(def.class, f).hasFlag('SEARCHABLE'));
  const sortField = fields.find(f => fieldACLFor(def.class, f).hasFlag('SORTABLE'));
  let items = org.getCollection(def.collection);
  if (crudSearchTerm) {
    const term = crudSearchTerm.toLowerCase();
    items = items.filter(it => searchableFields.some(f => String(it[f] || '').toLowerCase().includes(term)));
  }
  if (sortField) items = [...items].sort((a, b) => (a[sortField] > b[sortField] ? 1 : a[sortField] < b[sortField] ? -1 : 0));
  const totalCount = items.length;
  const pageCount = Math.max(1, Math.ceil(totalCount / CRUD_PAGE_SIZE));
  if (crudPage >= pageCount) crudPage = pageCount - 1;
  if (crudPage < 0) crudPage = 0;
  const pageItems = items.slice(crudPage * CRUD_PAGE_SIZE, crudPage * CRUD_PAGE_SIZE + CRUD_PAGE_SIZE);
  const listHtml = pageItems.map(it => `
    <div class="crud-list-item ${crudEditingId === it.id ? 'selected' : ''}" onclick="selectCrudRecord('${it.id}')">
      ${compactFields.map(f => `<div>${fieldLabel(def.class, f)}: <b>${formatCrudValue(def.class, f, it[f])}</b></div>`).join('')}
    </div>`).join('') || `<div class="subtitle">No records yet.</div>`;
  const pagerHtml = totalCount > CRUD_PAGE_SIZE ? `<div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#555">
    <button onclick="changeCrudPage('${defKey}',-1)" ${crudPage===0?'disabled':''} style="padding:4px 10px;border:1px solid #bcc7d0;border-radius:3px;background:#fff;cursor:pointer">\u2039 Prev</button>
    <span>Page ${crudPage+1} of ${pageCount} (${totalCount} records)</span>
    <button onclick="changeCrudPage('${defKey}',1)" ${crudPage>=pageCount-1?'disabled':''} style="padding:4px 10px;border:1px solid #bcc7d0;border-radius:3px;background:#fff;cursor:pointer">Next \u203a</button>
  </div>` : '';
  return `<h2>${def.title} \u2014 Data Entry</h2><div class="subtitle">Master list \u2014 field visibility/edit rights read from each field's FieldACL (16-byte POSIX-style descriptor); acting as <b>${SESSION.name || '\u2014'}</b></div>` +
    `<div class="crud-toolbar"><input type="text" id="crud-search-input" placeholder="Search ${def.title.toLowerCase()}\u2026" value="${crudSearchTerm}" oninput="crudSearchTerm=this.value; crudPage=0; renderCurrent(true);" style="flex:1;padding:6px 8px;border:1px solid #bcc7d0;border-radius:3px;font:12px system-ui">` +
    `<button onclick="selectCrudRecord('')" style="background:#3b6fd1;color:#fff;border:1px solid #3b6fd1;border-radius:3px;padding:6px 12px;font:12px system-ui;cursor:pointer;margin-left:8px">+ Add ${def.title.replace(/s$/, '')}</button></div>` +
    `<div class="crud-shell"><div class="crud-list" style="max-width:none;flex:1 1 auto">${listHtml}${pagerHtml}</div></div>` +
    (crudEditingId !== null ? renderCrudModal(defKey) : '');
}

const toolbarIcon = new LoadingIcon();
toolbarIcon.mount(document.getElementById('toolbar-loading-icon'));
// Wraps any render/data operation with the toolbar icon's start/stop \u2014 today
// every renderCurrent() body is synchronous in-memory data, but reports will
// soon fetch real data (async): call withLoading(async () => { ...await fetch...
// }) around that future work and the toolbar icon will show/hide itself with
// no other plumbing needed.
async function withLoading(fn) {
  toolbarIcon.start();
  try { return await fn(); }
  finally { toolbarIcon.stop(); }
}
renderNav();
initSessionSelector();
renderCurrent();
</script>
</body>
