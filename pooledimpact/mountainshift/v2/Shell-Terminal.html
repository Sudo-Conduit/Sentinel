<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MSOS Shell Terminal</title>
<!--
  A thin terminal window on top of Shell.js's IIFE -- see
  MSOS-Shell.md and ShellServer.js's own header. This page has NO
  business logic of its own: it sends whatever line was typed to
  POST /exec and renders whatever comes back. Every real decision
  (what a command does, whether it's allowed to open a socket or
  spawn a process, job control) happens server-side in Shell.js; this
  file's only job is being a dumb terminal.
-->
<style>
    html, body { margin: 0; height: 100%; background: #0b0f10; color: #c9f2c9; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    #screen { padding: 12px; height: calc(100% - 40px); overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
    .line { margin: 0 0 2px 0; }
    .cmdline { color: #6cf07a; }
    .error { color: #ff8080; }
    #inputRow { display: flex; align-items: center; border-top: 1px solid #234; height: 40px; box-sizing: border-box; }
    #promptLabel { padding: 0 4px 0 12px; color: #6cf07a; white-space: pre; }
    #cmd { flex: 1; background: transparent; border: none; outline: none; color: inherit; font: inherit; padding: 0 12px 0 0; height: 100%; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="inputRow">
    <span id="promptLabel">/ $</span>
    <input id="cmd" autocomplete="off" autofocus spellcheck="false">
</div>
<script>
(function ()
{
    'use strict';
    var screen = document.getElementById('screen');
    var input = document.getElementById('cmd');
    var promptLabel = document.getElementById('promptLabel');
    var cwd = '/';
    var history = [];
    var historyIndex = 0;

    function appendLine(text, cls)
    {
        var div = document.createElement('div');
        div.className = 'line' + (cls ? ' ' + cls : '');
        div.textContent = text;
        screen.appendChild(div);
        screen.scrollTop = screen.scrollHeight;
    }

    function setPrompt(newCwd)
    {
        cwd = typeof newCwd === 'string' ? newCwd : cwd;
        promptLabel.textContent = cwd + ' $';
    }

    function runCommand(cmdline)
    {
        appendLine(cwd + ' $ ' + cmdline, 'cmdline');
        return fetch('/exec', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cmdline: cmdline })
        })
            .then(function (res) { return res.json(); })
            .then(function (data)
            {
                if (data.stdout) appendLine(data.stdout.replace(/\n$/, ''));
                setPrompt(data.cwd);
            })
            .catch(function (err)
            {
                appendLine('shell: connection error: ' + err.message, 'error');
            });
    }

    input.addEventListener('keydown', function (e)
    {
        if (e.key === 'Enter')
        {
            var cmdline = input.value;
            input.value = '';
            if (cmdline.trim().length > 0)
            {
                history.push(cmdline);
                historyIndex = history.length;
                runCommand(cmdline);
            }
        }
        else if (e.key === 'ArrowUp')
        {
            if (historyIndex > 0) { historyIndex--; input.value = history[historyIndex]; }
            e.preventDefault();
        }
        else if (e.key === 'ArrowDown')
        {
            if (historyIndex < history.length - 1) { historyIndex++; input.value = history[historyIndex]; }
            else { historyIndex = history.length; input.value = ''; }
            e.preventDefault();
        }
    });

    document.body.addEventListener('click', function () { input.focus(); });
    appendLine('MSOS Shell Terminal -- type a command and press Enter.');
})();
</script>
</body>
</html>
