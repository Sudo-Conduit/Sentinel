<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script>window.OM_SCENES = '[{"name":"Enter","dur":2,"desc":"A circle grows in and fades from black"},{"name":"Move","dur":2,"desc":"The circle glides across the stage"},{"name":"Exit","dur":1.5,"desc":"The circle shrinks away"}]';</script>
  <script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
</helmet>
<x-import component-from-global-scope="CompositionStage" from="./animations-v3.jsx" width="1280" height="720" scenes="{{ omScenes }}" playback="{{ omPlayback }}" bg="#0d1117" hint-size="100%,100%">
  <x-import component-from-global-scope="Piece" from="./SimpleAnimation-Scene.jsx" hint-size="100%,100%"></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { omScenes: window.OM_SCENES, omPlayback: window.OM_PLAYBACK };
  }
}
</script>
</body>
</html>
