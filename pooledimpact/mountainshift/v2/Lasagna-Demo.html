<body>
<h1>Lasagna Limit demo (Procd.js)</h1>
<p>Small 4&times;3 matrix, $S_\delta = S_0 + \delta P$, $\delta \to 0$ each tick (then loops). Real Jacobi SVD computes singular values live; $\sigma$, $\|\Delta S\|$, and $r_{\text{eff}}$ are all derived from the actual matrix, not simulated numbers.</p>
<button onclick="Procd.run('demo lasagna --ui')">Open UI panel</button>
<button onclick="Procd.run('demo lasagna --console')">Run in console (open DevTools)</button>
<button onclick="Procd.run('stop')">Stop all</button>
