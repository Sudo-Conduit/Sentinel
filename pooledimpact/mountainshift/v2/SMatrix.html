<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S-Matrix · Real WebLLM · Three.js</title>
    <style>
        /* ─── STYLES ─────────────────────────────────────────────────────────── */
        :root {
            --sidebar-width: 33.333vw;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b0f;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Everything that used to be positioned relative to the whole
           viewport (info/progress/tooltip/controls/console) now lives
           inside #viewport-area instead, which occupies the right two-
           thirds. Their own `position: absolute` rules are unchanged —
           they just resolve against this fixed positioned ancestor now
           instead of the full window. */
        #viewport-area {
            position: fixed;
            top: 54px;
            left: var(--sidebar-width);
            width: calc(100vw - var(--sidebar-width));
            height: calc(100vh - 54px);
            overflow: hidden;
        }
        #viewport-area #canvas-container {
            width: 100%;
            height: 100%;
        }

        #chat-panel {
            position: fixed;
            top: 54px;
            left: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 54px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            background: rgba(8, 10, 14, 0.92);
            backdrop-filter: blur(14px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: auto;
        }
        #chat-header {
            padding: 14px 14px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        #chat-header h1 {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        #chat-header .sub {
            margin-top: 4px;
            font-size: 9px;
            color: #8899bb;
        }
        .telemetry-row {
            display: flex;
            gap: 14px;
            margin-top: 10px;
        }
        .telemetry-item {
            display: flex;
            flex-direction: column;
        }
        .telemetry-label {
            font-size: 7px;
            color: #667799;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .telemetry-value {
            font-size: 13px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: #7af0ff;
        }
        .settings-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .mini-label {
            display: flex;
            flex-direction: column;
            font-size: 8px;
            color: #8899bb;
            gap: 2px;
        }
        .mini-label select,
        .mini-label input {
            background: #1a2a3a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #c8d6e5;
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 9px;
            font-family: inherit;
        }
        .mini-label input {
            width: 100px;
        }
        #reload-btn { font-size: 8px; padding: 5px 9px; align-self: flex-end; }
        #save-disk-btn { font-size: 8px; padding: 6px 10px; }
        #autosave-status { align-self: center; font-size: 8px; }
        #chat-log {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
        }
        #chat-log:empty::after {
            content: 'No messages yet — press ▶ Start, or type below once a model is loaded.';
            display: block;
            font-size: 10px;
            color: #556;
            padding: 8px 2px;
        }
        .chat-turn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 9px 11px;
            font-size: 11px;
            line-height: 1.45;
        }
        .chat-prompt {
            color: #7af0ff;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .chat-response {
            color: #c8d6e5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .chat-pending { color: #667799; font-style: italic; }
        .chat-f {
            margin-top: 5px;
            font-size: 9px;
            color: #b39bff;
        }
        #chat-input-row {
            display: flex;
            gap: 8px;
            padding: 4px;
            margin-bottom: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        #prompt-input {
            flex: 1;
            resize: none;
            overflow-y: hidden;
            background: #1a2a3a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #c8d6e5;
            border-radius: 8px;
            padding: 3px 5px;
            font-size: 11px;
            font-family: inherit;
            outline: none;
            max-height: 200px;
        }
        #prompt-input:focus { border-color: #7af0ff; }
        #prompt-input:disabled { opacity: 0.4; cursor: not-allowed; }
        #send-prompt-btn {
            align-self: flex-end;
            padding: 8px 6px;
            font-size: 9px;
        }

        #controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(14px);
            padding: 12px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 14px;
            font-size: 9px;
            color: #8899bb;
            pointer-events: auto;
            justify-content: flex-start;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        #controls select {
            background: #1a2a3a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #c8d6e5;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 9px;
            cursor: pointer;
            outline: none;
            font-family: inherit;
            min-width: 100px;
        }
        #controls select:focus {
            border-color: #7af0ff;
        }
        #controls .btn {
            background: rgba(122, 240, 255, 0.12);
            border: 1px solid rgba(122, 240, 255, 0.2);
            color: #7af0ff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        #controls .btn:hover {
            background: rgba(122, 240, 255, 0.2);
        }
        #controls .btn-start {
            background: rgba(46, 204, 113, 0.15);
            border-color: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
        }
        #controls .btn-start:hover {
            background: rgba(46, 204, 113, 0.25);
        }
        #controls .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #controls .btn-stop {
            background: rgba(231, 76, 60, 0.15);
            border-color: rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }
        #controls .btn-stop:hover {
            background: rgba(231, 76, 60, 0.25);
        }
        #controls .btn-stop:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #controls .btn-export {
            background: rgba(241, 196, 15, 0.12);
            border-color: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
        }
        #controls .btn-export:hover {
            background: rgba(241, 196, 15, 0.2);
        }
        #controls .stat {
            font-size: 8px;
            color: #667799;
        }
        #controls .stat .num {
            color: #fff;
            font-weight: 500;
        }
        #controls .stat .highlight {
            color: #ff6b6b;
            font-weight: 600;
        }
        #controls .stat .layer8 {
            color: #f39c12;
            font-weight: 600;
        }
        #controls .est-time {
            font-size: 8px;
            color: #7af0ff;
            font-weight: 500;
            min-width: 60px;
            text-align: center;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 10px;
            color: #8899bb;
            pointer-events: none;
            user-select: none;
            line-height: 1.4;
        }
        #info h1 {
            font-size: 13px;
            font-weight: 400;
            margin: 0 0 2px 0;
            color: #7af0ff;
        }
        #info .val {
            color: #fff;
            font-weight: 500;
        }
        #info .dim {
            color: #445566;
            font-size: 8px;
        }
        #info .model-label {
            color: #f1c40f;
            font-weight: 500;
        }
        #info .status {
            font-size: 8px;
            font-weight: 500;
        }

        #progress-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-width: 100px;
            text-align: right;
        }
        #progress-container .label {
            font-size: 7px;
            color: #445566;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #progress-container .value {
            font-size: 14px;
            font-weight: 300;
            color: #7af0ff;
        }
        #progress-container .sub {
            font-size: 8px;
            color: #667799;
        }

        #tooltip {
            position: absolute;
            z-index: 20;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 10px;
            color: #c8d6e5;
            pointer-events: none;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        #tooltip .highlight {
            color: #7af0ff;
            font-weight: 500;
        }

        #export-modal {
            position: fixed;
            z-index: 100;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
        }
        #export-modal.visible {
            display: flex;
        }
        #export-modal .modal-box {
            background: #111d2a;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px 20px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        #export-modal .modal-box h2 {
            font-weight: 400;
            font-size: 13px;
            color: #7af0ff;
            margin-bottom: 8px;
        }
        #export-modal .modal-box pre {
            background: #0b0b0f;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 8px;
            line-height: 1.4;
            color: #c8d6e5;
            overflow-x: auto;
            max-height: 50vh;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: pre-wrap;
            word-break: break-all;
        }
        #export-modal .modal-box .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        #export-modal .modal-box .actions button {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #8899bb;
        }
        #export-modal .modal-box .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        #export-modal .modal-box .actions .btn-copy {
            border-color: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }
        #export-modal .modal-box .actions .btn-copy:hover {
            background: rgba(46, 204, 113, 0.15);
        }
        #export-modal .modal-box .actions .btn-close {
            border-color: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }
        #export-modal .modal-box .actions .btn-close:hover {
            background: rgba(231, 76, 60, 0.15);
        }

        /* ─── CONSOLE PANEL ──────────────────────────────────────────────── */

        #console-toggle {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 15;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #7af0ff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        #console-toggle:hover {
            background: rgba(122, 240, 255, 0.12);
        }
        #console-toggle .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #445566;
            transition: background 0.2s;
        }
        #console-toggle .dot.active {
            background: #2ecc71;
            box-shadow: 0 0 6px #2ecc71;
        }
        #console-toggle .dot.error {
            background: #e74c3c;
            box-shadow: 0 0 6px #e74c3c;
        }

        #console-panel {
            position: absolute;
            bottom: 76px;
            right: 20px;
            z-index: 15;
            width: 380px;
            max-width: 90vw;
            height: 260px;
            background: rgba(6, 8, 14, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
            display: none;
            flex-direction: column;
            opacity: 0.6;
            overflow: hidden;
        }
        #console-panel.visible {
            display: flex;
        }
        #console-panel .console-header {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 9px;
            color: #7af0ff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        #console-panel .console-header .console-actions {
            display: flex;
            gap: 8px;
        }
        #console-panel .console-header button {
            background: none;
            border: none;
            color: #667799;
            font-size: 9px;
            cursor: pointer;
            text-transform: uppercase;
        }
        #console-panel .console-header button:hover {
            color: #c8d6e5;
        }
        #console-log {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 9px;
            line-height: 1.5;
        }
        #console-log::-webkit-scrollbar {
            width: 6px;
        }
        #console-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .log-line {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 2px;
            color: #8899bb;
        }
        .log-line .log-time {
            color: #445566;
            margin-right: 6px;
        }
        .log-line.log-info { color: #8899bb; }
        .log-line.log-success { color: #2ecc71; }
        .log-line.log-warn { color: #f1c40f; }
        .log-line.log-error { color: #e74c3c; }
        .log-line.log-progress { color: #7af0ff; }
        .log-line.log-header { color: #c8d6e5; font-weight: 600; }

        /* ─── LAYOUT TOGGLE ──────────────────────────────────────────────── */

        #controls .btn-layout {
            background: rgba(155, 120, 255, 0.12);
            border-color: rgba(155, 120, 255, 0.25);
            color: #b39bff;
        }
        #controls .btn-layout:hover {
            background: rgba(155, 120, 255, 0.22);
        }

        @media (max-width: 700px) {
            :root { --sidebar-width: 0px; }
            #viewport-area {
                left: 0;
                width: 100vw;
                top: 54px;
                height: calc(100vh - 54px);
            }
            #chat-panel {
                top: 54px;
                width: 100vw;
                height: auto;
                bottom: 70px;
                max-height: 260px;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            #controls {
                top: 0;
                left: 0;
                right: 0;
                padding: 8px 10px;
                gap: 6px;
                font-size: 7px;
                flex-wrap: wrap;
            }
            #controls select {
                min-width: 60px;
                font-size: 7px;
                padding: 2px 4px;
            }
            #controls .btn {
                padding: 4px 8px;
                font-size: 7px;
            }
            #info {
                top: 62px;
                left: 8px;
                padding: 4px 8px;
                font-size: 7px;
            }
            #info h1 {
                font-size: 10px;
            }
            #progress-container {
                top: 62px;
                right: 8px;
                padding: 4px 8px;
                min-width: 60px;
            }
            #progress-container .value {
                font-size: 11px;
            }
            #export-modal .modal-box {
                padding: 8px 10px;
            }
            #export-modal .modal-box pre {
                font-size: 6px;
            }
            #console-toggle {
                bottom: 320px;
                right: 8px;
                padding: 6px 9px;
                font-size: 7px;
            }
            #console-panel {
                bottom: 54px;
                right: 8px;
                width: calc(100vw - 16px);
                height: 200px;
            }
            #chat-panel {
                top: auto;
                bottom: 70px;
                left: 50%;
                transform: translateX(-50%);
                width: calc(100vw - 16px);
                height: 260px;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            }
            .chat-turn, .chat-f { font-size: 8px; }
            #prompt-input { font-size: 10px; }
            #chat-header { padding: 6px 8px; }
            #chat-header h1 { font-size: 10px; }
            .telemetry-row, .settings-row { gap: 6px; margin-top: 5px; }
            .telemetry-value { font-size: 10px; }
            .mini-label input { width: 70px; }
        }
    </style>
    <script src="./BaseClassX.js"></script>
    <script src="./Environment.js"></script>
    <script src="./CPU.js"></script>
    <script src="./Physical.js"></script>
    <script src="./Memory.js"></script>
    <script src="./Kernel.js"></script>
    <script src="./BIOS.js"></script>
    <script src="./Procd.js"></script>
</head>
<body>

    <div id="chat-panel">
        <div id="chat-header">

            <div class="telemetry-row">
                <span class="telemetry-item">
                    <span class="telemetry-label">GFLOP/s</span>
                    <span class="telemetry-value" id="gflops-text">0.00</span>
                </span>
                <span class="telemetry-item">
                    <span class="telemetry-label">tok/s</span>
                    <span class="telemetry-value" id="toksec-text">0.0</span>
                </span>
                <span class="telemetry-item">
                    <span class="telemetry-label">F<sub>global</sub></span>
                    <span class="telemetry-value" id="global-f-text" style="color:#b39bff;">0.0000</span>
                </span>
                <span class="telemetry-item">
                    <span class="telemetry-label">⏱ tok/s</span>
                    <span class="telemetry-value" id="toksec-display">0.0</span>
                </span>
            </div>

            <details style="margin-top:4px;">
                <summary style="cursor:pointer; font-size:9px; color:#8899bb; user-select:none; padding:4px 0;">▼ Settings</summary>

            <div class="settings-row">
                <label class="mini-label">
                    Cache
                    <select id="cache-backend-select">
                        <option value="cache">Cache API</option>
                        <option value="indexeddb" selected>IndexedDB (default)</option>
                        <option value="opfs">OPFS</option>
                    </select>
                </label>
                <label class="mini-label">
                    Ctx size
                    <input type="range" id="context-window-slider" min="256" max="8192" step="256" value="4096" style="width:80px;">
                    <span id="ctx-display">4096</span>
                </label>
                <label class="mini-label">
                    Ctx window
                    <input type="number" id="context-window-input" min="256" step="256" placeholder="model default">
                </label>
                <button class="btn" id="reload-btn" disabled title="Unload the current model and reload with the settings above">⟳ Reload</button>
            </div>

            <div class="settings-row">
                <button class="btn btn-export" id="save-disk-btn" title="Write the live Matrix (GlobalState tree) to a file on disk">💾 Save Matrix to Disk</button>
                <details style="display:inline-block; margin-left: 8px;">
                    <summary style="cursor:pointer; font-size:9px; color:#8899bb; user-select:none;">▼ Export/Import</summary>
                    <div style="background:#0a0a0f; border:1px solid rgba(255,255,255,0.08); border-radius:6px; padding:8px; margin-top:4px; min-width:200px;">
                        <div style="display:flex; flex-direction:column; gap:4px;">
                            <button class="btn btn-export" id="export-basekv-btn" title="Export pristine model KV cache">📤 Export BaseKV</button>
                            <button class="btn" id="load-basekv-btn" title="Load BaseKV from disk">📥 Load BaseKV</button>
                            <button class="btn btn-export" id="export-mlc-btn" title="Export model config">📤 Export MLC</button>
                            <button class="btn" id="load-mlc-btn" title="Load MLC config">📥 Load MLC</button>
                            <button class="btn btn-export" id="export-mlc-archive-btn" title="Export entire model archive">📦 Export MLC Archive</button>
                            <button class="btn" id="import-mlc-archive-btn" title="Import MLC archive">📥 Import MLC Archive</button>
                            <button class="btn" id="import-session-btn" title="Import session from disk">📂 Import Session</button>
                        </div>
                    </div>
                </details>

                            this[key] = undefined;
                        }
                    }
                }
            }

            if (typeof this.afterConstruct === 'function') {
                this.afterConstruct(options);
            }

            this._recordTrace('init', {
                id: this.id,
                type: this.type,
                name: this.name,
                version: this.version,
                debuggerEnabled: this._debugState.enabled
            });

            return new Proxy(this, proxyHandler);
        }

        // ─── ID GENERATION ────────────────────────────────────
        generateId() {
            const ts = Date.now().toString(36);
            const rnd = Math.random().toString(36).substring(2, 8);
            return `${this.type || 'Node'}_${ts}_${rnd}`;
        }

        // ─── FINGERPRINTING ───────────────────────────────────
        computeFingerprint() {
            const data = JSON.stringify({
                id: this.id,
                type: this.type,
                name: this.name,
                source: this.source,
                version: this.version,
                created: this.created,
                tags: this.tags.slice().sort(),
                metadataKeys: Object.keys(this.metadata).sort()
            });
            return this.hashString(data);
        }

        hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(36);
        }

        // ─── INTERNAL HELPERS (v1.4.00) ───────────────────────────
        _assertAlive() {
            if (this._disposed) {
                throw new Error(`Node ${this.id} has been disposed`);
            }
        }

        static _makeError(message, code) {
            const err = new Error(message);
            err.code = code;
            return err;
        }

        _captureObject(obj, seen, depth = 0) {
            const MAX_DEPTH = 100;
            if (depth > MAX_DEPTH) {
                return { _ref: 'max-depth-exceeded' };
            }
            if (!obj || typeof obj !== 'object') return obj;
            if (seen.has(obj)) return { _ref: 'circular' };
            seen.add(obj);

            const result = {};
            for (const key of Object.keys(obj)) {
                const value = obj[key];
                if (value && typeof value === 'object') {
                    if (value === this) {
                        result[key] = { _ref: this.id || 'self' };
                    } else if (value instanceof BaseClassX) {
                        result[key] = value._captureState(seen, depth + 1);
                    } else {
                        result[key] = this._captureObject(value, seen, depth + 1);
                    }
                } else {
                    result[key] = value;
                }
            }
            return result;
        }

        _restoreState(state) {
            if (!state) return this;
            for (const key of Object.keys(state)) {
                const value = state[key];
                if (value && typeof value === 'object' && value._ref) {
                    if (value._ref === 'self' || value._ref === this.id) {
                        this[key] = this;
                    } else {
                        this[key] = { _pendingRef: value._ref };
                    }
                    continue;
                }
                if (key === 'children' && Array.isArray(value)) {
                    continue;
                }
                this[key] = value;
            }
            this.fingerprint = state.fingerprint || this.computeFingerprint();
            return this;
        }

        verifyFingerprint() {
            return this.fingerprint === this.computeFingerprint();
        }

        // ─── TREE MANAGEMENT ──────────────────────────────────
        _rebuildChildMap() {
            this._childMap.clear();
            for (const ch of this.children) {
                if (ch.name) this._childMap.set(ch.name, ch);
            }
        }

        child(name) {
            return this._childMap.get(name) || undefined;
        }

        get(name) {
            return this._childMap.get(name) || undefined;
        }

        addChild(ch) {
            if (!(ch instanceof BaseClassX)) {
                throw new Error('Child must be an instance of BaseClassX');
            }
            this.children.push(ch);
            ch.parent = this;
            if (ch.name) this._childMap.set(ch.name, ch);
            this.modified = Date.now();
            this._recordTrace('add_child', {
                childId: ch.id,
                childName: ch.name
            });
            this.emit('add_child', {
                childId: ch.id,
                childName: ch.name
            });
            return this;
        }

        addChildren(children) {
            for (const ch of children) this.addChild(ch);
            return this;
        }

        removeChild(ch) {
            const index = this.children.indexOf(ch);
            if (index !== -1) {
                this.children.splice(index, 1);
                if (ch.name) this._childMap.delete(ch.name);
                ch.parent = null;
                this.modified = Date.now();
                this._recordTrace('remove_child', {
                    childId: ch.id
                });
                this.emit('remove_child', {
                    childId: ch.id
                });
            }
            return this;
        }

        getChildren() {
            return this.children;
        }

        getDescendants() {
            let desc = [];
            for (const ch of this.children) {
                desc.push(ch);
                desc = desc.concat(ch.getDescendants());
            }
            return desc;
        }

        resolve(path) {
            const parts = path.split('.');
            let current = this;
            for (const part of parts) {
                const found = current.get(part);
                if (!found) {
                    console.warn(`Path "${path}" failed at "${part}"`);
                    return undefined;
                }
                current = found;
            }
            return current;
        }

        findByName(name) {
            if (this.name === name) return this;
            for (const ch of this.children) {
                const found = ch.findByName(name);
                if (found) return found;
            }
            return undefined;
        }

        findByType(type) {
            const results = [];
            if (this.type === type) results.push(this);
            for (const ch of this.children) results.push(...ch.findByType(type));
            return results;
        }

        // ─── STATE MANAGEMENT ────────────────────────────────
        updateState(newState) {
            const oldState = this.state;
            this.state = newState;
            if (this._maxHistoryLength === 0 || this.history.length < this._maxHistoryLength) {
                this.history.push(oldState);
            }
            this._recordTrace('state_change', {
                newState,
                oldState
            });
            this.emit('state_changed', {
                oldState,
                newState,
                node: this
            });
            this.modified = Date.now();
            return this;
        }

        // ─── TAGS ────────────────────────────────────────────
        addTag(tag) {
            if (!this.tags.includes(tag)) {
                this.tags.push(tag);
                this._recordTrace('add_tag', {
                    tag
                });
                this.emit('tag_added', {
                    tag
                });
                this.modified = Date.now();
            }
            return this;
        }

        removeTag(tag) {
            const idx = this.tags.indexOf(tag);
            if (idx !== -1) {
                this.tags.splice(idx, 1);
                this._recordTrace('remove_tag', {
                    tag
                });
                this.emit('tag_removed', {
                    tag
                });
                this.modified = Date.now();
            }
            return this;
        }

        hasTag(tag) {
            return this.tags.includes(tag);
        }

        getTags() {
            return this.tags;
        }

        // ─── METADATA ─────────────────────────────────────────
        setMetadata(key, value) {
            this.metadata[key] = value;
            this._recordTrace('set_metadata', {
                key,
                value
            });
            this.emit('metadata_changed', {
                key,
                value
            });
            this.modified = Date.now();
            return this;
        }

        getMetadata(key) {
            return this.metadata[key];
        }

        removeMetadata(key) {
            if (key in this.metadata) {
                delete this.metadata[key];
                this._recordTrace('remove_metadata', {
                    key
                });
                this.emit('metadata_removed', {
                    key
                });
                this.modified = Date.now();
            }
            return this;
        }

        hasMetadata(key) {
            return key in this.metadata;
        }

        // ─── DISSONANCE (CONFLICT TRACKING) ───────────────────
        addDissonance(amount) {
            this.dissonance += amount;
            this._recordTrace('add_dissonance', {
                amount
            });
            this.emit('dissonance_added', {
                amount,
                total: this.dissonance
            });
            this.modified = Date.now();
            return this;
        }

        resolveDissonance(amount) {
            this.dissonance = Math.max(0, this.dissonance - amount);
            this._recordTrace('resolve_dissonance', {
                amount
            });
            this.emit('dissonance_resolved', {
                amount,
                remaining: this.dissonance
            });
            this.modified = Date.now();
            return this;
        }

        // ─── ANOMALIES (KNOWN ISSUES) ────────────────────────
        addAnomaly(anomaly) {
            const item = {
                ...anomaly,
                id: anomaly.id || `anomaly_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                addedAt: anomaly.addedAt || Date.now()
            };
            this.anomalies.push(item);
            this._recordTrace('add_anomaly', {
                anomaly: item
            });
            this.emit('anomaly_added', {
                anomaly: item
            });
            this.modified = Date.now();
            return this;
        }

        removeAnomaly(index) {
            if (index >= 0 && index < this.anomalies.length) {
                const removed = this.anomalies.splice(index, 1)[0];
                this._recordTrace('remove_anomaly', {
                    index,
                    anomaly: removed
                });
                this.emit('anomaly_removed', {
                    index,
                    anomaly: removed
                });
                this.modified = Date.now();
            }
            return this;
        }

        resolveAnomaly(index, resolution) {
            if (index >= 0 && index < this.anomalies.length) {
                this.anomalies[index].resolved = true;
                this.anomalies[index].resolution = resolution;
                this.anomalies[index].resolvedAt = Date.now();
                this._recordTrace('resolve_anomaly', {
                    index,
                    resolution
                });
                this.emit('anomaly_resolved', {
                    index,
                    resolution
                });
                this.modified = Date.now();
            }
            return this;
        }

        // ─── BATCHING ────────────────────────────────────────
        batch(fn) {
            this._batching = true;
            this._batchEvents = [];
            this._recordTrace('batch_start', {});
            try {
                fn.call(this);
            } finally {
                this._batching = false;
                this._recordTrace('batch_end', {
                    eventCount: this._batchEvents.length
                });
                if (this._batchEvents.length > 0) {
                    this.history.push({
                        event: 'batch',
                        timestamp: Date.now(),
                        state: this.state,
                        dissonance: this.dissonance,
                        events: this._batchEvents
                    });
                    this._batchEvents = [];
                    this._pruneHistory();
                    this.emit('batch', {
                        count: this._batchEvents.length
                    });
                }
            }
            return this;
        }

        // ─── EVENT SYSTEM ────────────────────────────────────
        on(eventType, handler) {
            if (!this._listeners.has(eventType)) {
                this._listeners.set(eventType, []);
            }
            this._listeners.get(eventType).push(handler);
            return this;
        }

        off(eventType, handler) {
            if (this._listeners.has(eventType)) {
                const handlers = this._listeners.get(eventType);
                const index = handlers.indexOf(handler);
                if (index !== -1) {
                    handlers.splice(index, 1);
                }
            }
            return this;
        }

        emit(eventType, data) {
            if (this._batching) {
                this._batchEvents.push({
                    type: eventType,
                    data
                });
                return this;
            }
            if (this._listeners.has(eventType)) {
                const handlers = this._listeners.get(eventType);
                for (const handler of handlers) {
                    try {
                        handler(data);
                    } catch (e) {
                        console.error(`Error in event handler for ${eventType}:`, e);
                    }
                }
            }
            return this;
        }

        recordEvent(eventType, data = {}) {
            const entry = {
                event: eventType,
                timestamp: Date.now(),
                state: this.state,
                dissonance: this.dissonance,
                ...data
            };
            if (this._batching) {
                this._batchEvents.push(entry);
            } else {
                this.history.push(entry);
                this._pruneHistory();
                this.emit(eventType, entry);
            }
            return this;
        }

        _pruneHistory() {
            if (this._maxHistoryLength > 0 && this.history.length > this._maxHistoryLength) {
                this.history = this.history.slice(-this._maxHistoryLength);
            }
        }

        pruneHistory(keep) {
            if (keep > 0) {
                this.history = this.history.slice(-keep);
            } else {
                this.history = [];
            }
            this._recordTrace('prune_history', {
                keep
            });
            return this;
        }

        // ─── GRAPH LINKING (relational projection support) ────
        /**
         * Create a directed edge from this node to `target`.
         * Populates both sides so RelationalProjection can traverse
         * in either direction without re-scanning the whole graph.
         */
        linkTo(target, label = null) {
            this._assertAlive();
            const edge = { source: this, target, label, timestamp: Date.now() };
            this.outEdges.push(edge);
            target.inEdges.push(edge);
            this._recordTrace('link_to', { targetId: target.id, label });
            return edge;
        }

        unlinkFrom(target) {
            this._assertAlive();
            this.outEdges = this.outEdges.filter(e => e.target !== target);
            target.inEdges = target.inEdges.filter(e => e.source !== this);
            this._recordTrace('unlink_from', { targetId: target.id });
            return this;
        }

        // ─── TRACE RECORDING ──────────────────────────────────
        _recordTrace(type, data = {}) {
            const entry = {
                timestamp: Date.now(),
                type,
                data,
                fingerprint: this.fingerprint,
                debugger: {
                    enabled: this._debugState.enabled,
                    isPaused: this._debugState.isPaused,
                    stepMode: this._debugState.stepMode
                }
            };
            this._trace.push(entry);

            if (this._maxTraceLength > 0 && this._trace.length > this._maxTraceLength) {
                this._trace.shift();
            }

            return entry;
        }

        get trace() {
            return this._trace;
        }

        clearTrace() {
            this._trace = [];
            this._recordTrace('clear_trace', {});
            return this;
        }

        // ─── PROPERTY SETTERS (v1.4.00 restoration) ────────────
        setType(type) {
            this._assertAlive();
            this.type = type;
            this._recordTrace('set_type', { type });
            return this;
        }

        setName(name) {
            this._assertAlive();
            this.name = name;
            this._recordTrace('set_name', { name });
            return this;
        }

        setSource(source) {
            this._assertAlive();
            this.source = source;
            this._recordTrace('set_source', { source });
            return this;
        }

        setVersion(version) {
            this._assertAlive();
            this.version = version;
            this._recordTrace('set_version', { version });
            return this;
        }

        // ─── UTILITY PROPERTIES (v1.4.00) ────────────────────────
        get tokenEstimate() {
            return this.toString().length / 4;
        }

        get maxIndentDepth() {
            const str = this.toString();
            let maxDepth = 0, cur = 0;
            for (const ch of str) {
                if ('{[('.includes(ch)) {
                    cur++;
                    if (cur > maxDepth) maxDepth = cur;
                } else if ('}])'.includes(ch)) cur--;
            }
            return maxDepth;
        }

        get topLevelCount() {
            return this.children.length;
        }

        get charCount() {
            return this.toString().length;
        }

        get estSizeKB() {
            return this.charCount / 1024;
        }

        // ─── ANOMALY ACCESS (v1.4.00) ────────────────────────────
        getAnomalies() {
            return this.anomalies;
        }

        // ─── RELATIONSHIP CHECKS (v1.4.00) ───────────────────────
        isDescendantOf(ancestor) {
            let cur = this.parent;
            while (cur) {
                if (cur === ancestor) return true;
                cur = cur.parent;
            }
            return false;
        }

        isAncestorOf(descendant) {
            return descendant.isDescendantOf(this);
        }

        // ─── SNAPSHOT & RESTORE (v1.4.00 restoration) ─────────
        snapshot() {
            return {
                schemaVersion: SCHEMA_VERSION,
                id: this.id,
                fingerprint: this.fingerprint,
                state: this.state,
                metadata: { ...this.metadata },
                tags: [...this.tags],
                children: this.children.map(c => c.snapshot()),
                history: [...this.history],
                dissonance: this.dissonance,
                anomalies: [...this.anomalies],
                rippleCount: this.rippleCount,
                created: this.created,
                modified: this.modified,
                trace: [...this._trace]
            };
        }

        restore(snapshot) {
            this._assertAlive();
            if (snapshot.schemaVersion && snapshot.schemaVersion !== SCHEMA_VERSION) {
                console.warn(`BaseClassX.restore: snapshot schema ${snapshot.schemaVersion}!==current ${SCHEMA_VERSION}`);
            }
            if (this.id !== snapshot.id) {
                throw new Error('Cannot restore snapshot to a different node');
            }
            this.state = snapshot.state;
            this.metadata = { ...snapshot.metadata };
            this.tags = [...snapshot.tags];
            this.history = [...snapshot.history];
            this.dissonance = snapshot.dissonance || 0;
            this.anomalies = snapshot.anomalies || [];
            this.rippleCount = snapshot.rippleCount || 0;
            this._trace = snapshot.trace || [];
            this.modified = Date.now();
            return this;
        }

        // ─── DUPLICATION (v1.4.00 restoration) ────────────────
        copy() {
            const c = new BaseClassX({
                id: this.id,
                type: this.type,
                name: this.name,
                source: this.source,
                version: this.version,
                created: this.created,
                modified: this.modified,
                state: this.state,
                tags: [...this.tags],
                metadata: { ...this.metadata },
                history: [...this.history],
                fingerprint: this.fingerprint,
                parent: this.parent,
                children: [...this.children],
                dissonance: this.dissonance,
                anomalies: [...this.anomalies],
                rippleCount: this.rippleCount,
                tokenDivisor: this._tokenDivisor,
                maxHistoryLength: this._maxHistoryLength,
                trace: [...this._trace],
                captureState: this._captureState
            });
            c._childMap = new Map(this._childMap);
            return c;
        }

        clone() {
            const schema = this.constructor._schema || (BaseClassX.getSchema ? BaseClassX.getSchema(this.type) : null);
            const parentSchema = this.constructor._parentSchema;
            const schemaProps = {};
            for (const s of [schema, parentSchema].filter(Boolean)) {
                if (!s.properties) continue;
                for (const key of Object.keys(s.properties)) {
                    schemaProps[key] = this[key];
                }
            }

            const c = new this.constructor({
                type: this.type,
                name: this.name,
                source: this.source,
                version: this.version,
                created: this.created,
                state: this.state,
                tags: [...this.tags],
                metadata: { ...this.metadata },
                history: [...this.history],
                dissonance: this.dissonance,
                anomalies: [...this.anomalies],
                rippleCount: this.rippleCount,
                tokenDivisor: this._tokenDivisor,
                maxHistoryLength: this._maxHistoryLength,
                trace: [...this._trace],
                captureState: this._captureState,
                // ─── LINEAGE (v2.2.01) ────────────────────────
                // Track where this clone came from, so ancestry is
                // recoverable without re-diffing fingerprints.
                cloneOf: this.id,
                cloneOrigin: this._cloneOrigin || this.id,
                cloneGeneration: (this._cloneGeneration || 0) + 1,
                // Carry forward subclass schema properties, not just
                // the fixed base fields above.
                ...schemaProps
            });
            c._recordTrace('cloned_from', {
                sourceId: this.id,
                cloneOrigin: c._cloneOrigin,
                cloneGeneration: c._cloneGeneration
            });
            for (const ch of this.children) {
                c.addChild(ch.clone());
            }
            return c;
        }

        // ─── REPLAY ───────────────────────────────────────────
        replay(trace, expectedFingerprint) {
            const entries = trace || this._trace;
            const expected = expectedFingerprint || this.fingerprint;

            const fresh = new this.constructor();

            for (const entry of entries) {
                const handler = REPLAY_HANDLERS[entry.type];
                if (handler) {
                    handler(fresh, entry);
                } else if (entry.type === 'add_child') {
                    // Skip child recreation
                } else if (typeof fresh[entry.type] === 'function') {
                    fresh[entry.type](...(entry.data.args || []));
                } else {
                    console.warn(`No replay handler for trace type: ${entry.type}`);
                }
            }

            fresh.fingerprint = fresh.computeFingerprint();

            if (fresh.fingerprint !== expected) {
                console.warn(`Replayed state fingerprint does not match original. Expected: ${expected}, Got: ${fresh.fingerprint}`);
            }

            return fresh;
        }

        // ─── PARENT/CHILD RELATIONSHIP ────────────────────────
        get parent() {
            return this._parentRef ? (this._parentRef.deref ? this._parentRef.deref() : null) : null;
        }

        set parent(node) {
            if (node === null || node === undefined) {
                this._parentRef = null;
            } else {
                this._parentRef = typeof WeakRef !== 'undefined' ? new WeakRef(node) : {
                    deref: () => node
                };
            }
            this._recordTrace('parent_change', {
                parentId: node ? node.id : null
            });
        }

        // ─── COMPARISON & DIFF ────────────────────────────────
        diff(other, options = {}) {
            const changes = [];

            if (this.id !== other.id) changes.push({
                field: 'id',
                from: this.id,
                to: other.id
            });
            if (this.type !== other.type) changes.push({
                field: 'type',
                from: this.type,
                to: other.type
            });
            if (this.name !== other.name) changes.push({
                field: 'name',
                from: this.name,
                to: other.name
            });
            if (this.state !== other.state) changes.push({
                field: 'state',
                from: this.state,
                to: other.state
            });
            if (this.dissonance !== other.dissonance) changes.push({
                field: 'dissonance',
                from: this.dissonance,
                to: other.dissonance
            });

            const thisTagSet = new Set(this.tags);
            const otherTagSet = new Set(other.tags);
            for (const tag of thisTagSet) {
                if (!otherTagSet.has(tag)) changes.push({
                    field: 'tags',
                    action: 'removed',
                    tag
                });
            }
            for (const tag of otherTagSet) {
                if (!thisTagSet.has(tag)) changes.push({
                    field: 'tags',
                    action: 'added',
                    tag
                });
            }

            for (const key of Object.keys(this.metadata)) {
                if (this.metadata[key] !== other.metadata[key]) {
                    changes.push({
                        field: 'metadata',
                        action: 'changed',
                        key,
                        from: this.metadata[key],
                        to: other.metadata[key]
                    });
                }
            }
            for (const key of Object.keys(other.metadata)) {
                if (!(key in this.metadata)) {
                    changes.push({
                        field: 'metadata',
                        action: 'added',
                        key,
                        value: other.metadata[key]
                    });
                }
            }

            const thisChildMap = new Map(this.children.map(c => [c.id, c]));
            const otherChildMap = new Map(other.children.map(c => [c.id, c]));

            for (const [id] of thisChildMap) {
                if (!otherChildMap.has(id)) changes.push({
                    field: 'children',
                    action: 'removed',
                    childId: id
                });
            }
            for (const [id, otherChild] of otherChildMap) {
                if (!thisChildMap.has(id)) {
                    changes.push({
                        field: 'children',
                        action: 'added',
                        childId: id
                    });
                } else if (options.recursive) {
                    const childDiffs = thisChildMap.get(id).diff(otherChild, options);
                    if (childDiffs.length > 0) {
                        changes.push({
                            field: 'children',
                            action: 'changed',
                            childId: id,
                            changes: childDiffs
                        });
                    }
                }
            }

            return changes;
        }

        equals(other) {
            if (!(other instanceof BaseClassX)) return false;
            return this.id === other.id && this.fingerprint === other.fingerprint;
        }

        // ─── FREEZING ─────────────────────────────────────────
        freeze() {
            const frozenHandler = {
                get(target, prop) {
                    const val = target[prop];
                    if (typeof val === 'function') {

            // Check inherited parent schema

                return this._validatePropertySchema(prop, value, mergedSchema);

                    readable: parentProp.readable !== false,
                    writable: parentProp.writable !== false,
                    modifiable: parentProp.modifiable !== false,
                    mixinable: parentProp.mixinable !== false

                readable: childOverride.readable !== undefined ? childOverride.readable : (parentProp.readable !== false),
                writable: childOverride.writable !== undefined ? childOverride.writable : (parentProp.writable !== false),
                modifiable: childOverride.modifiable !== undefined ? childOverride.modifiable : (parentProp.modifiable !== false),

        // DUAL SYSTEM: Separate from trace replay

        /**
         * Append this instance to global vector

        appendToVector(data) {
            const hash = this._computeHash({ state: this.state, value: this.value });
            const now = Date.now();

            // Confidence reflects how much to trust this transition:
            // - higher accumulated dissonance (unresolved conflicts/anomalies) lowers it
            // - transitions that happen in rapid succession (thrashing) lower it
            // - a node with no prior vector history starts at full confidence
            const priorEntries = GlobalVector.getEntries(this.id);
            const lastEntry = priorEntries[priorEntries.length - 1];
            const msSinceLast = lastEntry ? now - lastEntry.timestamp : null;

            const dissonancePenalty = Math.min(1, this.dissonance / 10);
            const thrashPenalty = (msSinceLast !== null && msSinceLast < 50)
                ? Math.min(0.5, (50 - msSinceLast) / 100)
                : 0;

            const confidence = Math.max(0, Math.min(1,
                1 - dissonancePenalty - thrashPenalty
            ));

            const entry = GlobalVector.append({
                id: this.id,
                hash,
                data,
                state: this.state,
                confidence,
                timestamp: now
            });
            this.vectorIndex = entry.index;
            this.currentHash = hash;
            this.accumHash = entry.entry.accumHash || hash;
            this.lastVectorTime = entry.entry.timestamp;
            return entry;
        }

            return {

                nodeCount: entries.length,
                nodes: entries.map((e, idx) => ({
                    index: idx,
                    hash: e.hash,
                    accumHash: e.accumHash,
                    timestamp: e.timestamp
                }))
            };
        }

         */

            return GlobalVector.getEntries(this.id);
        }

         * @private
         */
        _computeHash(data) {
            const str = JSON.stringify(data);
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(16);
        }
