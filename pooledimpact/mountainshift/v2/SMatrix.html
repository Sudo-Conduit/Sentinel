                }

                const particleGeo = new THREE.BufferGeometry();
                particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const particleMat = new THREE.PointsMaterial({
                    size: 0.05 + normalized * 0.08,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6 + normalized * 0.35,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true
                });
                const particles = new THREE.Points(particleGeo, particleMat);
                layerGroup.add(particles);

                const sphereGeo = new THREE.SphereGeometry(0.10 + normalized * 0.14, 12, 12);
                const sphereMat = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.2 + normalized * 0.6,
                    roughness: 0.2,
                    metalness: 0.1
                });
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                sphere.userData = { layer: l, delta: delta, normalized: normalized };
                layerGroup.add(sphere);

                brainGroup.add(layerGroup);

                // Raycasting works on world-space meshes regardless of parent
                // transforms, so clickableMeshes still just needs the sphere.
                clickableMeshes.push(sphere);
            }

            const wireMat = new THREE.LineBasicMaterial({
                color: 0x2a4a7a,
                transparent: true,
                opacity: 0.05
            });

            for (let i = 0; i < 60; i++) {
                const l1 = Math.floor(Math.random() * LAYERS);
                const l2 = Math.floor(Math.random() * LAYERS);
                if (Math.abs(l1 - l2) < 2) continue;

                const p1 = layerTransform(l1).position;
                const p2 = layerTransform(l2).position;
                const y1 = p1.y, y2 = p2.y;
                const angle1 = Math.random() * Math.PI * 2;
                const angle2 = angle1 + (Math.random() - 0.5) * 1.5;
                const r1 = 0.5 + Math.random() * 2.8;
                const r2 = 0.5 + Math.random() * 2.8;

                const mid1 = new THREE.Vector3().lerpVectors(p1, p2, 0.3);
                const mid2 = new THREE.Vector3().lerpVectors(p1, p2, 0.7);

                const pts = [
                    new THREE.Vector3(p1.x + Math.cos(angle1) * r1, y1, p1.z + Math.sin(angle1) * r1),
                    new THREE.Vector3(mid1.x + Math.cos(angle2) * r2, mid1.y, mid1.z + Math.sin(angle2) * r2),
                    new THREE.Vector3(mid2.x + Math.cos(angle2) * r2 * 0.7, mid2.y, mid2.z + Math.sin(angle2) * r2 * 0.7),
                    new THREE.Vector3(p2.x + Math.cos(angle2) * r2, y2, p2.z + Math.sin(angle2) * r2)
                ];
                const curve = new THREE.CatmullRomCurve3(pts);
                const curvePts = curve.getPoints(10);
                const geo = new THREE.BufferGeometry().setFromPoints(curvePts);
                const line = new THREE.Line(geo, wireMat);
                brainGroup.add(line);
            }
        }

        // ─── GLOBAL PULSE (session-wide F) ─────────────────────────────────
        // buildBrain()/updateBrainFromDeltas() animate LOCAL state — the
        // current message's token-by-token ΔS, fast and per-layer. This is
        // the GLOBAL counterpart: one persistent halo (not rebuilt every
        // call, unlike the per-layer meshes) whose scale/brightness track
        // GlobalState.F — the Frobenius norm of every ΔS across the whole
        // session. It reads as a slow-drifting "how much has this
        // conversation moved overall" signal, orbiting outside the tower/
        // ring of per-layer meshes.

        const globalPulseGeo = new THREE.TorusGeometry(TORUS_MAJOR_RADIUS + 2.5, 0.6, 16, 100);
        const globalPulseMat = new THREE.MeshStandardMaterial({
            color: 0xb39bff,
            emissive: 0xb39bff,
            emissiveIntensity: 0.3,
            transparent: true,
            opacity: 0.35,
            roughness: 0.3,
            metalness: 0.2
        });
        const globalPulseMesh = new THREE.Mesh(globalPulseGeo, globalPulseMat);
        globalPulseMesh.rotation.x = Math.PI / 2;
        globalPulseMesh.visible = false; // stays hidden until the first real KV read, not just a faint idle glow
        scene.add(globalPulseMesh);

        function updateGlobalPulse(F, maxF) {
            globalPulseMesh.visible = false; // purple ring disabled per request
            const norm = maxF > 0.001 ? Math.min(F / maxF, 1) : 0;
            const scale = 1 + norm * 0.35;
            globalPulseMesh.scale.setScalar(scale);
            globalPulseMat.emissiveIntensity = 0.2 + norm * 1.1;
            globalPulseMat.opacity = 0.2 + norm * 0.5;
            document.getElementById('global-f-text').textContent = F.toFixed(4);
        }

        // ─── INITIAL BRAIN ──────────────────────────────────────────────────
        // Deliberately does NOT call buildBrain() here. No tiny dots, no big
        // dots, nothing in brainGroup, until the first real token arrives —
        // an empty scene up front is more honest than a synthetic sine-wave
        // placeholder that looks like data before any inference has run.

        currentLayerData = new Float32Array(LAYERS); // all zero; brainGroup stays empty until first real update

        // ─── TOOLTIP ──────────────────────────────────────────────────────────

        const tooltip = document.getElementById('tooltip');
        const tipLayer = document.getElementById('tip-layer');
        const tipValue = document.getElementById('tip-value');

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('mousemove', (event) => {
            // Normalize against the canvas element's own box, not the full
            // window — the canvas no longer fills the window now that the
            // chat sidebar takes the left third. Using window.innerWidth/
            // Height here would silently misalign every raycast.
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableMeshes);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                if (data.layer !== undefined) {
                    tooltip.style.display = 'block';
                    tooltip.style.left = (event.clientX + 14) + 'px';
                    tooltip.style.top = (event.clientY - 10) + 'px';
                    tipLayer.textContent = 'Layer ' + data.layer;
                    tipValue.textContent = data.delta.toFixed(2);
                    document.body.style.cursor = 'pointer';
                }
            } else {
                tooltip.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        });

        renderer.domElement.addEventListener('click', (event) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableMeshes);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                if (data.layer !== undefined) {
                    const targetPos = layerTransform(data.layer).position;
                    orbitControls.target.copy(targetPos);
                    orbitControls.autoRotate = false;
                    setTimeout(() => { orbitControls.autoRotate = true; }, 3000);
                }
            }
        });

        // ────────────────────────────────────────────────────────────────────────
        //  WEBLLM — YOUR WORKING CODE
        // ────────────────────────────────────────────────────────────────────────

        function toMap(topLogprobs) {
            const m = new Map();
            if (!topLogprobs) return m;
            for (const e of topLogprobs) m.set(e.token, e.logprob);
            return m;
        }

        function sparseFrob(a, b) {
            if (!a?.size || !b?.size) return 0;
            const keys = new Set([...a.keys(), ...b.keys()]);
            let s = 0;
            for (const k of keys) {
                const d = (a.has(k) ? a.get(k) : -100) - (b.has(k) ? b.get(k) : -100);
                s += d * d;
            }
            return Math.sqrt(s);
        }

        // ─── UPDATE BRAIN FROM DELTAS ──────────────────────────────────────────
        // Local animation (this function): per-layer meshes rebuilt from the
        // CURRENT message's token deltas — fast, LocalState-driven.
        // Global animation (updateGlobalPulse, called at the end): the halo
        // mesh scale/brightness — slow, GlobalState-driven, session-wide.

        function updateBrainFromDeltas(local, step, totalSteps) {
            const deltas = local.deltas;
            const layerData = new Float32Array(LAYERS);
            const maxD = Math.max(...deltas.map(d => d.deltaS || 0), 0.001);

            for (let i = 0; i < LAYERS; i++) {
                const idx = i % Math.max(1, deltas.length);
                const d = deltas[idx]?.deltaS || 0;
                layerData[i] = 10 + (d / maxD) * 150 + 20 * Math.sin(i * 0.7 + step * 0.1);
            }

            const maxDelta = Math.max(...deltas.map(d => d.deltaS || 0));
            if (maxDelta > 0.001) {
                layerData[8] = 180 + 80 * Math.sin(step * 0.05);
            }

            currentLayerData = layerData;
            buildBrain(layerData, currentOpacity);

            const maxVal = Math.max(...layerData);
            const maxLayer = layerData.indexOf(maxVal);

            // Local F is already tracked on the LocalState instance itself
            // (set per-token by recordToken()) — no parallel module-level
            // variable to keep in sync anymore.
            const localF = local.F;

            document.getElementById('deltaS-display').innerHTML =
                `||ΔS||<sub>F</sub> = ${localF.toFixed(4)}`;
            document.getElementById('tokens-display').textContent =
                ` · ${Math.floor(step * 0.7)} tokens`;
            document.getElementById('max-layer-text').textContent = maxLayer;
            document.getElementById('layer8-text').textContent = layerData[8].toFixed(1);

            const progress = (step / totalSteps * 100);
            document.getElementById('progress-value').textContent = progress.toFixed(0) + '%';
            document.getElementById('progress-sub').textContent = `Step ${step}/${totalSteps} · ${deltas.length} tokens`;

            // Global F: Frobenius norm of every ΔS across the whole session
            // so far, not just this message. Recomputed on every visible
            // update so the halo tracks the running conversation, not just
            // the current turn.
            if (globalState) {
                globalState.recomputeF();
                updateGlobalPulse(globalState.F, globalState.maxF);
            }

            // Log a periodic status line (not every frame, to avoid flooding
            // the panel) so the user can watch the run progress live.
            if (step % 15 === 0 || step === 1) {
                const gF = globalState ? globalState.F : 0;
                uiLog(`Step ${step}/${totalSteps} (${progress.toFixed(0)}%) · F_local=${localF.toFixed(3)} · F_global=${gF.toFixed(3)} · max layer ${maxLayer}`, 'progress');
                saveMatrixToIDB(); // mid-stream — this is what makes it a LIVE save, not just end-of-message
            }
        }

        // ─── GFLOPS (real-time estimate) ───────────────────────────────────
        // GFLOPS here means: (2 × total params × measured tokens/sec) / 1e9,
        // the standard forward-pass FLOPs-per-token approximation (2N FLOPs/
        // token, N = total parameter count) driven by a wall-clock
        // measurement I take myself with performance.now() around each
        // streamed token — deliberately NOT derived from WebLLM's internal
        // decodingTotalTime, since that field's units were never confirmed
        // by your object map and I'd rather measure directly than guess at
        // a unit conversion.
        const MODEL_PARAMS = {
            // Approximate total parameter counts from each model's published
            // config — not a live read, and "1B"/"3.8B" in a model's name is
            // usually rounded, so treat GFLOPS as directionally correct
            // rather than a certified benchmark number.
            'Llama-3.2-1B-Instruct-q4f16_1-MLC':    1.24e9,
            'TinyLlama-1.1B-Chat-v1.0-q4f32_1-MLC': 1.10e9,
            'Phi-3.5-mini-instruct-q4f16_1-MLC':    3.82e9,
        };

        let tokenTimestamps = []; // rolling window, ms (performance.now())
        const GFLOPS_WINDOW = 12; // tokens

        function recordTokenTiming(modelId) {
            const now = performance.now();
            tokenTimestamps.push(now);
            if (tokenTimestamps.length > GFLOPS_WINDOW) tokenTimestamps.shift();
            if (tokenTimestamps.length < 2) return;

            const span = (tokenTimestamps[tokenTimestamps.length - 1] - tokenTimestamps[0]) / 1000;
            const tokensPerSec = (tokenTimestamps.length - 1) / span;
            const params = MODEL_PARAMS[modelId] || 0;
            const gflops = params > 0 ? (2 * params * tokensPerSec) / 1e9 : 0;

            const tEl = document.getElementById('toksec-display');
            const gEl = document.getElementById('gflops-display');
            if (tEl) tEl.textContent = tokensPerSec.toFixed(1);
            if (gEl) gEl.textContent = gflops.toFixed(2);
        }

        // ─── RUN PROMPT ──────────────────────────────────────────────────────
        // `local` is a LocalState (BaseClassX) instance the caller already
        // created and attached to `globalState`. This function's only job
        // is to stream the completion and feed it — response text and F
        // readings both land on `local`, not on locals private to this
        // function, so the chat panel / export / visualization all read
        // from the same instance in real time as it streams.

        async function runPrompt(engine, messages, local, modelId, onToken) {
            console.log(`\n${'═'.repeat(56)}`);
            console.log(`  ${local.label || local.id}`);
            console.log(`  Prompt: "${local.prompt}"`);
            console.log('─'.repeat(56));

            const stream = await engine.chat.completions.create({
                messages,
                stream: true,
                max_tokens: 120,
                logprobs: true,
                top_logprobs: 5,
            });

            let prevMap = null;
            let fullText = '';

            for await (const chunk of stream) {
                const choice = chunk.choices[0];
                const text = choice?.delta?.content || '';
                const logprobObj = choice?.logprobs?.content?.[0];

                if (!text) continue;
                fullText += text;
                local.response = fullText;         // schema-validated, streams to the UI
                updateChatTranscript();

                if (logprobObj?.top_logprobs) {
                    const curr = toMap(logprobObj.top_logprobs);
                    if (prevMap) {
                        const deltaS = sparseFrob(prevMap, curr); // = F for this token
                        local.recordToken(local.tokenCount + 1, text, deltaS);
                        recordTokenTiming(modelId);
                        if (onToken) onToken(local.tokenCount, text, deltaS, local);
                    } else {
                        console.log(`  tok   1: "${text.replace(/\n/g,'\\n').slice(0,10)}"  (first — no prev state)`);
                    }
                    prevMap = curr;
                }
            }

            const N = local.deltas.length;
            const peak = N ? local.deltas.reduce((p, d) => d.deltaS > p.deltaS ? d : p, local.deltas[0]) : null;

            console.log('─'.repeat(56));
            console.log(`  Tokens: ${local.tokenCount}  |  With F: ${N}`);
            console.log(`  Token  F  max  = ${local.maxF.toFixed(6)}` +
                (peak ? `  @ tok ${peak.i} "${peak.text.slice(0,8)}"` : ''));
            console.log(`  Token  F  mean = ${local.meanF.toFixed(6)}`);
            console.log(`  Final  F       = ${local.F.toFixed(6)}`);

            return local;
        }

        // ─── LIVE KV CACHE (experimental, real per-layer F) ────────────────
        // Pulls actual K/V tensors out of the model's live WASM memory via
        // undocumented WebLLM internals (engine.loadedModelIdToPipeline →
        // .kvCache.handle / .vm.mod.lib.memory.viewF32), adapted from a
        // script you provided. This gives one REAL Frobenius norm per
        // actual transformer layer, instead of the token-logprob proxy
        // spread across 32 decorative meshes via modulo.
        //
        // Two things I changed, one thing I could not verify from this
        // sandbox — flagged in my reply below this file, not buried here.
        // Wrapped so any failure just leaves the existing per-token
        // sparseFrob() channel doing all the work, same as before this
        // was added — it can only add signal, never break the run.

        const KV_MODEL_ARCH = {
            // kvDim = num_key_value_heads × head_dim, the actual per-token
            // KV cache width — corrected from hidden_size for the two GQA
            // models (Llama 3.2 1B: 8 kv heads × 64 = 512, not the 2048
            // hidden_size the original script used; TinyLlama: 4 kv heads
            // × 64 = 256, not 2048). Phi-3.5-mini uses full MHA (32 kv
            // heads × 96 = 3072 = hidden_size) so it was unaffected either
            // way. From published HF configs, not a live read — worth a
            // sanity check against the real config if it matters beyond
            // relative layer-to-layer comparison.
            'Llama-3.2-1B-Instruct-q4f16_1-MLC':    { layers: 16, kvDim: 512 },
            'TinyLlama-1.1B-Chat-v1.0-q4f32_1-MLC': { layers: 22, kvDim: 256 },
            'Phi-3.5-mini-instruct-q4f16_1-MLC':    { layers: 32, kvDim: 3072 },
        };

        function frobeniusNorm(data) {
            let sum = 0;
            for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
            return Math.sqrt(sum);
        }

        // Returns one F reading per real model layer, or null if the
        // internals aren't present / the read looks wrong. Never throws.
        function readLiveKVCache(engine, modelId) {
            try {
                const arch = KV_MODEL_ARCH[modelId];
                if (!arch) return null;

                const pipeline = engine?.loadedModelIdToPipeline?.get?.(modelId);
                const handle = pipeline?.kvCache?.handle;
                const viewF32 = pipeline?.vm?.mod?.lib?.memory?.viewF32;
                if (handle === undefined || handle === null || !viewF32) return null;

                const kvPerLayer = arch.kvDim * 2; // K + V back to back
                const perLayerF = [];
                let bad = false;

                for (let i = 0; i < arch.layers; i++) {
                    const kStart = handle + i * kvPerLayer;
                    const vStart = kStart + arch.kvDim;
                    const K = viewF32.slice(kStart, kStart + arch.kvDim);
                    const V = viewF32.slice(vStart, vStart + arch.kvDim);
                    const fK = frobeniusNorm(K);
                    const fV = frobeniusNorm(V);
                    if (!Number.isFinite(fK) || !Number.isFinite(fV)) bad = true;
                    perLayerF.push(Math.sqrt(fK * fK + fV * fV));
                }

                // Not a proof of correctness — just a tripwire. If every
                // layer reads back identical or non-finite, we're almost
                // certainly indexing the wrong memory (e.g. `handle` is a
                // byte pointer being used as a float32-element index —
                // that'd be off by a factor of 4 — or the real KV cache
                // isn't a flat per-layer array the way this assumes).
                const allSame = perLayerF.every(v => v === perLayerF[0]);
                if (bad || allSame) {
                    uiLog('Live KV read looked degenerate (NaN or identical layers) — using token-delta F instead.', 'warn');
                    return null;
                }
                return perLayerF;
            } catch (err) {
                uiLog(`Live KV read failed (${err.message}) — using token-delta F instead.`, 'warn');
                return null;
            }
        }

        // Maps however many real layers the model has onto the fixed 32
        // decorative meshes (same proportional-index approach the rest of
        // the file already uses for the token-delta path).
        function kvFrobeniusToLayerData(perLayerF) {
            const layerData = new Float32Array(LAYERS);
            const maxF = Math.max(...perLayerF, 0.001);
            for (let i = 0; i < LAYERS; i++) {
                const idx = Math.floor((i / LAYERS) * perLayerF.length);
                const f = perLayerF[Math.min(idx, perLayerF.length - 1)];
                layerData[i] = 10 + (f / maxF) * 150;
            }
            return layerData;
        }

        // Console helper — run window.__inspectKV() after a message has
        // completed. Dumps the real shape of whatever engine.
        // loadedModelIdToPipeline actually contains for the loaded model,
        // and runs a concrete check on the one thing that can't be settled
        // by reading property names: whether `handle` is already a
        // float32-element index into viewF32, or a raw WASM byte pointer
        // that needs /4. If it's a byte pointer, `handle` will typically
        // be a large-ish number not evenly related to hiddenSize, and
        // `handle / 4` will land well inside viewF32.length while `handle`
        // itself may already be near or past viewF32.length (byte-length,
        // not element-length) — that mismatch is the tell.
        window.__inspectKV = function () {
            if (!engineInstance || !globalState) {
                console.log('No engine/session yet — send a message first.');
                return null;
            }
            const modelId = globalState.modelId;
            const pipeline = engineInstance?.loadedModelIdToPipeline?.get?.(modelId);
            if (!pipeline) {
                console.log('No pipeline found at engine.loadedModelIdToPipeline.get(modelId).');
                console.log('Top-level engine keys:', Object.keys(engineInstance || {}));
                return null;
            }
            const handle = pipeline?.kvCache?.handle;
            const viewF32 = pipeline?.vm?.mod?.lib?.memory?.viewF32;

            console.log('─── KV cache introspection ───');
            console.log('pipeline keys:', Object.keys(pipeline));
            console.log('pipeline.kvCache keys:', pipeline?.kvCache ? Object.keys(pipeline.kvCache) : '(none)');
            console.log('handle:', handle, typeof handle);
            console.log('viewF32.length (elements):', viewF32?.length);
            console.log('viewF32.byteLength (bytes):', viewF32?.byteLength);
            if (typeof handle === 'number' && viewF32) {
                console.log('handle as-is vs viewF32.length     →', handle, 'vs', viewF32.length,
                    handle < viewF32.length ? '(in range as element index)' : '(OUT OF RANGE as element index)');
                console.log('handle / 4 vs viewF32.length        →', handle / 4, 'vs', viewF32.length,
                    (handle / 4) < viewF32.length ? '(in range — handle may be a byte pointer)' : '(still out of range)');
            }
            return { pipeline, handle, viewF32Length: viewF32?.length };
        };

        // ─── ENGINEX — BACKEND-AGNOSTIC DEVICE CONTRACT (BaseClassX) ─────────
        // Deliberately does NOT mirror the WebLLM pipeline object 1:1 — that
        // would just be WebLLM with extra steps. EngineX is the interface;
        // a Device (WebLLMDevice below, eventually OpenBLASDevice/
        // ANEDeviceX/etc.) is whatever satisfies it. EngineX holds
        // schema-validated, traced STATE; it never touches WebGPU, WASM,
        // koffi, or cblas directly — every real op delegates to
        // `this.device`, which is the entire "swap backends" mechanism.
        // attachDevice(anything satisfying this shape) and everything
        // above EngineX (GlobalState/LocalState/the chat UI) is unaffected.

        class EngineX extends BaseClassX {
            static _schema = {
                properties: {
                    modelId:             { type: 'string', default: '' },
                    backendName:         { type: 'string', default: '' },
                    contextWindowSize:   { type: 'number', default: 0 },
                    filledContextLength: { type: 'number', default: 0 }, // generalized name for WebLLM's filledKVCacheLength
                    numLayers:           { type: 'number', default: 0 },
                    kvDim:               { type: 'number', default: 0 },
                    status:              { type: 'string', default: 'idle', enum: ['idle', 'loading', 'ready', 'running', 'error'] }
                }
            };

            attachDevice(device) { this.device = device; return this; }

            async loadModel(modelId, opts, chatOpts) {
                this.status = 'loading';
                const info = await this.device.loadModel(modelId, opts, chatOpts);
                this.modelId = modelId;
                this.backendName = this.device.name;
                this.contextWindowSize = info.contextWindowSize || 0;
                this.numLayers = info.numLayers || 0;
                this.kvDim = info.kvDim || 0;
                this.status = 'ready';
                return info;
            }

            // Unloads the current model so a fresh reload (different cache
            // backend / context window) starts clean rather than piling a
            // second model into memory alongside the first.
            async unload() {
                if (this.device?.unload) await this.device.unload();
                this.status = 'idle';
            }

            // position is now part of the contract (folded in per your call
            // — every Device implements it, even if a given backend only
            // ever has one valid position at a time and ignores the arg).
            readKVLayer(layer, position)        { return this.device.readKVLayer(layer, position); }
            writeKVLayer(layer, position, K, V) { return this.device.writeKVLayer(layer, position, K, V); }

            getTelemetry() { return this.device.getTelemetry ? this.device.getTelemetry() : null; }
        }

        // ─── WEBLLMDEVICE — the confirmed engine map, as a Device ────────────
        // Every access path here is taken straight from the object map you
        // sent (loadedModelIdToPipeline / kvCache / vm.mod.lib.memory /
        // filledKVCacheLength / decodingTotalTime etc. — §3, §5, §10, §11).
        // The one thing that map did NOT confirm is the position axis
        // inside a layer's K/V slice — kvCache only exposes {handle, lib,
        // ctx}, nothing about whether it's laid out layer-major or
        // position-major. KV_LAYOUT_MODE below is a placeholder for
        // whatever your Reflect-based brute-force mapping finds; flip it
        // once that's done, nothing above WebLLMDevice needs to know.

        const KV_LAYOUT_MODE = 'layer-major'; // 'layer-major' | 'position-major' — unverified, pending your mapping
        const KV_MAX_POSITIONS = 4096; // placeholder stride multiplier for layer-major until confirmed per-model

        class WebLLMDevice {
            constructor() { this.name = 'webllm-wasm'; }

            async loadModel(modelId, opts, chatOpts) {
                this._engine = await webllm.CreateMLCEngine(modelId, opts, chatOpts);
                this._modelId = modelId;
                this._pipeline = this._engine.loadedModelIdToPipeline.get(modelId);
                const arch = KV_MODEL_ARCH[modelId];
                return {
                    contextWindowSize: this._pipeline.contextWindowSize,
                    numLayers: arch?.layers || 0,
                    kvDim: arch?.kvDim || 0
                };
            }

            // engine.unload() confirmed in WebLLM's API reference: "Unloads
            // all loaded models and clears their associated configurations."
            async unload() {
                if (this._engine) await this._engine.unload();
                this._engine = null;
                this._pipeline = null;
            }

            getFilledLength() {
                return this._pipeline?.filledKVCacheLength ?? 0;
            }

            readKVLayer(layer, position = 0) {
                const arch = KV_MODEL_ARCH[this._modelId];
                const handle = this._pipeline?.kvCache?.handle;
                const viewF32 = this._pipeline?.vm?.mod?.lib?.memory?.viewF32;
                if (!arch || handle == null || !viewF32) return null;

                const kvPerLayer = arch.kvDim * 2;
                let kStart;
                if (KV_LAYOUT_MODE === 'position-major') {
                    kStart = handle + position * (kvPerLayer * arch.layers) + layer * kvPerLayer;
                } else {
                    kStart = handle + layer * (kvPerLayer * KV_MAX_POSITIONS) + position * kvPerLayer;
                }
                const vStart = kStart + arch.kvDim;
                const K = viewF32.slice(kStart, kStart + arch.kvDim);
                const V = viewF32.slice(vStart, vStart + arch.kvDim);
                const F_K = frobeniusNorm(K), F_V = frobeniusNorm(V);
                return { layer, position, F_K, F_V, F_total: Math.sqrt(F_K * F_K + F_V * F_V) };
            }

            writeKVLayer(layer, position, K, V) {
                // Not yet implemented — no backend needs to support this to
                // satisfy the EngineX contract (Device methods may no-op or
                // throw), but the interface has room for it now because
                // this is the thing that makes context-window eviction /
                // external KV backing possible at all.
                throw new Error('writeKVLayer not yet supported on webllm-wasm');
            }

            getTelemetry() {
                const p = this._pipeline;
                if (!p) return null;
                return {
                    decodingTotalTokens: p.decodingTotalTokens,
                    decodingTotalTime: p.decodingTotalTime,
                    prefillTotalTokens: p.prefillTotalTokens,
                    prefillTotalTime: p.prefillTotalTime,
                    curRoundDecodingTotalTokens: p.curRoundDecodingTotalTokens,
                    filledContextLength: p.filledKVCacheLength
                };
            }
        }

        // ─── TERTIARY FLAG — legacy vs. EngineX/WebLLMDevice ─────────────────
        // Not a boolean on purpose: 'compare' is a real third state, not
        // just "old" or "new". While this is 'compare', BOTH paths run
        // every read; the legacy result is what actually drives the
        // visualization (nothing about current behavior changes), and any
        // divergence between the two gets logged so the position-axis
        // question can be settled from real runs instead of guessed at.
        // Once WebLLMDevice is trusted: flip to 'device', then delete
        // this flag along with readLiveKVCache/KV_MODEL_ARCH/
        // kvFrobeniusToLayerData entirely — this is scaffolding for the
        // transition, not a permanent option.
        let KV_READ_MODE = 'compare'; // 'legacy' | 'device' | 'compare'

        let engineX = null; // EngineX instance, created alongside engineInstance in runTest

        function compareKVReads(legacyLayers, layer, devicePos0Reading) {
            if (!legacyLayers || !devicePos0Reading) return;
            const legacyF = legacyLayers[layer]?.F_total;
            const deviceF = devicePos0Reading.F_total;
            if (legacyF == null) return;
            const diff = Math.abs(legacyF - deviceF);
            const pct = legacyF > 0.001 ? (diff / legacyF * 100) : 0;
            if (pct > 5) {
                uiLog(`KV compare: layer ${layer} diverges ${pct.toFixed(1)}% (legacy ${legacyF.toFixed(3)} vs device ${deviceF.toFixed(3)}) — layout question still open.`, 'warn');
            }
        }



        function updateChatTranscript() {
            const el = document.getElementById('chat-log');
            if (!el || !globalState) return;
            el.innerHTML = globalState.children.map(local => `
                <div class="chat-turn">
                    <div class="chat-prompt">› ${escapeHtml(local.prompt)}</div>
                    <div class="chat-response" style="overflow:auto;">${window.marked ? window.marked ? marked.parse(local.response) : local.response : escapeHtml(local.response) || '<span class="chat-pending">…</span>'}</div>
                    <div class="chat-f">F: ${local.F.toFixed(3)} · max ${local.maxF.toFixed(3)} · mean ${local.meanF.toFixed(3)}</div>
                </div>
            `).join('');
            el.scrollTop = el.scrollHeight;
        }

        function escapeHtml(s) {
            return (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        }

        // ─── SEND MESSAGE — the single path both Start's demo prompts and ──
        //     the user's own prompt box run through ─────────────────────────

        async function sendMessage(promptText) {
            if (!engineInstance) {
                uiLog('No model loaded yet — press ▶ Start first.', 'warn');
                return null;
            }
            if (isRunning) {
                uiLog('A message is already in flight — wait for it to finish.', 'warn');
                return null;
            }
            if (!promptText || !promptText.trim()) return null;

            isRunning = true;
            document.getElementById('stop-btn').disabled = false;
            document.getElementById('send-prompt-btn').disabled = true;
            document.getElementById('status-display').textContent = '● Running';
            document.getElementById('status-display').style.color = '#2ecc71';
            const inferProc = smKernel ? smKernel.fork('smatrix:infer', 0) : null;
            const inferJob = (typeof Procd !== 'undefined' && Procd.registerJob)
                ? Procd.registerJob('smatrix:infer', 'console', 500, () => {}, () => {})
                : null;

            try {
                if (!globalState) {
                    globalState = new GlobalState({ modelId: document.getElementById('model-select').value });
                    globalState.runState = 'running';
                }

                // Rebuild chat history from every prior turn so follow-up
                // prompts have real conversational context.
                const history = [];
                for (const local of globalState.children) {
                    history.push({ role: 'user', content: local.prompt });
                    history.push({ role: 'assistant', content: local.response });
                }
                history.push({ role: 'user', content: promptText });

                const local = new LocalState({ prompt: promptText });
                globalState.addMessage(local);
                activeLocalState = local;
                updateChatTranscript();
                tokenTimestamps = []; // fresh GFLOPS window for this message, not a stale one from the last

                await runPrompt(engineInstance, history, local, globalState.modelId, (tokenCount, text, deltaS) => {
                    if (tokenCount % 3 === 0 || tokenCount === 1) {
                        updateBrainFromDeltas(local, tokenCount, 120);
                    }
                });

                updateBrainFromDeltas(local, local.tokenCount, 120);
                updateChatTranscript();

                // Legacy path — UNCHANGED behavior. This is what actually
                // drives the visualization in 'legacy' and 'compare' modes,
                // exactly as it did before EngineX existed.
                let kvF = null;
                if (KV_READ_MODE === 'legacy' || KV_READ_MODE === 'compare') {
                    kvF = readLiveKVCache(engineInstance, globalState.modelId);
                    if (kvF) {
                        local.kvLayerF = kvF; // real per-layer readings, exported for you to inspect
                        currentLayerData = kvFrobeniusToLayerData(kvF);
                        buildBrain(currentLayerData, currentOpacity);
                        uiLog(`Live KV cache read OK (legacy) — ${kvF.length} real layers.`, 'info');
                    }
                }

                // EngineX/WebLLMDevice path — position 0 only for now (the
                // most recent token). In 'device' mode this is what drives
                // the visualization instead; in 'compare' mode it only logs
                // divergence against the legacy reading above.
                if (engineX && (KV_READ_MODE === 'device' || KV_READ_MODE === 'compare')) {
                    const arch = KV_MODEL_ARCH[globalState.modelId];
                    if (arch) {
                        const deviceLayers = [];
                        for (let l = 0; l < arch.layers; l++) {
                            const reading = engineX.readKVLayer(l, 0);
                            if (reading) {
                                deviceLayers.push(reading);
                                if (KV_READ_MODE === 'compare') compareKVReads(kvF?.map(f => ({ F_total: f })), l, reading);
                            }
                        }
                        if (KV_READ_MODE === 'device' && deviceLayers.length) {
                            local.kvLayerF = deviceLayers.map(l => l.F_total);
                            currentLayerData = kvFrobeniusToLayerData(local.kvLayerF);
                            buildBrain(currentLayerData, currentOpacity);
                            uiLog(`Live KV cache read OK (EngineX/${engineX.backendName}) — ${deviceLayers.length} real layers.`, 'info');
                        }
                    }
                }

                document.getElementById('status-display').textContent = '● Complete';
                document.getElementById('status-display').style.color = '#2ecc71';
                document.getElementById('progress-sub').textContent = '✅ Response complete';

                await captureKVDeltasForMessage(local, globalState.modelId);
                saveMatrixToIDB(); // guaranteed save point, on top of the mid-stream throttled saves

                return local;
            } catch (error) {
                console.error('❌ Message failed:', error);
                document.getElementById('status-display').textContent = '● Error';
                document.getElementById('status-display').style.color = '#e74c3c';
                if (globalState) globalState.runState = 'error';
                return null;
            } finally {
                isRunning = false;
                if (smKernel && inferProc) smKernel.kill(inferProc.pid);
                if (inferJob) inferJob.stop();
                document.getElementById('stop-btn').disabled = true;
                document.getElementById('send-prompt-btn').disabled = false;
                activeLocalState = null;
            }
        }

        // ─── RUN TEST — LOAD MODEL → RUN DEMO PROMPTS → ENABLE CHAT ─────────

        // ─── MATRIX LOAD — restore from IndexedDB ──────────────────────────
        // Called on page load and when Start button is clicked. If sessions
        // exist in IndexedDB, shows a picker so user can load one instead of
        // starting fresh. The loaded session is mutable — user can send new
        // messages, which append to the loaded tree.

        async function showSessionPicker() {
            if (!idbInstance) idbInstance = await openIDB();
            return new Promise((resolve) => {
                const tx = idbInstance.transaction(IDB_STORE, 'readonly');
                const req = tx.objectStore(IDB_STORE).getAll();
                req.onsuccess = () => {
                    const sessions = req.result;
                    if (!sessions.length) {
                        resolve(null);
                        return;
                    }
                    // Sort by savedAt descending (newest first)
                    sessions.sort((a, b) => new Date(b.savedAt) - new Date(a.savedAt));

                    const modal = document.createElement('div');
                    modal.style.cssText = `
                        position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 999;
                        background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;
                    `;
                    modal.innerHTML = `
                        <div style="background: #0b0b0f; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; max-width: 500px; max-height: 70vh; overflow-y: auto;">
                            <h2 style="margin-bottom: 14px; color: #7af0ff;">Load Saved Session</h2>
                            <div id="session-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
                            <button id="start-fresh-btn" style="margin-top: 14px; padding: 8px 14px; background: #667799; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Start Fresh Session</button>
                        </div>
                    `;
                    document.body.appendChild(modal);

                    const list = modal.querySelector('#session-list');
                    sessions.forEach(s => {
                        const btn = document.createElement('button');
                        btn.style.cssText = `
                            padding: 10px 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
                            color: #c8d6e5; border-radius: 6px; cursor: pointer; text-align: left; font-size: 11px;
                        `;
                        btn.innerHTML = `
                            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                                <div style="flex:1;">
                                    <div style="font-weight: 600; color: #7af0ff;">${s.modelId || 'Unknown Model'}</div>
                                    <div style="font-size: 9px; color: #8899bb; margin-top: 3px;">
                                        ${new Date(s.savedAt).toLocaleString()} · ${s.messages?.length || 0} messages · ${s.runState}
                                    </div>
                                </div>
                                <span class="session-delete-btn" data-session-id="${s.sessionId}" title="Delete this session" style="flex-shrink:0; padding:4px 7px; border-radius:5px; color:#e0666e;">🗑</span>
                            </div>
                        `;
                        btn.onclick = (e) => {
                            if (e.target.closest('.session-delete-btn')) return;
                            document.body.removeChild(modal);
                            resolve(s);
                        };
                        list.appendChild(btn);
                        const delBtn = btn.querySelector('.session-delete-btn');
                        delBtn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            if (!confirm('Delete this saved session? This cannot be undone.')) return;
                            await deleteSessionFromIDB(s.sessionId);
                            btn.remove();
                        });
                    });

                    modal.querySelector('#start-fresh-btn').onclick = () => {
                        document.body.removeChild(modal);
                        resolve(null);
                    };
                };
            });
        }

        
        // Restore KV cache from stored deltas (bridge into engine's live WASM memory)
        async function injectKVCacheOnRestore(globalState, modelId) {
            try {
                if (!globalState.baseKVCache || !engineX) return;
                
                // TODO: Write baseKVCache + message deltas back into
                // engine.loadedModelIdToPipeline.get(modelId).kvCache.handle
                // This requires writing into the WASM viewF32 buffer directly.
                // Placeholder: the 110-export map is the key to this.
                
                uiLog(`KV cache injection ready (impl pending — use 110-export map)`, 'info');
            } catch (err) {
                uiLog(`KV restore failed: ${err.message}`, 'warn');
            }
        }

        async function loadSessionFromIDB(sessionData) {
            if (!sessionData) return null;
            try {
                globalState = new GlobalState({ modelId: sessionData.modelId });
                globalState.runState = sessionData.runState;
                globalState.F = sessionData.globalF || 0;
                globalState.maxF = sessionData.globalMaxF || 0;

                for (const msgData of sessionData.messages) {
                    const local = new LocalState({ prompt: msgData.prompt });
                    local.response = msgData.response;
                    local.tokenCount = msgData.tokenCount;
                    local.F = msgData.F;
                    local.maxF = msgData.maxF;
                    local.meanF = msgData.meanF;
                    local.deltas = msgData.deltas || [];
                    local.kvLayerF = msgData.kvLayerF || null;
                    globalState.addMessage(local);
                }
                updateChatTranscript();
                uiLog(`Loaded session from ${sessionData.savedAt} (${sessionData.messages.length} messages)`, 'info');
                return globalState;
            } catch (err) {
                uiLog(`Failed to load session: ${err.message}`, 'error');
                return null;
            }
        }

        // ─── MATRIX LOAD END ───────────────────────────────────────────────

        async function replaySessionAnimation(gs) {
            if (!gs || !gs.children || !gs.children.length) return;
            uiLog(`Replaying ${gs.children.length} message(s)…`, 'info');
            for (const local of gs.children) {
                const N = local.deltas.length;
                if (!N) continue;
                for (let step = 1; step <= N; step++) {
                    if (step % 3 === 0 || step === 1 || step === N) {
                        updateBrainFromDeltas(local, step, N);
                        await new Promise(r => setTimeout(r, 16));
                    }
                }
                updateBrainFromDeltas(local, N, N);
            }
            updateChatTranscript();
            uiLog('Replay complete.', 'info');
        }

        // Shared by the Start button and the new Reload button so both
        // respect whatever's currently in the cache-backend/context-window
        // controls, instead of Reload being a second, drifting code path.
        async function loadModelWithSettings(modelId) {
            const cacheBackend = document.getElementById('cache-backend-select').value;
            const ctxInput = document.getElementById('context-window-input').value;
            const ctxSlider = document.getElementById('context-window-slider');
            const contextWindowSize = ctxSlider ? parseInt(ctxSlider.value, 10) : undefined;

            const appConfig = { ...webllm.prebuiltAppConfig, cacheBackend };
            const chatOpts = contextWindowSize ? { context_window_size: contextWindowSize } : undefined;

            engineX = new EngineX();
            const webllmDevice = new WebLLMDevice();
            engineX.attachDevice(webllmDevice);
            const dlProc = smKernel ? smKernel.fork('smatrix:download:' + modelId, 0) : null;
            try {
                await engineX.loadModel(modelId, {
                    appConfig,
                    initProgressCallback: (p) => {
                        if (p.text) {
                            nativeConsole.log(`  ⏳ ${p.text}`);
                            const pct = typeof p.progress === 'number' ? ` (${Math.round(p.progress * 100)}%)` : '';
                            uiLog(`${p.text}${pct}`, 'progress');
                        }
                    },
                }, chatOpts);
            } finally {
                if (smKernel && dlProc) smKernel.kill(dlProc.pid);
            }
            engineInstance = webllmDevice._engine;

            // Register on the shared parent (DesktopShell) so other app
            // windows (ChatApp-WebLLM, ChatApp-Signal) can reuse THIS
            // loaded model instead of booting their own — the concrete
            // first step of the shared "/lib inference service" idea
            // (Architecture 2.0 Part XIII).
            try { if (window.parent && window.parent !== window) window.parent.__meshInference = { engineInstance, modelId, chat: (msgs, opts) => engineInstance.chat.completions.create({ messages: msgs, ...opts }) }; } catch (e) {}

            uiLog(`Loaded with cacheBackend="${cacheBackend}"${contextWindowSize ? `, context_window_size=${contextWindowSize}` : ' (model default context window)'}.`, 'info');
            await captureBaseKVCache(modelId);
            await captureMlcConfig();
            updateModelLoadedIndicator();
        }

        async function runTest() {
            if (isRunning) return;

            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            const statusDisplay = document.getElementById('status-display');

            startBtn.disabled = true;
            startBtn.textContent = '⏳ Loading...';
            stopBtn.disabled = false;
            statusDisplay.textContent = '● Loading Model';
            statusDisplay.style.color = '#f1c40f';

            const modelId = document.getElementById('model-select').value;

            try {
                // 0. CHECK FOR SAVED SESSIONS IN INDEXEDDB
                console.log('\n🔍 Checking for saved sessions...');
                const savedSession = await showSessionPicker();
                
                if (savedSession) {
                    const sessionModelId = savedSession.modelId;
                    if (sessionModelId === modelId) {
                        // Model matches — load the session as-is
                        console.log(`✅ Model match (${modelId}) — loading saved session`);
                        await loadSessionFromIDB(savedSession);
                    await injectKVCacheOnRestore(globalState, sessionModelId);
                        globalState.runState = 'complete';
                        await replaySessionAnimation(globalState);
                    } else {
                        // Model mismatch — start fresh with new model
                        console.log(`⚠ Model mismatch (saved: ${sessionModelId}, selected: ${modelId}) — starting fresh`);
                        globalState = new GlobalState({ modelId });
                globalState.createdAt = Date.now();
                        globalState.runState = 'loading';
                        updateChatTranscript();
                        await loadModelWithSettings(modelId);
                        uiLog(`Model changed to ${modelId} — started fresh session (saved ${sessionModelId} not loaded).`, 'info');
                        globalState.runState = 'ready';
                    }
                } else {
                    // No session found or user chose "Start Fresh"
                    console.log(`\n🚀 Starting fresh session with model: ${modelId}`);
                    globalState = new GlobalState({ modelId });
                globalState.createdAt = Date.now();
                    globalState.runState = 'loading';
                    updateChatTranscript();

                    // 1. LOAD MODEL
                    console.log(`Loading model: ${modelId}`);
                    await loadModelWithSettings(modelId);
                    console.log('✅ Engine loaded');
                    
                    // 2. RUN DEMO PROMPTS
                    const DEMO_PROMPTS = [
                        'Find the bug in this JavaScript code: if (n = 0) { console.log("Zero"); }',
                        'Fix the code.',
                    ];
                    for (const p of DEMO_PROMPTS) {
                        await sendMessage(p);
                    }

                    globalState.runState = 'complete';
                }

                document.getElementById('send-prompt-btn').disabled = false;
                document.getElementById('prompt-input').disabled = false;
                document.getElementById('reload-btn').disabled = false;
                statusDisplay.textContent = '● Complete';
                statusDisplay.style.color = '#2ecc71';
                document.getElementById('progress-sub').textContent = '✅ Ready! Send your own prompts below.';
                startBtn.textContent = '▶ Start';

                window.__smatrix = {
                    modelId,
                    globalState,
                    method: 'top_logprobs_sparse_frobenius',
                    version: '1.00.03',
                };
                console.log('\n✅ Done. GlobalState in window.__smatrix.globalState');

            } catch (error) {
                console.error('❌ Start failed:', error);
                statusDisplay.textContent = '● Error';
                statusDisplay.style.color = '#e74c3c';
                if (globalState) globalState.runState = 'error';
                if (!engineInstance) {
                    document.getElementById('send-prompt-btn').disabled = true;
                    document.getElementById('prompt-input').disabled = true;
                }
            }

            startBtn.disabled = false;
            startBtn.textContent = '▶ Start';
            stopBtn.disabled = true;
        }

        // ─── CONTROLS ──────────────────────────────────────────────────────

        document.getElementById('start-btn').addEventListener('click', runTest);

        // ─── LOAD SESSION — restore from IndexedDB without running demo prompts ─

        document.getElementById('load-session-btn').addEventListener('click', async () => {
            if (isRunning) {
                uiLog('Cannot load session while a message is in flight.', 'warn');
                return;
            }
            const btn = document.getElementById('load-session-btn');
            btn.disabled = true;
            btn.classList.add('loading');
            btn.textContent = 'Loading...';
            const statusDisplay = document.getElementById('status-display');
            statusDisplay.textContent = '● Loading Session';
            statusDisplay.style.color = '#f1c40f';

            try {
                console.log('\n🔍 Opening session picker...');
                const savedSession = await showSessionPicker();
                
                if (savedSession) {
                    const sessionModelId = savedSession.modelId;
                    const selectedModelId = document.getElementById('model-select').value;
                    
                    if (sessionModelId !== selectedModelId) {
                        uiLog(`Model mismatch: session uses ${sessionModelId}, but ${selectedModelId} is selected. Loading model...`, 'info');
                        globalState = new GlobalState({ modelId: sessionModelId });
                        globalState.runState = 'loading';
                        await loadModelWithSettings(sessionModelId);
                        document.getElementById('model-select').value = sessionModelId;
                    }
                    
                    // Load the session into memory
                    console.log(`✅ Loading session from ${savedSession.savedAt}`);
                    await loadSessionFromIDB(savedSession);
                    await replaySessionAnimation(globalState);
                    
                    document.getElementById('send-prompt-btn').disabled = false;
                    document.getElementById('prompt-input').disabled = false;
                    document.getElementById('reload-btn').disabled = false;
                    statusDisplay.textContent = '● Ready';
                    statusDisplay.style.color = '#2ecc71';
                    document.getElementById('progress-sub').textContent = `✅ Loaded session (${savedSession.messages?.length || 0} messages)`;
                    uiLog(`Session loaded and ready for new messages.`, 'info');
                } else {
                    statusDisplay.textContent = '● Ready';
                    statusDisplay.style.color = '#8899bb';
                    document.getElementById('progress-sub').textContent = 'No session selected';
                }
            } catch (error) {
                console.error('❌ Load session failed:', error);
                statusDisplay.textContent = '● Error';
                statusDisplay.style.color = '#e74c3c';
                uiLog(`Load failed: ${error.message}`, 'error');
            }

            btn.disabled = false;
            btn.classList.remove('loading');
            btn.textContent = 'LOAD';
        });

        // ─── RELOAD — new cache backend / context window without a page refresh ─

        document.getElementById('reload-btn').addEventListener('click', async () => {
            if (isRunning) {
                uiLog('Cannot reload while a message is in flight — stop first.', 'warn');
                return;
            }
            const reloadBtn = document.getElementById('reload-btn');
            reloadBtn.disabled = true;
            reloadBtn.textContent = '⏳ Reloading...';
            document.getElementById('send-prompt-btn').disabled = true;
            document.getElementById('prompt-input').disabled = true;
            document.getElementById('status-display').textContent = '● Reloading';
            document.getElementById('status-display').style.color = '#f1c40f';

            try {
                if (engineX) {
                    uiLog('Unloading current model…', 'info');
                    await engineX.unload();
                }

                // A reload changes context_window_size/cacheBackend, which
                // changes the model's actual KV cache sizing — carrying an
                // old conversation's history across that isn't meaningful,
                // so this starts a fresh session rather than pretending to
                // continue the old one under different settings.
                const modelId = document.getElementById('model-select').value;
                globalState = new GlobalState({ modelId });
                globalState.createdAt = Date.now();

        // ─── PERSISTENCE — IndexedDB autosave + Save-to-Disk ────────────────

        const IDB_NAME = 'smatrix-live';
        const IDB_STORE = 'sessions';
        let idbInstance = null;

        function openIDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE, { keyPath: 'sessionId' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // Called after every message AND periodically mid-stream (see
        // updateBrainFromDeltas) — "live" means during generation, not just
        // when a message finishes. put() on the same sessionId overwrites
        // in place, so this is cheap to call often; it isn't accumulating
        // a new record per call.
        
        // Capture KV cache deltas for current message (per-token)
        async function captureKVDeltasForMessage(local, modelId) {
            try {
                const arch = KV_MODEL_ARCH[modelId];
                if (!arch || !engineX || !local) return;
                
                local.kvDeltas = [];
                for (let tokenIdx = 0; tokenIdx < local.tokenCount; tokenIdx++) {
                    const tokenKV = {};
                    for (let layer = 0; layer < arch.layers; layer++) {
                        const reading = engineX.readKVLayer(layer, tokenIdx);
                        if (reading) {
                            tokenKV[layer] = {
                                layer: layer,
                                F_K: reading.F_K,
                                F_V: reading.F_V,
                                F_total: reading.F_total
                            };
                        }
                    }
                    local.kvDeltas.push(tokenKV);
                }
                uiLog(`Captured KV deltas for ${local.tokenCount} tokens`, 'info');
            } catch (err) {
                uiLog(`Failed to capture KV deltas: ${err.message}`, 'warn');
            }
        }

        async function saveMatrixToIDB() {
            if (!globalState) return;
            const statusEl = document.getElementById('autosave-status');
            try {
                if (!idbInstance) idbInstance = await openIDB();
                const data = buildFullExportData();
                data.sessionId = globalState.id; // keyPath
                await new Promise((resolve, reject) => {
                    const tx = idbInstance.transaction(IDB_STORE, 'readwrite');
                    tx.objectStore(IDB_STORE).put(data);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
                if (statusEl) statusEl.textContent = `IDB: saved ${new Date().toLocaleTimeString()}`;
            } catch (err) {
                if (statusEl) statusEl.textContent = 'IDB: failed';
                uiLog(`IndexedDB autosave failed: ${err.message}`, 'warn');
            }
        }

        // Export entire downloaded model (weights + config) as portable archive

        async function exportFullMlcArchive() {
            if (!globalState || !engineX) {
                uiLog('No model loaded. Load a model first.', 'warn');
                return;
            }

            const modelId = globalState.modelId;
            const cacheBackend = document.getElementById('cache-backend-select')?.value || 'cache';
            
            uiLog(`Exporting full MLC archive for ${modelId} (backend: ${cacheBackend})...`, 'info');

            try {
                const archiveData = {
                    version: '1.00.09',
                    modelId: modelId,
                    cacheBackend: cacheBackend,
                    exportedAt: new Date().toISOString(),
                    exportedAtEpoch: Date.now(),
                    files: []
                };

                if (cacheBackend === 'indexeddb' || cacheBackend === 'cache') {
                    // Read from IDB (preferred by WebLLM)
                    const idb = await new Promise((resolve, reject) => {
                        const req = indexedDB.open('webllm');
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });

                    const stores = Array.from(idb.objectStoreNames);
                    for (const storeName of stores) {
                        const tx = idb.transaction(storeName, 'readonly');
                        const store = tx.objectStore(storeName);
                        const req = store.getAll();
                        
                        await new Promise((resolve, reject) => {
                            req.onsuccess = () => {
                                const items = req.result;
                                items.forEach(item => {
                                    if (item.key?.includes(modelId) || storeName.includes(modelId)) {
                                        archiveData.files.push({
                                            store: storeName,
                                            key: item.key || item.id,
                                            data: item.data ? item.data.toString() : JSON.stringify(item)
                                        });
                                    }
                                });
                                resolve();
                            };
                            req.onerror = () => reject(req.error);
                        });
                    }
                }

                const filename = `SMatrix-MLC-Archive-${modelId}-${Date.now()}.json`;
                const json = JSON.stringify(archiveData, null, 2);
                const encoder = new TextEncoder();
                const encoded = encoder.encode(json);

                // Stream to disk
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(encoded);
                    await writable.close();
                    uiLog(`MLC archive exported: ${handle.name} (${encoded.length / 1024 / 1024 | 0}MB)`, 'info');
                    return;
                }

                const blob = new Blob([encoded], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
                uiLog(`MLC archive downloaded: ${filename} (${encoded.length / 1024 / 1024 | 0}MB)`, 'info');
            } catch (err) {
                if (err.name !== 'AbortError') {
                    uiLog(`MLC archive export failed: ${err.message}`, 'error');
                }
            }
        }

        async function importFullMlcArchive() {

                    const archive = JSON.parse(text);

                    if (!archive.modelId || !archive.files) {
                        uiLog('Invalid MLC archive format (need modelId and files).', 'warn');
                        return;
                    }

                    // Restore to IDB (or target cache backend)
                    const idb = await new Promise((resolve, reject) => {
                        const req = indexedDB.open('webllm');
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });

                    let restored = 0;
                    for (const file of archive.files) {

        async function captureBaseKVCache(modelId) {
            if (!globalState) return null;
            try {
                const arch = KV_MODEL_ARCH[modelId];
                if (!arch || !engineX) return null;
                
                const baseKV = {};
                const pipeline = engineX.device._pipeline;
                const handle = pipeline?.kvCache?.handle;
                const viewF32 = pipeline?.vm?.mod?.lib?.memory?.viewF32;

                if (!handle || !viewF32) {
                    uiLog('Cannot capture base KV: engine memory not accessible.', 'warn');
                    return null;
                }

                for (let layer = 0; layer < arch.layers; layer++) {
                    const kvPerLayer = arch.kvDim * 2;
                    const kStart = handle + layer * (kvPerLayer * KV_MAX_POSITIONS) + 0 * kvPerLayer;
                    const vStart = kStart + arch.kvDim;

                    const K = Array.from(viewF32.slice(kStart, kStart + arch.kvDim));
                    const V = Array.from(viewF32.slice(vStart, vStart + arch.kvDim));

                    baseKV[layer] = { K, V };
                }

                globalState.baseKVCache = baseKV;
                uiLog(`Captured base KV cache (${arch.layers} layers, ${arch.kvDim}D each).`, 'info');
                return baseKV;
            } catch (err) {
                uiLog(`Failed to capture base KV cache: ${err.message}`, 'warn');
                return null;
            }
        }

        // ─── STREAMING EXPORT UTILITY ────────────────────────────────────────
        // For large files (MLC, BaseKV, Session), stream to disk with progress updates

        async function streamExportToDisk(filename, dataGenerator) {
            try {
                const progressEl = document.getElementById('export-progress');
                if (!progressEl) {
                    uiLog('Export progress element not found', 'warn');
                    return;
                }

                if (window.showSaveFilePicker) {
                    // File System Access API (Chrome/Edge)
                    const handle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
                    });
                    const writable = await handle.createWritable();
                    let totalWritten = 0;

                    for await (const {chunk, progress} of dataGenerator()) {
                        await writable.write(chunk);
                        totalWritten += chunk.length;
                        const pct = progress || Math.round((totalWritten / 1e7) * 100); // rough estimate
                        progressEl.textContent = `Exporting: ${pct}%`;
                        progressEl.style.display = 'inline';
                    }

                    await writable.close();
                    progressEl.textContent = 'Export complete';
                    progressEl.style.display = 'none';
                    uiLog(`${filename} streamed to disk`, 'info');
                    return;
                }

                // Fallback: download (less efficient, but gather all chunks first)
                const chunks = [];
                let totalSize = 0;

                for await (const {chunk, progress} of dataGenerator()) {
                    chunks.push(chunk);
                    totalSize += chunk.length;
                    progressEl.textContent = `Preparing: ${totalSize / 1024 / 1024 | 0}MB`;
                    progressEl.style.display = 'inline';
                }

                const blob = new Blob(chunks, { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
                progressEl.textContent = 'Download complete';
                progressEl.style.display = 'none';
                uiLog(`${filename} downloaded`, 'info');
            } catch (err) {
                if (err.name !== 'AbortError') {
                    uiLog(`Stream export failed: ${err.message}`, 'error');
                }
            }
        }

        // Generator for streaming MLC config (small, but principle)
        async function* mlcConfigGenerator() {
