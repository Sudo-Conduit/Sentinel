        // Generator for streaming BaseKV (potentially large)
        async function* baseKVGenerator() {
            if (!globalState.baseKVCache) {
                uiLog('No BaseKV to export', 'warn');
                return;
            }

            const cache = globalState.baseKVCache;
            const header = {
                version: '1.00.09',
                modelId: globalState.modelId,
                exportedAt: new Date().toISOString(),
                exportedAtEpoch: Date.now()
            };

            // Stream header
            const encoder = new TextEncoder();
            yield { chunk: encoder.encode(JSON.stringify(header) + '\n"baseKVCache":{'), progress: 5 };

            const layers = Object.keys(cache).sort((a, b) => parseInt(a) - parseInt(b));
            const layerCount = layers.length;

            for (let i = 0; i < layerCount; i++) {
                const layer = layers[i];
                const layerData = cache[layer];
                
                // Stream each layer's data
                const layerJson = JSON.stringify({ [layer]: layerData });
                const stripped = layerJson.substring(1, layerJson.length - 1); // remove outer braces
                const prefix = i === 0 ? '' : ',';
                yield { chunk: encoder.encode(prefix + stripped), progress: 5 + (i / layerCount) * 90 };
            }

            // Stream footer
            yield { chunk: encoder.encode('}'), progress: 95 };
        }

        // Generator for streaming full session (largest, includes all deltas)
        async function* sessionGenerator() {
            if (!globalState) {
                uiLog('No session to export', 'warn');
                return;
            }

            const data = buildFullExportData();
            const encoder = new TextEncoder();

            // Stream in chunks to avoid memory pressure
            const json = JSON.stringify(data, null, 2);
            const chunkSize = 64 * 1024; // 64KB chunks
            const totalSize = json.length;

            for (let i = 0; i < json.length; i += chunkSize) {
                const chunk = json.substring(i, i + chunkSize);
                const progress = Math.round((i / totalSize) * 100);
                yield { chunk: encoder.encode(chunk), progress };
                // Small delay to prevent blocking
                await new Promise(resolve => setTimeout(resolve, 0));
            }
        }

        // Update export functions to use streaming
        async function exportBaseKVToDisk() {
            if (!globalState || !globalState.baseKVCache) {
                uiLog('No base KV cache captured yet. Load a model first.', 'warn');
                return;
            }
            const filename = `SMatrix-BaseKV-${globalState.modelId}-${Date.now()}.json`;
            await streamExportToDisk(filename, baseKVGenerator);
        }

        async function saveMatrixToDisk() {
            if (!globalState) {
                uiLog('Nothing to save yet — no session started.', 'warn');
                return;
            }
            const filename = `smatrix-${globalState.modelId}-${Date.now()}.json`;
            await streamExportToDisk(filename, sessionGenerator);
        }

        async function exportMlcConfigToDisk() {
            const config = await captureMlcConfig();
            if (!config) {
                uiLog('No MLC config to export. Load a model first.', 'warn');
                return;
            }
            try {
                const json = JSON.stringify(config, null, 2);
                const filename = `SMatrix-MLC-${config.modelId}-${Date.now()}.json`;

                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(json);
                    await writable.close();
                    uiLog(`MLC config exported: ${handle.name}`, 'info');
                    return;
                }
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
                uiLog(`MLC config downloaded: ${filename}`, 'info');
            } catch (err) {
                if (err.name !== 'AbortError') {
                    uiLog(`MLC export failed: ${err.message}`, 'error');
                }
            }
        }

        async function loadMlcConfigFromDisk() {
            try {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const text = await file.text();
                    const config = JSON.parse(text);

                    if (!config.modelId) {
                        uiLog('File does not contain a valid MLC config (need modelId).', 'warn');
                        return;
                    }

                    // Apply config to UI
                    document.getElementById('model-select').value = config.modelId;
                    if (config.cacheBackend) {
                        document.getElementById('cache-backend-select').value = config.cacheBackend;
                    }
                    if (config.contextWindowSize) {
                        const slider = document.getElementById('context-window-slider');
                        slider.value = config.contextWindowSize;
                        document.getElementById('ctx-display').textContent = config.contextWindowSize;
                    }

                    // Store config
                    if (!globalState) {
                        globalState = new GlobalState({ modelId: config.modelId });
                    }
                    globalState.mlcConfig = config;
                    await saveMatrixToIDB();

                    uiLog(`MLC config loaded: ${config.modelId} (cache: ${config.cacheBackend}, ctx: ${config.contextWindowSize || 'default'})`, 'info');
                };
                input.click();
            } catch (err) {
                uiLog(`Load MLC config failed: ${err.message}`, 'error');
            }
        }

        // Wire up buttons
        document.getElementById('export-mlc-btn')?.addEventListener('click', exportMlcConfigToDisk);
        document.getElementById('load-mlc-btn')?.addEventListener('click', loadMlcConfigFromDisk);

        document.getElementById('load-basekv-btn')?.addEventListener('click', loadBaseKVFromDisk);

        document.getElementById('export-basekv-btn')?.addEventListener('click', exportBaseKVToDisk);
        document.getElementById('import-session-btn')?.addEventListener('click', importSessionFromDisk);

        document.getElementById('save-disk-btn').addEventListener('click', saveMatrixToDisk);

        document.getElementById('export-btn').addEventListener('click', () => {
            const jsonStr = JSON.stringify(buildExportData(), null, 2);
            document.getElementById('export-content').textContent = jsonStr;
            document.getElementById('export-modal').classList.add('visible');
        });

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('export-modal').classList.remove('visible');
        });

        document.getElementById('copy-json-btn').addEventListener('click', () => {
            const content = document.getElementById('export-content').textContent;
            navigator.clipboard.writeText(content).then(() => {
                const btn = document.getElementById('copy-json-btn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
            }).catch(() => {
                const range = document.createRange();
                range.selectNode(document.getElementById('export-content'));
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                const btn = document.getElementById('copy-json-btn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
            });
        });

        document.getElementById('download-json-btn').addEventListener('click', () => {
            const jsonStr = JSON.stringify(buildExportData(), null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const modelName = document.getElementById('model-select').value.split('-')[0];
            a.href = url;
            a.download = `smatrix_${modelName}_${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // ─── KEYBOARD SHORTCUTS ──────────────────────────────────────────────

        document.addEventListener('keydown', (e) => {
            // Don't hijack keystrokes typed into the prompt box (space would
            // otherwise trigger Start/Stop, 'e'/'t'/'c'/'r' would fire their
            // shortcuts instead of typing those letters).
            if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;

            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (isRunning) {
                    document.getElementById('stop-btn').click();
                } else {
                    document.getElementById('start-btn').click();
                }
            }
            if (e.key === '1') {
                camera.position.set(14, 10, 20);
                orbitControls.target.set(0, 0, 0);
                orbitControls.update();
            }
            if (e.key === 'e' || e.key === 'E') {
                document.getElementById('export-btn').click();
            }
            if (e.key === 't' || e.key === 'T') {
                document.getElementById('layout-toggle-btn').click();
            }
            if (e.key === 'k' || e.key === 'K') {
                document.getElementById('console-toggle').click();
            }
            if (e.key === 'Escape') {
                document.getElementById('export-modal').classList.remove('visible');
                consolePanelEl.classList.remove('visible');
            }
        });

        // ─── ANIMATION LOOP ──────────────────────────────────────────────────

        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ─── INIT ────────────────────────────────────────────────────────────

        document.getElementById('progress-sub').textContent = 'Press ▶ Start or SPACE';

        console.log('🧠 S-Matrix · Real WebLLM · Three.js');
        console.log('📦 Model: ' + document.getElementById('model-select').value);
        console.log('⌨️  SPACE = start/stop, r = rotate, 1 = reset view, e = export JSON, t = toggle torus, c = console');

    </script>

</body>
