kground:#f7f8fa; }\n  .designer-sticky-head { position:sticky; top:-16px; z-index:50; background:#eef1f5; margin:-16px -16px 0 -16px; padding:16px 16px 10px 16px; }\n  #main h2 { margin:0 0 4px; font-size:15px; color:#2b3140; }\n  #main .subtitle { color:#666; font-size:12px; margin-bottom:12px; }\n  table { border-collapse:collapse; width:100%; background:#fff; border:1px solid #bcc7d0; border-radius:4px; overflow:hidden; }\n  th, td { padding:6px 10px; text-align:left; border-bottom:1px solid #e2e6ec; font-size:12px; }\n  th { background:#f7f8fa; color:#555; font-weight:600; border-bottom:1px solid #bcc7d0; }\n  tr:last-child td { border-bottom:none; }\n  .kpi-row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }\n  .kpi { background:#fff; border:1px solid #bcc7d0; border-radius:4px; padding:10px 16px; min-width:140px; }\n  .kpi .label { font-size:11px; color:#8892a0; text-transform:uppercase; }\n  .kpi .value { font-size:18px; font-weight:600; color:#2b3140; margin-top:2px; }\n  .gap-flag { color:#c0392b; font-weight:600; }\n  .vacant-flag { color:#c0392b; font-weight:600; }\n  .tree-line { padding:3px 0 3px 0; font-size:12px; }\n  .grp-header { font-weight:600; color:#2b3140; background:#eef1f5; padding:5px 8px; border:1px solid #d3d9e0; border-bottom:none; margin-top:8px; font-size:12px; }\n  .grp-footer { font-weight:600; color:#2b3140; background:#f7f8fa; padding:5px 8px; border:1px solid #d3d9e0; border-top:none; font-size:12px; text-align:right; }\n  .grand-total { margin-top:12px; padding:10px 14px; background:#2b3140; color:#fff; border-radius:4px; font-size:13px; font-weight:600; display:flex; justify-content:space-between; }\n  .crud-toolbar { display:flex; justify-content:flex-end; margin-bottom:8px; }\n  .crud-form { background:#fff; border:1px solid #bcc7d0; border-radius:4px; padding:12px; margin-bottom:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }\n  .crud-form label { display:flex; flex-direction:column; gap:3px; font-size:11px; color:#666; }\n  .crud-form input[type=text], .crud-form input[type=number] { padding:5px 7px; border:1px solid #bcc7d0; border-radius:3px; font:12px system-ui; }\n  .crud-form .form-actions { grid-column:1/-1; display:flex; gap:8px; margin-top:4px; }\n  td.actions-cell { display:flex; gap:6px; }\n  td.actions-cell button { background:#fff; border:1px solid #bcc7d0; border-radius:3px; padding:3px 8px; font:11px system-ui; cursor:pointer; }\n  td.actions-cell button.danger { color:#c0392b; border-color:#e0b0aa; }\n  .crud-shell { display:flex; gap:14px; flex-wrap:wrap; }\n  .crud-list { flex:1 1 280px; max-width:360px; }\n  .crud-list-item { background:#fff; border:1px solid #bcc7d0; border-radius:4px; padding:8px 10px; margin-bottom:6px; cursor:pointer; font-size:12px; }\n  .crud-list-item div { padding:1px 0; }\n  .crud-list-item.selected { border-color:#3b6fd1; background:#e8f0fe; }\n  .crud-detail { flex:2 1 380px; background:#fff; border:1px solid #bcc7d0; border-radius:4px; padding:14px; align-self:flex-start; }\n  .crud-modal-overlay { position:fixed; inset:0; background:rgba(20,24,32,0.45); display:flex; align-items:center; justify-content:center; z-index:1000; }\n  .crud-modal { background:#fff; border-radius:6px; width:min(520px,92vw); max-height:86vh; display:flex; flex-direction:column; box-shadow:0 12px 32px rgba(0,0,0,0.28); position:relative; }\n  .crud-modal-close { position:absolute; top:8px; left:8px; width:16px; height:16px; padding:8px; background:#7a1f2b; color:#fff; border:none; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:0; box-sizing:content-box; }\n  .crud-modal-close:hover { background:#5e1721; }\n  .crud-modal-body { padding:16px 16px 12px 16px; padding-top:34px; overflow-y:auto; }\n  .crud-modal-footer { display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; border-top:1px solid #e2e6ea; }\n  .crud-modal-footer button { padding:7px 16px; border-radius:3px; font:12px system-ui; cursor:pointer; }\n  .crud-modal-footer .btn-save { background:#3b6fd1; color:#fff; border:1px solid #3b6fd1; }\n  .crud-modal-footer .btn-cancel { background:#fff; color:#333; border:1px solid #bcc7d0; }\n  .rband-toolbar { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }\n  .rband-toolbar select, .rband-toolbar button { padding:5px 9px; font:12px system-ui; border:1px solid #bcc7d0; border-radius:3px; background:#fff; cursor:pointer; }\n  .rband { border:1px solid #bcc7d0; border-radius:4px; margin-bottom:10px; background:#fff; }\n  .rband-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#6b7382; background:#eef1f5; padding:4px 8px; border-bottom:1px solid #d3d9e0; display:flex; justify-content:space-between; }\n  .rband-canvas { position:relative; background-image:radial-gradient(circle,#dde2e8 1px,transparent 1px); background-size:10px 10px; }\n  .rband-el { position:absolute; background:#fff; border:1px solid #9fb3d1; border-radius:2px; font-size:11px; color:#20242c; display:flex; align-items:center; padding:0 6px; cursor:move; overflow:hidden; white-space:nowrap; user-select:none; }\n  .rband-el.selected { border:2px solid #3b6fd1; box-shadow:0 0 0 1px #3b6fd1 inset; }\n  .rband-el.type-runningTotal { background:#fff7e6; border-color:#d1a53b; font-weight:600; }\n  .rband-el.type-groupValue { background:#eef1fb; font-weight:600; }\n  .rband-resize-handle { position:absolute; right:-4px; bottom:-4px; width:9px; height:9px; background:#3b6fd1; border-radius:1px; cursor:nwse-resize; }\n  .rband-props { background:#f7f8fa; border:1px solid #d3d9e0; border-radius:4px; padding:10px 12px; margin-bottom:12px; font-size:12px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }\n  .crud-field-row { display:flex; flex-direction:column; gap:3px; margin-bottom:10px; font-size:12px; }\n  .crud-field-row label { color:#666; font-size:11px; }\n  .crud-field-row input[type=text], .crud-field-row input[type=number] { padding:6px 8px; border:1px solid #bcc7d0; border-radius:3px; font:12px system-ui; }\n  .crud-field-readonly { padding:6px 8px; background:#f4f6f8; border-radius:3px; color:#555; }\n  .required-mark { color:#c0392b; }\n  @media (max-width:900px) { .crud-shell { flex-direction:column; } .crud-detail, .crud-list { max-width:none; } }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<div id=\"titlebar\">MESHUI — Org Reports (Surface Explorer)<\u002Fdiv>\n<div id=\"toolbar\">\n  <div id=\"toolbar-loading-icon\"><\u002Fdiv>\n  <button onclick=\"setFY('2025')\" id=\"fy-btn\" class=\"active\">FY 2025<\u002Fbutton>\n  <span style=\"width:1px;height:18px;background:#c3c8d0;margin:0 4px\"><\u002Fspan>\n  <label style=\"font-size:12px;color:#555\">Viewpoint:<\u002Flabel>\n  <select id=\"role-select\" onchange=\"renderCurrent()\">\n    <option value=\"admin\">Admin<\u002Foption>\n    <option value=\"payroll-finance\">Payroll / Finance<\u002Foption>\n    <option value=\"case-worker\">Case Worker<\u002Foption>\n  <\u002Fselect>\n  <label style=\"font-size:12px;color:#555;margin-left:10px\">Acting as:<\u002Flabel>\n  <select id=\"session-select\" onchange=\"setSession(this.value)\"><\u002Fselect>\n  <span style=\"width:1px;height:18px;background:#c3c8d0;margin:0 4px\"><\u002Fspan>\n  <label style=\"font-size:12px;color:#555\">Dataset:<\u002Flabel>\n  <select id=\"dataset-select\" onchange=\"switchDataset(this.value)\">\n    <option value=\"real\">Real Data (HOPE Shelters 2025)<\u002Foption>\n    <option value=\"sample\">Sample Data<\u002Foption>\n  <\u002Fselect>\n<\u002Fdiv>\n\n<div id=\"body\">\n  <div id=\"nav\"><\u002Fdiv>\n  <div id=\"main\" style=\"padding-bottom:64px\"><\u002Fdiv>\n<\u002Fdiv>\n<div id=\"report-footer\">\n  <span class=\"grand-total-inline\" id=\"report-footer-total\"><\u002Fspan>\n  <button onclick=\"exportPayrollPDF()\">Export PDF<\u002Fbutton>\n<\u002Fdiv>\n\n<script>\n// ─── Two datasets: real HOPE Shelters payroll/staff (parsed from PayrollDetail.csv\n// + the org chart) and the original synthetic sample ─── both build a fresh\n// Organization so reports/CRUD/designer can be tested against either. ───────\nfunction buildSyntheticOrg() {\nconst org = new Organization({ name: 'Riverside Shelter (sample data)' });\nconst fy = '2026';\nconst payrollCat = org.addBudgetCategory(new BudgetCategory({ name: 'Payroll', fiscalYear: fy, allocatedAmount: 420000 }));\nconst opsCat = org.addBudgetCategory(new BudgetCategory({ name: 'Operations', fiscalYear: fy, allocatedAmount: 90000 }));\n\nconst alice = org.addStaff(new Staff({ name: 'Sample Staff A', employmentType: 'full-time', roleTitle: 'Case Manager', shiftPreference: 'day', payType: 'hourly', payRate: 24, hireDate: '2023-02-01', email: 'a@example.org', createdBy: 'system-admin' }));\nconst ben = org.addStaff(new Staff({ name: 'Sample Staff B', employmentType: 'part-time', roleTitle: 'Shelter Monitor', shiftPreference: 'night', payType: 'hourly', payRate: 19, hireDate: '2024-06-15', email: 'b@example.org', createdBy: 'system-admin' }));\n\norg.addShift(new Shift({ staffId: alice.id, date: '2026-07-20', shiftType: 'Day', shiftLabel: '8a-4p', postAssignment: 'Front Desk', createdBy: alice.id }));\norg.addShift(new Shift({ staffId: ben.id, date: '2026-07-20', shiftType: 'Night', shiftLabel: '4p-12a', postAssignment: 'Floor Monitor', createdBy: alice.id }));\norg.addShift(new Shift({ staffId: '', date: '2026-07-21', shiftType: 'Night', status: 'open', createdBy: alice.id }));\n\norg.addPayrollRecord(new PayrollRecord({\n  staffId: alice.id, department: '10 - AS -- SCoordination', periodStart: '2026-07-01', periodEnd: '2026-07-15',\n  earnings: [{ type: 'Regular', hours: 80, rate: 24, amount: 1920 }, { type: 'Overtime', hours: 2, rate: 36, amount: 72 }],\n  totalHours: 82, totalEarnings: 1992,\n  taxes: { fedSocSec: 123.50, fedMedcare: 28.88, stateSIT: 82.67, total: 235.05 },\n  deductions: { medicalPreTax: 180, total: 180 }, netPay: 1576.95,\n  employerLiability: { fedSocSecER: 123.50, fedMedcareER: 28.88, total: 152.38 },\n  payments: [{ method: 'Direct Deposit', checkDate: '2026-07-18', transactionId: 'XXXX0001', amount: 1576.95 }],\n  budgetCategoryId: payrollCat.id\n}));\norg.addPayrollRecord(new PayrollRecord({\n  staffId: ben.id, department: '10 - AS -- SCoordination', periodStart: '2026-07-01', periodEnd: '2026-07-15',\n  earnings: [{ type: 'Regular', hours: 60, rate: 19, amount: 1140 }],\n  totalHours: 60, totalEarnings: 1140,\n  taxes: { fedSocSec: 70.68, fedMedcare: 16.53, stateSIT: 47.31, total: 134.52 },\n  deductions: { total: 0 }, netPay: 1005.48,\n  employerLiability: { fedSocSecER: 70.68, fedMedcareER: 16.53, total: 87.21 },\n  payments: [{ method: 'Direct Deposit', checkDate: '2026-07-18', transactionId: 'XXXX0002', amount: 1005.48 }],\n  budgetCategoryId: payrollCat.id\n}));\n\norg.addExpense(new Expense({ date: '2026-07-05', category: 'Utilities', amount: 3200, vendor: 'City Power', budgetCategoryId: opsCat.id, approvedBy: alice.id, createdBy: alice.id }));\norg.addGrant(new Grant({ source: 'County Housing Fund', amount: 50000, receivedDate: '2026-01-15', restricted: true, budgetCategoryId: payrollCat.id, createdBy: alice.id }));\n\n// ─── Additional periods/seasons of synthetic data, for the month/season reports ──\nfunction seedPayroll(staff, start, end, hours, otHours) {\n  const rate = staff.payRate, otRate = rate * 1.5;\n  const reg = hours * rate, ot = otHours * otRate, gross = reg + ot;\n  const fedSocSec = gross * 0.062, fedMedcare = gross * 0.0145, stateSIT = gross * 0.0415;\n  const taxTotal = fedSocSec + fedMedcare + stateSIT;\n  org.addPayrollRecord(new PayrollRecord({\n    staffId: staff.id, department: '10 - AS -- SCoordination', periodStart: start, periodEnd: end,\n    earnings: otHours ? [{ type: 'Regular', hours, rate, amount: reg }, { type: 'Overtime', hours: otHours, rate: otRate, amount: ot }] : [{ type: 'Regular', hours, rate, amount: reg }],\n    totalHours: hours + otHours, totalEarnings: gross,\n    taxes: { fedSocSec, fedMedcare, stateSIT, total: taxTotal },\n    deductions: { total: 0 }, netPay: gross - taxTotal,\n    employerLiability: { fedSocSecER: fedSocSec, fedMedcareER: fedMedcare, total: fedSocSec + fedMedcare },\n    payments: [{ method: 'Direct Deposit', checkDate: end, transactionId: 'XXXX' + Math.floor(Math.random()*9000+1000), amount: gross - taxTotal }],\n    budgetCategoryId: payrollCat.id\n  }));\n}\nseedPayroll(alice, '2026-01-01', '2026-01-15', 80, 0);\nseedPayroll(ben, '2026-01-01', '2026-01-15', 55, 0);\nseedPayroll(alice, '2026-04-01', '2026-04-15', 80, 4);\nseedPayroll(ben, '2026-04-01', '2026-04-15', 62, 0);\nseedPayroll(alice, '2026-10-01', '2026-10-15', 80, 1);\nseedPayroll(ben, '2026-10-01', '2026-10-15', 58, 3);\n\norg.addExpense(new Expense({ date: '2026-01-10', category: 'Utilities', amount: 2800, vendor: 'City Power', budgetCategoryId: opsCat.id, approvedBy: alice.id, createdBy: alice.id }));\norg.addExpense(new Expense({ date: '2026-02-14', category: 'Supplies', amount: 450, vendor: 'Shelter Supply Co', budgetCategoryId: opsCat.id, approvedBy: ben.id, createdBy: ben.id }));\norg.addExpense(new Expense({ date: '2026-04-08', category: 'Food Services', amount: 1900, vendor: 'Metro Food Bank', budgetCategoryId: opsCat.id, approvedBy: alice.id, createdBy: alice.id }));\norg.addExpense(new Expense({ date: '2026-05-20', category: 'Maintenance', amount: 1200, vendor: 'Facilities Inc', budgetCategoryId: opsCat.id, approvedBy: ben.id, createdBy: ben.id }));\norg.addExpense(new Expense({ date: '2026-08-12', category: 'Food Services', amount: 2100, vendor: 'Metro Food Bank', budgetCategoryId: opsCat.id, approvedBy: alice.id, createdBy: alice.id }));\norg.addExpense(new Expense({ date: '2026-10-03', category: 'Utilities', amount: 3400, vendor: 'City Power', budgetCategoryId: opsCat.id, approvedBy: ben.id, createdBy: ben.id }));\norg.addExpense(new Expense({ date: '2026-11-18', category: 'Supplies', amount: 620, vendor: 'Shelter Supply Co', budgetCategoryId: opsCat.id, approvedBy: alice.id, createdBy: alice.id }));\n\nconst orgChart = OrgPosition.buildHopeSheltersChart();\nreturn { org, orgChart };\n}\n\nfunction buildRealOrg() {\n  const org = new Organization({ name: 'HOPE Hospitality and Warming Center (real 2025 payroll)' });\n  // No real annual budget/expense documents yet — estimate the Payroll\n  // category's allocation from staff alone: payRate × a standard annual-hours\n  // assumption per employment type (2080 = full-time 40hr/wk, 1000 = part-time\n  // ~20hr/wk). Swap for a real budget figure once one is provided.\n  const FULL_TIME_ANNUAL_HOURS = 2080, PART_TIME_ANNUAL_HOURS = 1000;\n  const estimatedPayrollBudget = REAL_ORG_DATA.staff.reduce((sum, s) => sum + s.payRate * (s.employmentType === 'full-time' ? FULL_TIME_ANNUAL_HOURS : PART_TIME_ANNUAL_HOURS), 0)\n    + REAL_SHIFT_DATA.staff.reduce((sum, s) => sum + s.payRate * PART_TIME_ANNUAL_HOURS, 0);\n  const payrollCat = org.addBudgetCategory(new BudgetCategory({ name: 'Payroll (estimated from staff)', fiscalYear: '2025', allocatedAmount: Math.round(estimatedPayrollBudget) }));\n  const staffIdMap = {};\n  REAL_ORG_DATA.staff.forEach(s => {\n    const created = org.addStaff(new Staff({\n      name: s.name, roleTitle: s.roleTitle, employmentType: s.employmentType,\n      payType: s.payType, payRate: s.payRate, status: s.status, hireDate: '', createdBy: 'system-import'\n    }));\n    staffIdMap[s.id] = created.id;\n  });\n  const shiftStaffIdMap = {};\n  REAL_SHIFT_DATA.staff.forEach(s => {\n    const created = org.addStaff(new Staff({\n      name: s.name, roleTitle: s.roleTitle, employmentType: s.employmentType,\n      payType: s.payType, payRate: s.payRate, status: s.status, hireDate: '', createdBy: 'system-import'\n    }));\n    shiftStaffIdMap[s.id] = created.id;\n  });\n  REAL_SHIFT_DATA.shifts.forEach(sh => {\n    const staffId = shiftStaffIdMap[sh.staffId];\n    if (!staffId) return;\n    org.addShift(new Shift({\n      staffId, date: sh.date, shiftType: sh.shiftType, shiftLabel: sh.shiftLabel,\n      startEpoch: sh.startEpoch, endEpoch: sh.endEpoch, status: sh.status,\n      hoursScheduled: sh.hoursScheduled, hoursActual: sh.hoursActual, payRateUsed: sh.payRateUsed,\n      postAssignment: sh.postAssignment, createdBy: 'system-import'\n    }));\n  });\n  REAL_ORG_DATA.payrollRecords.forEach(p => {\n    const staffId = staffIdMap[p.staffId];\n    if (!staffId) return;\n    org.addPayrollRecord(new PayrollRecord({\n      staffId, department: p.department, periodStart: p.periodStart, periodEnd: p.periodEnd,\n      earnings: [{ type: 'Regular', hours: p.totalHours, rate: 0, amount: p.totalEarnings }],\n      totalHours: p.totalHours, totalEarnings: p.totalEarnings,\n      taxes: p.taxes, deductions: p.deductions, netPay: p.netPay,\n      employerLiability: p.employerLiability,\n      payments: [{ method: 'Direct Deposit', checkDate: p.periodEnd, transactionId: '', amount: p.netPay }],\n      budgetCategoryId: payrollCat.id\n    }));\n  });\n  const orgChart = OrgPosition.buildHopeSheltersChart();\n  return { org, orgChart };\n}\n\nlet currentDataset = 'real';\nlet fy = '2025';\nlet { org, orgChart } = buildRealOrg();\nfunction switchDataset(mode) {\n  currentDataset = mode;\n  fy = mode === 'real' ? '2025' : '2026';\n  const built = mode === 'real' ? buildRealOrg() : buildSyntheticOrg();\n  org = built.org; orgChart = built.orgChart;\n  crudEditingId = null;\n  initSessionSelector();\n  renderCurrent();\n}\n\n// ─── Navigator ────────────────────────────────────────────────────────────\nconst NAV = [\n  { group: 'Data Surfaces', items: [\n    { id: 'staff', label: 'Staff Roster' },\n    { id: 'scheduling', label: 'Scheduling' },\n    { id: 'payroll', label: 'Payroll' },\n    { id: 'budget', label: 'Budget' },\n    { id: 'orgchart', label: 'Org Chart' }\n  ]},\n  { group: 'Data Entry', items: [\n    { id: 'crud-staff', label: 'Staff (CRUD)' },\n    { id: 'crud-shifts', label: 'Shifts (CRUD)' },\n    { id: 'crud-expenses', label: 'Expenses (CRUD)' },\n    { id: 'crud-grants', label: 'Grants (CRUD)' }\n  ]},\n  { group: 'Designer', items: [\n    { id: 'report-designer', label: 'Report Band Designer' }\n  ]},\n  { group: 'Reports', items: [\n    { id: 'report-staff-expense-month', label: '#1 Comprehensive Staff Expense by Month' },\n    { id: 'report-expense-season', label: '#2 Expenses by Season' },\n    { id: 'report-payroll', label: '#3 Payroll Report' },\n    { id: 'report-payroll-budget', label: 'Payroll & Budget Report' },\n    { id: 'report-pl', label: 'Profit & Loss Statement' },\n    { id: 'report-coverage', label: 'Staffing Coverage Report' }\n  ]}\n];\n\nlet current = 'staff';\nlet SESSION = { staffId: '', name: '', department: '' };\nfunction setSession(staffId) {\n  const s = org.staff.find(x => x.id === staffId);\n  SESSION = s ? { staffId: s.id, name: s.name, department: s.roleTitle } : { staffId: '', name: '', department: '' };\n  renderCurrent();\n}\nfunction initSessionSelector() {\n  const sel = document.getElementById('session-select');\n  sel.innerHTML = org.staff.map(s => `<option value=\"${s.id}\">${s.name}<\u002Foption>`).join('');\n  if (org.staff.length) setSession(org.staff[0].id);\n}\nlet collapsedGroups = new Set();\nfunction toggleNavGroup(g) {\n  if (collapsedGroups.has(g)) collapsedGroups.delete(g); else collapsedGroups.add(g);\n  renderNav();\n}\nfunction renderNav() {\n  const nav = document.getElementById('nav');\n  nav.innerHTML = NAV.map(g => {\n    const isCollapsed = collapsedGroups.has(g.group);\n    return `\n    <div class=\"group-label\" onclick=\"toggleNavGroup('${g.group}')\"><span>${g.group}<\u002Fspan><span class=\"group-caret ${isCollapsed ? 'collapsed' : ''}\">\\u25be<\u002Fspan><\u002Fdiv>\n    ${isCollapsed ? '' : g.items.map(it => `<div class=\"item ${it.id===current?'selected':''}\" onclick=\"selectNav('${it.id}')\">${it.label}<\u002Fdiv>`).join('')}\n  `;\n  }).join('');\n}\nfunction selectNav(id) { current = id; crudEditingId = null; crudSearchTerm = ''; crudPage = 0; renderNav(); renderCurrent(); }\nfunction exportPayrollPDF() { window.open('./Payroll-Report.html', '_blank'); }\nfunction setFY(v) { fy = v; document.getElementById('fy-btn').textContent = 'FY ' + fy; renderCurrent(); }\n\nfunction money(n) { return '$' + (n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }\n\n// ─── Profit & Loss Statement ────────────────────────────────────────────\n// Follows the standard P&L template (Sales Revenue / Cost of Sales / Gross\n// Profit / Operating Expenses (S&M, R&D, G&A) / Other Income / Taxes / Net\n// Profit). We do not have every line item this template calls for (Rent,\n// Telephone, Insurance, Depreciation, income/real-estate taxes \\u2014 a\n// nonprofit shelter tracks none of these); those render as N/A (\"\\u2014\"),\n// distinct from a tracked line that's genuinely $0. N/A lines contribute 0\n// to their subtotal (same as a blank cell in a spreadsheet SUM), but the\n// subtotal itself only reads \"\\u2014\" when EVERY line feeding it is N/A.\n// Prior Period is N/A throughout \\u2014 only one fiscal year of data exists.\nfunction plRow(label, actual, budget) {\n  return { label, actual, budget, na: actual === null };\n}\nfunction plSubtotal(label, code, rows) {\n  const allNA = rows.every(r => r.na);\n  return { label, code, actual: allNA ? null : rows.reduce((s, r) => s + (r.actual || 0), 0), budget: rows.every(r => r.budget == null) ? null : rows.reduce((s, r) => s + (r.budget || 0), 0), na: allNA };\n}\nfunction plFormatPct(actual, base) {\n  if (actual === null || base === null || !base) return '\\u2014';\n  return ((actual / base) * 100).toFixed(1) + '%';\n}\nfunction plFormatChangePct(actual, compare) {\n  if (actual === null || compare === null || !compare) return '\\u2014';\n  return (((actual - compare) / Math.abs(compare)) * 100).toFixed(1) + '%';\n}\nfunction renderPLReport() {\n  const payrollProj = org.payrollProjection();\n  const totalWages = payrollProj.records.length ? payrollProj.totalGross : null;\n  const employerPayrollTax = payrollProj.records.length ? payrollProj.records.reduce((s, r) => s + (r.totalEmployerLiability ? r.totalEmployerLiability() : 0), 0) : null;\n  const expenseByCategory = {};\n  org.expenses.forEach(e => { expenseByCategory[e.category] = (expenseByCategory[e.category] || 0) + e.amount; });\n  const mappedCategories = { Utilities: 'Utilities', Supplies: 'Supplies', Maintenance: 'Repairs and maintenance' };\n  const otherExpenseCategories = Object.keys(expenseByCategory).filter(c => !mappedCategories[c]);\n  const otherExpenseTotal = otherExpenseCategories.reduce((s, c) => s + expenseByCategory[c], 0);\n  const totalGrantIncome = org.grants.reduce((s, g) => s + g.amount, 0);\n  const budgetProj = org.budgetProjection(fy);\n  const payrollBudget = budgetProj.find(b => /payroll/i.test(b.category));\n  const opsBudget = budgetProj.find(b => /operations/i.test(b.category));\n\n  const salesRevenue = [plRow('Product/Service (not applicable \\u2014 nonprofit shelter)', 0, 0)];\n  const costOfSales = [plRow('Product/Service (not applicable \\u2014 nonprofit shelter)', 0, 0)];\n  const salesMarketing = [plRow('Advertising', null, null), plRow('Direct marketing', null, null)];\n  const rd = [plRow('Technology licenses', null, null), plRow('Patents', null, null)];\n  const ga = [\n    plRow('Wages and salaries', totalWages, payrollBudget ? payrollBudget.allocated : null),\n    plRow('Outside services', null, null),\n    plRow('Supplies', expenseByCategory['Supplies'] || (expenseByCategory['Supplies'] === 0 ? 0 : null), opsBudget ? opsBudget.allocated * 0.1 : null),\n    plRow('Meals and entertainment', null, null),\n    plRow('Rent', null, null),\n    plRow('Telephone', null, null),\n    plRow('Utilities', expenseByCategory['Utilities'] ?? (org.expenses.length ? 0 : null), opsBudget ? opsBudget.allocated * 0.4 : null),\n    plRow('Depreciation', null, null),\n    plRow('Insurance', null, null),\n    plRow('Repairs and maintenance', expenseByCategory['Maintenance'] ?? (org.expenses.length ? 0 : null), opsBudget ? opsBudget.allocated * 0.1 : null),\n    plRow(otherExpenseCategories.length ? 'Other expenses (' + otherExpenseCategories.join(', ') + ')' : 'Other expenses (specify)', otherExpenseCategories.length ? otherExpenseTotal : (org.expenses.length ? 0 : null), null)\n  ];\n  const salesMarketingTotal = plSubtotal('Total Sales and Marketing Expenses', 'M', salesMarketing);\n  const rdTotal = plSubtotal('Total Research and Development Expenses', 'N', rd);\n  const gaTotal = plSubtotal('Total General and Administrative Expenses', 'O', ga);\n  const totalSalesRevenue = plSubtotal('Total Sales Revenue', 'J', salesRevenue);\n  const totalCostOfSales = plSubtotal('Total Cost of Sales', 'K', costOfSales);\n  const grossProfit = { label: 'Gross Profit', code: 'L=J-K', actual: (totalSalesRevenue.actual || 0) - (totalCostOfSales.actual || 0), budget: (totalSalesRevenue.budget || 0) - (totalCostOfSales.budget || 0), na: false };\n  const totalOpEx = { label: 'Total Operating Expenses', code: 'P=M+N+O', actual: (salesMarketingTotal.actual || 0) + (rdTotal.actual || 0) + (gaTotal.actual || 0), budget: (salesMarketingTotal.budget || 0) + (rdTotal.budget || 0) + (gaTotal.budget || 0), na: false };\n  const incomeFromOps = { label: 'Income from Operations', code: 'Q=L-P', actual: grossProfit.actual - totalOpEx.actual, budget: grossProfit.budget - totalOpEx.budget, na: false };\n  const otherIncome = plRow('Other Income (Grants)', org.grants.length ? totalGrantIncome : null, null);\n  const taxes = [\n    plRow('Income taxes (N/A \\u2014 tax-exempt nonprofit)', null, null),\n    plRow('Payroll taxes (employer share)', employerPayrollTax, null),\n    plRow('Real estate taxes', null, null)\n  ];\n  const taxesTotal = plSubtotal('Total Taxes', 'S', taxes);\n  const netProfit = { label: 'Net Profit', code: 'T=Q+R-S', actual: incomeFromOps.actual + (otherIncome.actual || 0) - (taxesTotal.actual || 0), na: false };\n\n  function fmt(v) { return v === null ? '<span class=\"pl-na\">\\u2014<\u002Fspan>' : money(v); }\n  function dataRow(r, bold) {\n    return `<tr${bold ? ' class=\"pl-total-row\"' : ''}><td>${r.label}${r.code ? ` [${r.code}]` : ''}<\u002Ftd>` +\n      `<td class=\"pl-num pl-na\">\\u2014<\u002Ftd><td class=\"pl-num\">${fmt(r.budget)}<\u002Ftd><td class=\"pl-num\">${fmt(r.actual)}<\u002Ftd>` +\n      `<td class=\"pl-num\">${plFormatPct(r.actual, totalSalesRevenue.actual || (org.grants.length ? totalGrantIncome : null))}<\u002Ftd>` +\n      `<td class=\"pl-num pl-na\">\\u2014<\u002Ftd>` +\n      `<td class=\"pl-num\">${plFormatChangePct(r.actual, r.budget)}<\u002Ftd><\u002Ftr>`;\n  }\n  function sectionHead(label) { return `<tr><td class=\"pl-section-head\" colspan=\"7\">${label}<\u002Ftd><\u002Ftr>`; }\n  function subsectionHead(label) { return `<tr><td class=\"pl-subsection-head\" colspan=\"7\">${label}<\u002Ftd><\u002Ftr>`; }\n\n  return `<h2>Profit &amp; Loss Statement<\u002Fh2><div class=\"subtitle\">HOPE Hospitality and Warming Center \\u2014 FY ${fy} \\u2014 built from real payroll/expense/grant data where available; unavailable line items show \\u2014 (N/A), not zero<\u002Fdiv>` +\n    `<table class=\"pl-table\"><tbody>` +\n    `<tr class=\"pl-headers\"><td><\u002Ftd><td>Prior Period<\u002Ftd><td>Budget<\u002Ftd><td>Current Period<\u002Ftd><td>Current Period as % of Revenue<\u002Ftd><td>% Chg from Prior<\u002Ftd><td>% Chg from Budget<\u002Ftd><\u002Ftr>` +\n    sectionHead('Sales Revenue') +\n    salesRevenue.map(r => dataRow(r)).join('') + dataRow(totalSalesRevenue, true) +\n    sectionHead('Cost of Sales') +\n    costOfSales.map(r => dataRow(r)).join('') + dataRow(totalCostOfSales, true) +\n    dataRow(grossProfit, true) +\n    sectionHead('Operating Expenses') +\n    subsectionHead('Sales and Marketing') + salesMarketing.map(r => dataRow(r)).join('') + dataRow(salesMarketingTotal, true) +\n    subsectionHead('Research and Development') + rd.map(r => dataRow(r)).join('') + dataRow(rdTotal, true) +\n    subsectionHead('General and Administrative') + ga.map(r => dataRow(r)).join('') + dataRow(gaTotal, true) +\n    dataRow(totalOpEx, true) +\n    dataRow(incomeFromOps, true) +\n    sectionHead('Other Income') + dataRow(otherIncome) +\n    sectionHead('Taxes') + taxes.map(r => dataRow(r)).join('') + dataRow(taxesTotal, true) +\n    `<tr class=\"pl-grand-row\"><td>${netProfit.label} [${netProfit.code}]<\u002Ftd><td class=\"pl-num pl-na\">\\u2014<\u002Ftd><td class=\"pl-num pl-na\">\\u2014<\u002Ftd><td class=\"pl-num\">${money(netProfit.actual)}<\u002Ftd><td class=\"pl-num pl-na\">\\u2014<\u002Ftd><td class=\"pl-num pl-na\">\\u2014<\u002Ftd><td class=\"pl-num pl-na\">\\u2014<\u002Ftd><\u002Ftr>` +\n    `<\u002Ftbody><\u002Ftable>`;\n}\n\n// ─── Generic report-band engine ────────────────────────────────────────────\n// Reports are declarative: a row list + an ordered list of {label, keyFn, sortFn}\n// group definitions. This is the same engine both priority reports use, and the\n// one any future report/schema-driven designer plugs into — grouping/subtotal/\n// grand-total logic never has to be rewritten per report.\nconst MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nfunction monthOf(dateStr) { return (dateStr || '').slice(0, 7); }\nfunction monthLabel(key) { const [y, m] = key.split('-'); return MONTH_NAMES[parseInt(m, 10) - 1] + ' ' + y; }\nconst SEASON_ORDER = ['Winter', 'Spring', 'Summer', 'Fall'];\nfunction seasonOf(dateStr) { const m = parseInt((dateStr || '').slice(5, 7), 10); if (m === 12 || m <= 2) return 'Winter'; if (m <= 5) return 'Spring'; if (m <= 8) return 'Summer'; return 'Fall'; }\n\nfunction buildGroups(rows, groupDefs, amountFn, level) {\n  level = level || 0;\n  if (level >= groupDefs.length) return null;\n  const def = groupDefs[level];\n  const map = new Map();\n  rows.forEach(r => { const k = def.keyFn(r); if (!map.has(k)) map.set(k, []); map.get(k).push(r); });\n  const keys = [...map.keys()].sort(def.sortFn || ((a, b) => a < b ? -1 : a > b ? 1 : 0));\n  return keys.map(k => {\n    const groupRows = map.get(k);\n    return { label: def.label, key: k, keyLabel: def.keyLabel ? def.keyLabel(k) : k, rows: groupRows,\n      children: buildGroups(groupRows, groupDefs, amountFn, level + 1), subtotal: groupRows.reduce((s, r) => s + amountFn(r), 0) };\n  });\n}\nfunction renderGroups(groups, depth, detailRenderer) {\n  return groups.map(g => `\n    <div class=\"grp-header\" style=\"margin-left:${depth * 16}px\">${g.label}: ${g.keyLabel}<\u002Fdiv>\n    <div style=\"margin-left:${depth * 16}px\">${g.children ? renderGroups(g.children, depth + 1, detailRenderer) : detailRenderer(g.rows)}<\u002Fdiv>\n    <div class=\"grp-footer\" style=\"margin-left:${depth * 16}px\">Subtotal — ${g.keyLabel}: ${money(g.subtotal)}<\u002Fdiv>\n  `).join('');\n}\n// ─── Schema-driven field resolution ─────────────────────────────────────\n// A report source names fields against its OWN class — either a raw\n// static _schema property or a computed method of the same name — and\n// this resolves either uniformly. No report hardcodes \"payroll records\n// have a totalEarnings column\"; it names the field, this reads it. Adding\n// a report against a new BaseClassX subclass needs a new source entry,\n// never a new bespoke row-builder function.\nfunction fieldLabel(Cls, field) {\n  const meta = Cls && Cls._schema && Cls._schema.properties && Cls._schema.properties[field];\n  if (meta && meta.label) return meta.label;\n  return field.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase());\n}\nfunction resolveField(instance, field) {\n  const v = instance[field];\n  return typeof v === 'function' ? v.call(instance) : v;\n}\nfunction collectRows(sourceDefs) {\n  const rows = [];\n  sourceDefs.forEach(def => {\n    const items = def.collection(org).filter(def.filter || (() => true));\n    items.forEach(inst => {\n      const staff = def.staffField ? org.staff.find(s => s.id === inst[def.staffField]) : null;\n      const row = {\n        date: inst[def.dateField], month: monthOf(inst[def.dateField]), season: seasonOf(inst[def.dateField]),\n        staffName: staff ? staff.name : (def.staffField ? inst[def.staffField] : ''),\n        sourceLabel: def.sourceLabel,\n        detail: def.labelFields ? def.labelFields.map(f => resolveField(inst, f)).join(' \\u2014 ') : def.labelFn(inst),\n        category: def.categoryField ? inst[def.categoryField] : '',\n        vendor: def.vendorField ? inst[def.vendorField] : '',\n        amount: resolveField(inst, def.amountField), amountLabel: fieldLabel(def.class, def.amountField)\n      };\n      if (def.extraFields) Object.keys(def.extraFields).forEach(key => { row[key] = resolveField(inst, def.extraFields[key]); });\n      rows.push(row);\n    });\n  });\n  return rows;\n}\n\n// ─── Report catalog ─── each entry is data: source class(es) + field names\n// + groupBy — no per-report rendering code.\nconst REPORT_DEFS = {\n  'report-staff-expense-month': {\n    title: '#1 \\u2014 Comprehensive Staff Expense by Month',\n    subtitle: 'Payroll cost-to-org + staff-attributable expenses \\u2014 fields resolved from PayrollRecord/Expense _schema, grouped by month then staff',\n    sources: [\n      { class: PayrollRecord, collection: o => o.payrollRecords, dateField: 'periodStart', staffField: 'staffId', amountField: 'totalCostToOrg', sourceLabel: 'Payroll', labelFn: r => 'Payroll ' + r.periodStart + ' \\u2013 ' + r.periodEnd },\n      { class: Expense, collection: o => o.expenses, dateField: 'date', staffField: 'approvedBy', amountField: 'amount', sourceLabel: 'Expense', filter: e => !!e.approvedBy, labelFields: ['category', 'vendor'] }\n    ],\n    groupBy: [\n      { label: 'Month', field: 'month', keyFn: r => r.month, keyLabel: monthLabel },\n      { label: 'Staff', field: 'staffName', keyFn: r => r.staffName }\n    ],\n    detailColumns: [{ label: 'Source', field: 'sourceLabel' }, { label: 'Detail', field: 'detail' }, { label: 'Amount', field: 'amount', money: true }]\n  },\n  'report-expense-season': {\n    title: '#2 \\u2014 Expenses by Season',\n    subtitle: 'Non-payroll expenses \\u2014 fields resolved from Expense _schema, grouped by season then category',\n    sources: [\n      { class: Expense, collection: o => o.expenses, dateField: 'date', amountField: 'amount', sourceLabel: 'Expense', categoryField: 'category', vendorField: 'vendor', labelFields: ['vendor'] }\n    ],\n    groupBy: [\n      { label: 'Season', field: 'season', keyFn: r => r.season, sortFn: (a, b) => SEASON_ORDER.indexOf(a) - SEASON_ORDER.indexOf(b) },\n      { label: 'Category', field: 'category', keyFn: r => r.category }\n    ],\n    detailColumns: [{ label: 'Date', field: 'date' }, { label: 'Vendor', field: 'vendor' }, { label: 'Amount', field: 'amount', money: true }]\n  },\n  'report-payroll': {\n    title: '#3 \\u2014 Payroll Report',\n    subtitle: 'Payroll register \\u2014 fields resolved from PayrollRecord._schema, grouped by staff then pay period',\n    sources: [\n      { class: PayrollRecord, collection: o => o.payrollRecords, dateField: 'periodStart', staffField: 'staffId', amountField: 'totalCostToOrg', sourceLabel: 'Payroll', labelFn: r => r.periodStart + ' \\u2013 ' + r.periodEnd,\n        extraFields: { totalHours: 'totalHours', totalEarnings: 'totalEarnings', netPay: 'netPay', employerLiability: 'totalEmployerLiability' } }\n    ],\n    groupBy: [\n      { label: 'Staff', field: 'staffName', keyFn: r => r.staffName },\n      { label: 'Pay Period', field: 'detail', keyFn: r => r.detail }\n    ],\n    detailColumns: [\n      { label: 'Total Hours', field: 'totalHours' },\n      { label: 'Total Earnings', field: 'totalEarnings', money: true },\n      { label: 'Net Pay', field: 'netPay', money: true },\n      { label: 'Employer Liability', field: 'employerLiability', money: true },\n      { label: 'Total Cost to Org', field: 'amount', money: true }\n    ]\n  }\n};\n// ─── Report Band Designer ───────────────────────────────────────────────\n// Same Toolbox drag/resize canvas already used for VB6 form design,\n// applied to report layout: bands are Crystal-Reports-style (Report\n// Header, one Group Header/Footer pair per groupBy level, Detail, Report\n// Footer). Elements ({type,label,field,left,top,width,height}) bind\n// against the SAME REPORT_DEFS a report already runs on — the designer\n// edits layout only, never duplicates the query/grouping logic above.\nconst REPORT_LAYOUTS = {};\nfunction bandNamesFor(def) {\n  const names = ['reportHeader'];\n  def.groupBy.forEach((g, i) => names.push('groupHeader_' + i));\n  names.push('detail');\n  for (let i = def.groupBy.length - 1; i >= 0; i--) names.push('groupFooter_' + i);\n  names.push('reportFooter');\n  return names;\n}\nfunction bandDisplayLabel(def, bandName) {\n  if (bandName === 'reportHeader') return 'Report Header';\n  if (bandName === 'reportFooter') return 'Report Footer (Running Totals)';\n  if (bandName === 'detail') return 'Detail (repeats per row)';\n  const m = bandName.match(/^group(Header|Footer)_(\\d+)$/);\n  if (m) return def.groupBy[+m[2]].label + ' Group ' + m[1];\n  return bandName;\n}\nfunction ensureLayout(reportKey) {\n  if (REPORT_LAYOUTS[reportKey]) return REPORT_LAYOUTS[reportKey];\n  const def = REPORT_DEFS[reportKey];\n  const elements = {};\n  let elId = 1;\n  const mk = (type, extra, left, top, w, h) => ({ id: 'el' + (elId++), type, left, top, width: w, height: h, ...extra });\n  elements.reportHeader = [mk('label', { text: def.title }, 8, 8, 460, 24)];\n  def.groupBy.forEach((g, i) => {\n    elements['groupHeader_' + i] = [\n      mk('label', { text: g.label + ':' }, 8 + i * 16, 6, 90, 22),\n      mk('groupValue', { level: i }, 100 + i * 16, 6, 240, 22)\n    ];\n    elements['groupFooter_' + i] = [\n      mk('label', { text: 'Subtotal:' }, 8 + i * 16, 6, 90, 22),\n      mk('runningTotal', { scope: 'group', level: i }, 100 + i * 16, 6, 160, 22)\n    ];\n  });\n  elements.detail = def.detailColumns.map((c, i) => mk('field', { text: c.label, field: c.field, money: !!c.money }, 8 + i * 160, 6, 150, 24));\n  elements.reportFooter = [mk('label', { text: 'Grand Total:' }, 8, 8, 110, 24), mk('runningTotal', { scope: 'report' }, 124, 8, 160, 24)];\n  const bandHeights = {}; bandNamesFor(def).forEach(b => bandHeights[b] = 40);\n  bandHeights.reportHeader = 44; bandHeights.reportFooter = 44;\n  REPORT_LAYOUTS[reportKey] = { elements, bandHeights };\n  return REPORT_LAYOUTS[reportKey];\n}\nlet designerReportKey = null;\nlet designerSelected = null;\nlet designerPreview = false;\nfunction selectDesignerReport(key) { designerReportKey = key; designerSelected = null; renderCurrent(); }\nfunction toggleDesignerPreview() { designerPreview = !designerPreview; renderCurrent(); }\nfunction addDesignerElement(reportKey, band, kind) {\n  const def = REPORT_DEFS[reportKey], layout = ensureLayout(reportKey);\n  const list = layout.elements[band];\n  const left = 8 + (list.length % 4) * 130, top = 6;\n  const lvl = (band.match(/_(\\d+)$/) || [0, 0])[1] * 1;\n  let el;\n  if (kind === 'runningTotal') el = { id: 'el' + Date.now(), type: 'runningTotal', scope: band === 'reportFooter' ? 'report' : 'group', level: lvl, left, top, width: 150, height: 24 };\n  else if (kind === 'label') el = { id: 'el' + Date.now(), type: 'label', text: 'Label', left, top, width: 100, height: 24 };\n  else if (kind === 'groupValue') el = { id: 'el' + Date.now(), type: 'groupValue', level: lvl, left, top, width: 200, height: 24 };\n  else { const col = def.detailColumns.find(c => c.field === kind); el = { id: 'el' + Date.now(), type: 'field', text: col ? col.label : kind, field: kind, money: col ? !!col.money : false, left, top, width: 150, height: 24 }; }\n  list.push(el);\n  designerSelected = { band, id: el.id };\n  renderCurrent();\n}\nfunction deleteDesignerEl() {\n  if (!designerSelected) return;\n  const layout = ensureLayout(designerReportKey);\n  layout.elements[designerSelected.band] = layout.elements[designerSelected.band].filter(e => e.id !== designerSelected.id);\n  designerSelected = null;\n  renderCurrent();\n}\nfunction updateSelectedElField(value) {\n  if (!designerSelected) return;\n  const layout = ensureLayout(designerReportKey);\n  const el = layout.elements[designerSelected.band].find(e => e.id === designerSelected.id);\n  if (!el) return;\n  if (el.type === 'field') { const def = REPORT_DEFS[designerReportKey]; const col = def.detailColumns.find(c => c.field === value); el.field = value; el.text = col ? col.label : value; el.money = col ? !!col.money : false; }\n  if (el.type === 'label') el.text = value;\n  renderCurrent();\n}\nlet designerDrag = null;\nfunction designerElMouseDown(e, reportKey, band, id, isResize) {\n  e.stopPropagation();\n  designerSelected = { band, id };\n  const layout = ensureLayout(reportKey);\n  const el = layout.elements[band].find(x => x.id === id);\n  designerDrag = { reportKey, band, id, isResize, startX: e.clientX, startY: e.clientY, orig: { ...el } };\n  document.addEventListener('mousemove', onDesignerDragMove);\n  document.addEventListener('mouseup', onDesignerDragEnd);\n  document.querySelectorAll('.rband-el.selected').forEach(n => n.classList.remove('selected'));\n  const domEl = document.getElementById('rband-' + id);\n  if (domEl) domEl.classList.add('selected');\n}\nfunction onDesignerDragMove(e) {\n  if (!designerDrag) return;\n  const dx = e.clientX - designerDrag.startX, dy = e.clientY - designerDrag.startY;\n  const layout = ensureLayout(designerDrag.reportKey);\n  const el = layout.elements[designerDrag.band].find(x => x.id === designerDrag.id);\n  if (!el) return;\n  const domEl = document.getElementById('rband-' + el.id);\n  if (designerDrag.isResize) {\n    el.width = Math.max(30, designerDrag.orig.width + dx);\n    el.height = Math.max(18, designerDrag.orig.height + dy);\n    if (domEl) { domEl.style.width = el.width + 'px'; domEl.style.height = el.height + 'px'; }\n  } else {\n    el.left = Math.max(0, designerDrag.orig.left + dx);\n    el.top = Math.max(0, designerDrag.orig.top + dy);\n    if (domEl) { domEl.style.left = el.left + 'px'; domEl.style.top = el.top + 'px'; }\n  }\n}\nfunction onDesignerDragEnd() {\n  document.removeEventListener('mousemove', onDesignerDragMove);\n  document.removeEventListener('mouseup', onDesignerDragEnd);\n  designerDrag = null;\n  renderCurrent();\n}\nfunction renderDesignerElement(reportKey, band, el) {\n  const cls = 'rband-el type-' + el.type + (designerSelected && designerSelected.band === band && designerSelected.id === el.id ? ' selected' : '');\n  const content = el.type === 'label' ? el.text : el.type === 'field' ? '{' + (el.text || el.field) + '}' : el.type === 'groupValue' ? '{Group Value}' : '{\\u03a3 Running Total}';\n  return `<div id=\"rband-${el.id}\" class=\"${cls}\" style=\"left:${el.left}px;top:${el.top}px;width:${el.width}px;height:${el.height}px\"\n    onmousedown=\"designerElMouseDown(event,'${reportKey}','${band}','${el.id}',false)\">${content}<div class=\"rband-resize-handle\" onmousedown=\"designerElMouseDown(event,'${reportKey}','${band}','${el.id}',true)\"><\u002Fdiv><\u002Fdiv>`;\n}\nfunction renderDesignBand(reportKey, band) {\n  const def = REPORT_DEFS[reportKey], layout = ensureLayout(reportKey);\n  const els = layout.elements[band];\n  const fieldOptions = band === 'detail' ? def.detailColumns.map(c => `<option value=\"${c.field}\">${c.label}<\u002Foption>`).join('') : '';\n  return `<div class=\"rband\">\n    <div class=\"rband-label\"><span>${bandDisplayLabel(def, band)}<\u002Fspan>\n      <span>\n        ${band === 'detail' ? `<select onchange=\"addDesignerElement('${reportKey}','${band}', this.value); this.value=''\"><option value=\"\">+ Field\\u2026<\u002Foption>${fieldOptions}<\u002Fselect>` : `<button onclick=\"addDesignerElement('${reportKey}','${band}','label')\" style=\"font-size:10px;padding:2px 6px\">+ Label<\u002Fbutton>`}\n        ${band.startsWith('group') || band === 'reportFooter' ? `<button onclick=\"addDesignerElement('${reportKey}','${band}','runningTotal')\" style=\"font-size:10px;padding:2px 6px;margin-left:4px\">+ \\u03a3 Running Total<\u002Fbutton>` : ''}\n        ${band.startsWith('groupHeader') ? `<button onclick=\"addDesignerElement('${reportKey}','${band}','groupValue')\" style=\"font-size:10px;padding:2px 6px;margin-left:4px\">+ Group Value<\u002Fbutton>` : ''}\n      <\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"rband-canvas\" style=\"height:${layout.bandHeights[band]}px\" onmousedown=\"if(event.target===this){designerSelected=null; renderCurrent();}\">\n      ${els.map(el => renderDesignerElement(reportKey, band, el)).join('')}\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction renderDesignerPropsPanel(reportKey) {\n  if (!designerSelected) return `<div class=\"rband-props\">Click an element to select it, drag to move, drag the blue handle to resize.<\u002Fdiv>`;\n  const def = REPORT_DEFS[reportKey], layout = ensureLayout(reportKey);\n  const el = layout.elements[designerSelected.band].find(e => e.id === designerSelected.id);\n  if (!el) return '';\n  let editor = '';\n  if (el.type === 'label') editor = `<label style=\"font-size:11px;color:#666\">Text: <input type=\"text\" value=\"${el.text.replace(/\"/g, '&quot;')}\" oninput=\"updateSelectedElField(this.value)\" style=\"padding:4px 6px;border:1px solid #bcc7d0;border-radius:3px;font:12px system-ui\"><\u002Flabel>`;\n  if (el.type === 'field') editor = `<label style=\"font-size:11px;color:#666\">Bound field: <select onchange=\"updateSelectedElField(this.value)\">${def.detailColumns.map(c => `<option value=\"${c.field}\" ${c.field === el.field ? 'selected' : ''}>${c.label}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>`;\n  if (el.type === 'groupValue') editor = `<span style=\"font-size:11px;color:#666\">Shows the group key for level ${el.level} (${def.groupBy[el.level] ? def.groupBy[el.level].label : ''})<\u002Fspan>`;\n  if (el.type === 'runningTotal') editor = `<span style=\"font-size:11px;color:#666\">Sums <b>${(def.detailColumns.find(c => c.money) || {}).label || 'Amount'}<\u002Fb> \\u2014 scope: <b>${el.scope === 'report' ? 'entire report' : 'current group'}<\u002Fb><\u002Fspan>`;\n  return `<div class=\"rband-props\">${editor}<button onclick=\"deleteDesignerEl()\" style=\"margin-left:auto;background:#fff;color:#c0392b;border:1px solid #e0b0aa;border-radius:3px;padding:5px 10px;font:11px system-ui;cursor:pointer\">Delete Element<\u002Fbutton><\u002Fdiv>`;\n}\nfunction renderBandPreviewRow(reportKey, band, ctx) {\n  const layout = ensureLayout(reportKey);\n  const els = layout.elements[band];\n  return `<div class=\"rband-canvas\" style=\"height:${layout.bandHeights[band]}px\">` +\n    els.map(el => {\n      let content;\n      if (el.type === 'label') content = el.text;\n      else if (el.type === 'field') { const v = ctx.row ? ctx.row[el.field] : ''; content = el.money ? money(v) : (v || '\\u2014'); }\n      else if (el.type === 'groupValue') content = ctx.groupKeyLabel || '';\n      else content = money(el.scope === 'report' ? ctx.grandTotal : ctx.subtotal);\n      return `<div class=\"rband-el type-${el.type}\" style=\"left:${el.left}px;top:${el.top}px;width:${el.width}px;height:${el.height}px;position:absolute;cursor:default\">${content}<\u002Fdiv>`;\n    }).join('') + `<\u002Fdiv>`;\n}\nfunction renderDesignerPreview(reportKey) {\n  const def = REPORT_DEFS[reportKey];\n  const rows = collectRows(def.sources);\n  const grandTotal = rows.reduce((s, r) => s + (r.amount || 0), 0);\n  const groups = buildGroups(rows, def.groupBy, r => r.amount || 0);\n  function renderLevel(gs, level) {\n    return gs.map(g => {\n      const header = renderBandPreviewRow(reportKey, 'groupHeader_' + level, { groupKeyLabel: g.keyLabel });\n      const body = g.children ? renderLevel(g.children, level + 1) : g.rows.map(r => renderBandPreviewRow(reportKey, 'detail', { row: r })).join('');\n      const footer = renderBandPreviewRow(reportKey, 'groupFooter_' + level, { subtotal: g.subtotal });\n      return `<div class=\"rband\"><div class=\"rband-label\">${bandDisplayLabel(def, 'groupHeader_' + level)}<\u002Fdiv>${header}<\u002Fdiv>` +\n        `<div style=\"margin-left:${(level + 1) * 14}px\">${body}<\u002Fdiv>` +\n        `<div class=\"rband\"><div class=\"rband-label\">${bandDisplayLabel(def, 'groupFooter_' + level)}<\u002Fdiv>${footer}<\u002Fdiv>`;\n    }).join('');\n  }\n  return `<div class=\"rband\"><div class=\"rband-label\">${bandDisplayLabel(def, 'reportHeader')}<\u002Fdiv>${renderBandPreviewRow(reportKey, 'reportHeader', {})}<\u002Fdiv>` +\n    renderLevel(groups, 0) +\n    `<div class=\"rband\"><div class=\"rband-label\">${bandDisplayLabel(def, 'reportFooter')}<\u002Fdiv>${renderBandPreviewRow(reportKey, 'reportFooter', { grandTotal })}<\u002Fdiv>`;\n}\nfunction renderReportDesigner() {\n  if (!designerReportKey) designerReportKey = Object.keys(REPORT_DEFS)[0];\n  const def = REPORT_DEFS[designerReportKey];\n  ensureLayout(designerReportKey);\n  const bands = bandNamesFor(def);\n  return `<div class=\"designer-sticky-head\"><h2>Report Band Designer<\u002Fh2><div class=\"subtitle\">Same Toolbox drag/resize canvas as Form Designer mode, applied to report bands (Crystal-Reports-style headers/detail/group footers/running totals) \\u2014 layout is data bound against the report's existing REPORT_DEFS query.<\u002Fdiv>` +\n    `<div class=\"rband-toolbar\">\n      <label style=\"font-size:12px;color:#555\">Report: <select onchange=\"selectDesignerReport(this.value)\">${Object.keys(REPORT_DEFS).map(k => `<option value=\"${k}\" ${k === designerReportKey ? 'selected' : ''}>${REPORT_DEFS[k].title}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>\n      <button onclick=\"toggleDesignerPreview()\">${designerPreview ? 'Back to Design' : 'Preview with Live Data'}<\u002Fbutton>\n    <\u002Fdiv>` +\n    (designerPreview ? '' : renderDesignerPropsPanel(designerReportKey)) + `<\u002Fdiv>` +\n    (designerPreview ? renderDesignerPreview(designerReportKey) : bands.map(b => renderDesignBand(designerReportKey, b)).join(''));\n}\nfunction renderSourceReport(reportKey, suppressInlineTotal) {\n  const def = REPORT_DEFS[reportKey];\n  const state = quickFilterState(reportKey);\n  let rows = collectRows(def.sources);\n  const filterableFields = quickFilterFields(rows, def);\n  filterableFields.forEach(f => {\n    const v = (state.filters[f.field] || '').trim();\n    if (!v) return;\n    rows = f.kind === 'select' ? rows.filter(r => String(r[f.field] ?? '') === v) : rows.filter(r => String(r[f.field] ?? '').toLowerCase().includes(v.toLowerCase()));\n  });\n  const activeGroupBy = [def.groupBy[state.groupByIndex] || def.groupBy[0]];\n  const grandTotal = rows.reduce((s, r) => s + (r.amount || 0), 0);\n  const groups = buildGroups(rows, activeGroupBy, r => r.amount || 0);\n  renderSourceReport.lastGrandTotal = grandTotal;\n  renderSourceReport.lastGroupLabel = activeGroupBy[0].label;\n  return `<h2>${def.title}<\u002Fh2><div class=\"subtitle\">${def.subtitle}<\u002Fdiv>` +\n    renderQuickFilterBar(reportKey, def, filterableFields) +\n    (rows.length ? renderGroups(groups, 0, detailRows => table(def.detailColumns.map(c => c.label), detailRows.map(r => def.detailColumns.map(c => c.money ? money(r[c.field]) : r[c.field])))) : `<div class=\"subtitle\">No rows match the current filter.<\u002Fdiv>`) +\n    (suppressInlineTotal ? '' : `<div class=\"grand-total\"><span>Grand Total \\u2014 All ${activeGroupBy[0].label}s<\u002Fspan><span>${money(grandTotal)}<\u002Fspan><\u002Fdiv>`);\n}\n// ─── Quick Filter + single Group By (the default filtering UX — satisfies most\n// users without needing the full query-builder/saved-Views layer planned next).\n// State is per report key so switching reports/tabs doesn't cross-contaminate.\nconst QUICK_FILTER_STATE = {};\nfunction quickFilterState(reportKey) {\n  if (!QUICK_FILTER_STATE[reportKey]) QUICK_FILTER_STATE[reportKey] = { filters: {}, groupByIndex: 0 };\n  return QUICK_FILTER_STATE[reportKey];\n}\nfunction quickFilterFields(rows, def) {\n  // Filterable = the report's own groupBy dimensions, rendered as dropdowns of\n  // distinct values (a free-text box is the wrong control for a closed set like\n  // Staff or Pay Period) — plus any text-ish detail columns as free-text.\n  const groupFields = def.groupBy.filter(g => g.field).map(g => ({\n    field: g.field, label: g.label, kind: 'select',\n    options: [...new Set(rows.map(r => r[g.field]).filter(v => v !== undefined && v !== ''))].sort()\n  }));\n  const textCols = def.detailColumns.filter(c => !c.money).map(c => ({ field: c.field, label: c.label, kind: 'text' }));\n  return [...groupFields, ...textCols];\n}\nfunction setQuickFilter(reportKey, field, value) {\n  quickFilterState(reportKey).filters[field] = value;\n  renderCurrent(true);\n}\nfunction setQuickGroupBy(reportKey, idx) {\n  quickFilterState(reportKey).groupByIndex = +idx;\n  renderCurrent();\n}\nfunction clearQuickFilters(reportKey) {\n  QUICK_FILTER_STATE[reportKey] = { filters: {}, groupByIndex: quickFilterState(reportKey).groupByIndex };\n  renderCurrent();\n}\nfunction renderQuickFilterBar(reportKey, def, filterableFields) {\n  const state = quickFilterState(reportKey);\n  const hasActiveFilter = Object.values(state.filters).some(v => v && v.trim());\n  return `<div class=\"crud-toolbar\" style=\"flex-wrap:wrap;font:12px system-ui\">\n    ${filterableFields.map(f => f.kind === 'select'\n      ? `<select id=\"qf-${reportKey}-${f.field}\" onchange=\"setQuickFilter('${reportKey}','${f.field}', this.value)\" style=\"flex:1;min-width:120px;padding:6px 8px;border:1px solid #bcc7d0;border-radius:3px;font:12px system-ui\">\n          <option value=\"\">All ${f.label}s<\u002Foption>\n          ${f.options.map(opt => `<option value=\"${String(opt).replace(/\"/g,'&quot;')}\" ${state.filters[f.field] === opt ? 'selected' : ''}>${opt}<\u002Foption>`).join('')}\n        <\u002Fselect>`\n      : `<input type=\"text\" id=\"qf-${reportKey}-${f.field}\" placeholder=\"Filter ${f.label}\\u2026\" value=\"${(state.filters[f.field] || '').replace(/\"/g,'&quot;')}\" oninput=\"setQuickFilter('${reportKey}','${f.field}', this.value)\" style=\"flex:1;min-width:120px;padding:6px 8px;border:1px solid #bcc7d0;border-radius:3px;font:12px system-ui\">`\n    ).join('')}\n    <label style=\"font:12px system-ui;color:#2b3140;display:flex;align-items:center;gap:4px;margin-left:10px\">Group by:\n      <select onchange=\"setQuickGroupBy('${reportKey}', this.value)\" style=\"font:12px system-ui;color:#2b3140;padding:5px 7px;border:1px solid #bcc7d0;border-radius:3px\">${def.groupBy.map((g,i) => `<option value=\"${i}\" ${i===state.groupByIndex?'selected':''}>${g.label}<\u002Foption>`).join('')}<\u002Fselect>\n    <\u002Flabel>\n    ${hasActiveFilter ? `<button onclick=\"clearQuickFilters('${reportKey}')\" style=\"padding:5px 10px;border:1px solid #bcc7d0;border-radius:3px;background:#fff;font:12px system-ui;cursor:pointer\">Clear Filters<\u002Fbutton>` : ''}\n  <\u002Fdiv>`;\n}\nfunction table(headers, rows) {\n  // Numbers and currency are always right-justified — detect per cell so\n  // every existing call site (money()-formatted strings, raw numbers, plain\n  // counts) gets this without having to pass column metadata everywhere.\n  function isNumericCell(c) {\n    if (typeof c === 'number') return true;\n    if (typeof c !== 'string') return false;\n    return /^\\(?-?\\$?[\\d,]+(\\.\\d+)?%?\\)?$/.test(c.trim());\n  }\n  return `<table><thead><tr>${headers.map(h=>`<th>${h}<\u002Fth>`).join('')}<\u002Ftr><\u002Fthead><tbody>${\n    rows.map(r => `<tr>${r.map(c=>`<td${isNumericCell(c) ? ' style=\"text-align:right\"' : ''}>${c}<\u002Ftd>`).join('')}<\u002Ftr>`).join('')\n  }<\u002Ftbody><\u002Ftable>`;\n}\n\nfunction renderCurrent(preserveSearchFocus) {\n  withLoading(() => renderCurrentSync(preserveSearchFocus));\n}\nfunction renderCurrentSync(preserveSearchFocus) {\n  const main = document.getElementById('main');\n  let caret = null, focusedId = null;\n  if (preserveSearchFocus) {\n    const active = document.activeElement;\n    if (active && active.tagName === 'INPUT' && active.id) { focusedId = active.id; caret = active.selectionStart; }\n  }\n  document.getElementById('report-footer').classList.remove('visible');\n  const role = document.getElementById('role-select').value;\n  const view = org.roleView(role);\n\n  if (current === 'staff') {\n    const staffList = role === 'admin' ? org.staff : org.staff.map(s => s.redacted ? s.redacted() : s);\n    main.innerHTML = `<h2>Staff Roster<\u002Fh2><div class=\"subtitle\">${role} viewpoint — sensitive fields ${role==='admin'?'visible':'redacted'}<\u002Fdiv>` +\n      table(['Name','Role','Type','Pay Rate','Email'], staffList.map(s => [s.name, s.roleTitle, s.employmentType, s.payRate, s.email]));\n    return;\n  }\n  if (current === 'scheduling') {\n    const proj = org.schedulingProjection();\n    main.innerHTML = `<h2>Scheduling<\u002Fh2><div class=\"subtitle\">All shifts, current window<\u002Fdiv>` +\n      `<div class=\"kpi-row\">\n        <div class=\"kpi\"><div class=\"label\">Day Shifts<\u002Fdiv><div class=\"value\">${proj.dayShiftCount}<\u002Fdiv><\u002Fdiv>\n        <div class=\"kpi\"><div class=\"label\">Night Shifts<\u002Fdiv><div class=\"value\">${proj.nightShiftCount}<\u002Fdiv><\u002Fdiv>\n        <div class=\"kpi\"><div class=\"label\">Coverage Gaps<\u002Fdiv><div class=\"value ${proj.coverageGaps.length?'gap-flag':''}\">${proj.coverageGaps.length}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>` +\n      table(['Date','Type','Staff','Post','Status'], proj.shifts.map(s => [s.date, s.shiftType, s.staffId ? (org.staff.find(x=>x.id===s.staffId)?.name || s.staffId) : '—', s.postAssignment || '—', s.status==='open' ? '<span class=\"gap-flag\">OPEN<\u002Fspan>' : s.status]));\n    return;\n  }\n  if (current === 'payroll') {\n    const proj = org.payrollProjection();\n    main.innerHTML = `<h2>Payroll<\u002Fh2><div class=\"subtitle\">All records, current window<\u002Fdiv>` +\n      `<div class=\"kpi-row\">\n        <div class=\"kpi\"><div class=\"label\">Total Earnings<\u002Fdiv><div class=\"value\">${money(proj.totalGross)}<\u002Fdiv><\u002Fdiv>\n        <div class=\"kpi\"><div class=\"label\">Total Net Pay<\u002Fdiv><div class=\"value\">${money(proj.totalNet)}<\u002Fdiv><\u002Fdiv>\n        <div class=\"kpi\"><div class=\"label\">Total Cost to Org<\u002Fdiv><div class=\"value\">${money(proj.totalOrgCost)}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>` +\n      table(['Staff','Period','Total Hrs','Earnings','Net Pay','Employer Liability'], proj.records.map(r => [\n        org.staff.find(x=>x.id===r.staffId)?.name || r.staffId, r.periodStart+' – '+r.periodEnd, r.totalHours,\n        money(r.totalEarnings), money(r.netPay), money(r.totalEmployerLiability())\n      ]));\n    return;\n  }\n  if (current === 'budget') {\n    const proj = org.budgetProjection(document.getElementById('fy-btn').textContent.split(' ')[1]);\n    main.innerHTML = `<h2>Budget<\u002Fh2><div class=\"subtitle\">FY ${document.getElementById('fy-btn').textContent.split(' ')[1]}<\u002Fdiv>` +\n      table(['Category','Allocated','Actual Spend','Remaining','Grant Income'], proj.map(b => [b.category, money(b.allocated), money(b.actualSpent), money(b.remaining), money(b.income)]));\n    return;\n  }\n  if (current === 'orgchart') {\n    const flat = orgChart.flatten();\n    main.innerHTML = `<h2>Org Chart<\u002Fh2><div class=\"subtitle\">HOPE Shelters — Summary View, flattened from one BaseClassX tree<\u002Fdiv>` +\n      flat.map(p => `<div class=\"tree-line\">${'&nbsp;&nbsp;'.repeat(0)}<b>${p.title}<\u002Fb>${p.personName ? ' — ' + p.personName : ''}${p.filled===false ? ' <span class=\"vacant-flag\">(VACANT)<\u002Fspan>' : ''}${p.estimatedStaffCount ? ' (est. staff: ' + p.estimatedStaffCount + ')' : ''}<\u002Fdiv>`).join('');\n    return;\n  }\n  if (current === 'report-designer') {\n    main.innerHTML = renderReportDesigner();\n    return;\n  }\n  if (CRUD_DEFS[current]) {\n    main.innerHTML = renderCrud(current);\n    if (focusedId !== null) {\n      const input = document.getElementById(focusedId);\n      if (input) { input.focus(); input.setSelectionRange(caret, caret); }\n    }\n    return;\n  }\n  if (current === 'report-staff-expense-month' || current === 'report-expense-season' || current === 'report-payroll') {\n    const isPayroll = current === 'report-payroll';\n    main.innerHTML = renderSourceReport(current, isPayroll);\n    const footer = document.getElementById('report-footer');\n    if (isPayroll) {\n      document.getElementById('report-footer-total').textContent = 'Grand Total \\u2014 All ' + renderSourceReport.lastGroupLabel + 's: ' + money(renderSourceReport.lastGrandTotal);\n      footer.classList.add('visible');\n    } else {\n      footer.classList.remove('visible');\n    }\n    if (focusedId !== null) {\n      const input = document.getElementById(focusedId);\n      if (input) { input.focus(); input.setSelectionRange(caret, caret); }\n    }\n    return;\n  }\n  if (current === 'report-payroll-budget') {\n    const payrollProj = org.payrollProjection();\n    const budgetProj = org.budgetProjection(fy);\n    main.innerHTML = `<h2>Payroll & Budget Report<\u002Fh2><div class=\"subtitle\">Generated from live projections — matches Payroll-and-Budget-Report.md<\u002Fdiv>\n      <h3 style=\"font-size:13px\">Payroll Summary<\u002Fh3>` +\n      table(['Staff','Total Earnings','Net Pay','Employer Liability','Total Cost'], payrollProj.records.map(r => [\n        org.staff.find(x=>x.id===r.staffId)?.name || r.staffId, money(r.totalEarnings), money(r.netPay), money(r.totalEmployerLiability()), money(r.totalCostToOrg())\n      ])) +\n      `<h3 style=\"font-size:13px;margin-top:16px\">Budget vs. Actual<\u002Fh3>` +\n      table(['Category','Allocated','Actual','Remaining','Grant Income'], budgetProj.map(b => [b.category, money(b.allocated), money(b.actualSpent), money(b.remaining), money(b.income)]));\n    return;\n  }\n  if (current === 'report-pl') {\n    main.innerHTML = renderPLReport();\n    return;\n  }\n  if (current === 'report-coverage') {\n    const proj = org.schedulingProjection();\n    main.innerHTML = `<h2>Staffing Coverage Report<\u002Fh2><div class=\"subtitle\">Matches Staffing-Coverage-Report.md<\u002Fdiv>` +\n      table(['Date','Shift','Staff','Post','Status'], proj.shifts.map(s => [s.date, s.shiftType, s.staffId ? (org.staff.find(x=>x.id===s.staffId)?.name || s.staffId) : '—', s.postAssignment || '—', s.status==='open' ? '<span class=\"gap-flag\">OPEN — coverage gap<\u002Fspan>' : s.status])) +\n      `<p style=\"margin-top:10px;color:#555\">${proj.coverageGaps.length} open shift(s) in this window.<\u002Fp>`;\n    return;\n  }\n}\n\n// ─── Generic CRUD engine (schema + FieldACL binding, master-detail layout) ──\n// Every field's visibility, editability, required-ness, and column set is\n// read from Cls._fieldACL[field] (16-byte descriptor) resolved against the\n// acting SESSION as owner/group/other for the record in question — one\n// engine serves all four entities, and the touch-friendly master-detail\n// shell (list left/top, form right/below, stacks on narrow viewports)\n// works the same for iPad/iPhone without a separate mobile build.\nconst CRUD_DEFS = {\n  'crud-staff': { class: Staff, collection: 'staff', title: 'Staff' },\n  'crud-shifts': { class: Shift, collection: 'shifts', title: 'Shifts' },\n  'crud-expenses': { class: Expense, collection: 'expenses', title: 'Expenses' },\n  'crud-grants': { class: Grant, collection: 'grants', title: 'Grants' }\n};\nlet crudEditingId = null; // null = nothing selected; '' = new-record form; id = editing that record\nlet crudSearchTerm = '';\nconst CRUD_PAGE_SIZE = 15;\nlet crudPage = 0;\nfunction schemaFields(Cls) { return Object.keys(Cls._schema.properties); }\nfunction fieldACLFor(Cls, field) { return Cls._fieldACL[field] || FieldACL.build({ owner: 'rw-', group: 'rw-', other: 'rw-' }); }\nfunction fieldInputHtml(Cls, field, value) {\n  const meta = Cls._schema.properties[field];\n  const id = 'crud_f_' + field;\n  if (meta.kind === 'set') {\n    const selected = new Set(SetType.toArray(meta.options, value || 0n));\n    if (meta.exclusive) {\n      const currentLabel = SetType.toArray(meta.options, value || 0n)[0] || '';\n      const activeOpts = SetType.activeOptions(meta.options);\n      return `<div style=\"display:flex;flex-direction:column;gap:4px\">${\n        meta.allowBlank !== false ? `<label style=\"font:12px system-ui;display:flex;align-items:center;gap:6px\"><input type=\"radio\" name=\"${id}\" id=\"${id}__blank\" ${currentLabel === '' ? 'checked' : ''}>Blank<\u002Flabel>` : ''\n      }${activeOpts.map((opt, i) => `<label style=\"font:12px system-ui;display:flex;align-items:center;gap:6px\"><input type=\"radio\" name=\"${id}\" id=\"${id}__opt_${meta.options.findIndex(o => (typeof o === 'string' ? o : o.label) === opt)}\" ${currentLabel === opt ? 'checked' : ''}>${opt}<\u002Flabel>`).join('')}<\u002Fdiv>`;\n    }\n    const activeOpts = SetType.activeOptions(meta.options);\n    return `<div style=\"display:flex;flex-direction:column;gap:4px\">${meta.options.map((opt, i) => {\n      const label = typeof opt === 'string' ? opt : opt.label;\n      if (!activeOpts.includes(label) && !selected.has(label)) return ''; // retired + never set on this record — hide from entry entirely\n      const retired = activeOpts.indexOf(label) === -1;\n      return `<label style=\"font:12px system-ui;display:flex;align-items:center;gap:6px\"><input type=\"checkbox\" id=\"${id}__opt_${i}\" ${selected.has(label) ? 'checked' : ''}>${label}${retired ? ' <span style=\"color:#999\">(retired)<\u002Fspan>' : ''}<\u002Flabel>`;\n    }).join('')}<\u002Fdiv>`;\n  }\n  if (meta.type === 'boolean') return `<input type=\"checkbox\" id=\"${id}\" ${value ? 'checked' : ''}>`;\n  if (meta.type === 'number') return `<input type=\"number\" step=\"any\" id=\"${id}\" value=\"${value != null ? value : 0}\">`;\n  return `<input type=\"text\" id=\"${id}\" value=\"${(value != null ? String(value) : '').replace(/\"/g, '&quot;')}\">`;\n}\nfunction formatCrudValue(Cls, field, v) {\n  const meta = Cls._schema.properties[field];\n  if (meta.kind === 'set') return SetType.label(meta.options, v);\n  if (meta.type === 'boolean') return v ? 'Yes' : 'No';\n  if (meta.type === 'number') return /rate|amount/i.test(field) ? money(v) : v;\n  return v || '\\u2014';\n}\nfunction selectCrudRecord(id) { crudEditingId = id; renderCurrent(); }\nfunction changeCrudPage(defKey, delta) { crudPage += delta; renderCurrent(); }\nfunction saveCrudForm(defKey) {\n  const def = CRUD_DEFS[defKey];\n  const items = org.getCollection(def.collection);\n  const editing = crudEditingId ? items.find(x => x.id === crudEditingId) : null;\n  const patch = {};\n  schemaFields(def.class).forEach(field => {\n    const meta = def.class._schema.properties[field];\n    if (meta.kind === 'set') {\n      if (meta.exclusive) {\n        if (!document.getElementById('crud_f_' + field + '__blank') && !document.getElementById('crud_f_' + field + '__opt_0')) return;\n        let chosen = 0n;\n        meta.options.forEach((opt, i) => {\n          const radio = document.getElementById('crud_f_' + field + '__opt_' + i);\n          if (radio && radio.checked) chosen = SetType.fromArray(meta.options, [typeof opt === 'string' ? opt : opt.label]);\n        });\n        patch[field] = chosen; // stays 0n (Blank) if the blank radio (or nothing rendered) was selected\n        return;\n      }\n      const selected = meta.options.filter((opt, i) => {\n        const cb = document.getElementById('crud_f_' + field + '__opt_' + i);\n        return cb && cb.checked;\n      }).map(opt => typeof opt === 'string' ? opt : opt.label);\n      if (document.getElementById('crud_f_' + field + '__opt_0') || document.querySelector(`[id^=\"crud_f_${field}__opt_\"]`)) patch[field] = SetType.fromArray(meta.options, selected);\n      return;\n    }\n    const el = document.getElementById('crud_f_' + field);\n    if (!el) return; // no writable input was rendered for this field — leave untouched\n    patch[field] = meta.type === 'boolean' ? el.checked : meta.type === 'number' ? (parseFloat(el.value) || 0) : el.value;\n  });\n  const requiredFields = schemaFields(def.class).filter(f => fieldACLFor(def.class, f).hasFlag('REQUIRED'));\n  for (const f of requiredFields) {\n    const v = f in patch ? patch[f] : (editing ? editing[f] : undefined);\n    if (v === '' || v === undefined || v === null) { alert(fieldLabel(def.class, f) + ' is required.'); return; }\n  }\n  if (editing) {\n    org.updateInCollection(def.collection, editing.id, patch);\n  } else {\n    patch.createdBy = SESSION.staffId;\n    const created = org.addToCollection(def.collection, new def.class(patch));\n    crudEditingId = created.id;\n  }\n  renderCurrent();\n}\nfunction deleteCrudItem(defKey, id) {\n  if (!confirm('Delete this record?')) return;\n  org.removeFromCollection(CRUD_DEFS[defKey].collection, id);\n  crudEditingId = null;\n  renderCurrent();\n}\nfunction renderCrudModalBody(defKey) {\n  const def = CRUD_DEFS[defKey];\n  const items = org.getCollection(def.collection);\n  const editing = crudEditingId ? items.find(x => x.id === crudEditingId) : null;\n  // Admin viewpoint gets full write access regardless of FieldACL owner/group\n  // match — the role-viewpoint is a deliberate override on top of per-record\n  // ownership, not a replacement for it (payroll-finance/case-worker still\n  // resolve by real ownership).\n  const role = document.getElementById('role-select').value;\n  const subject = role === 'admin' ? 'owner' : FieldACL.resolveSubject(editing, SESSION);\n  return schemaFields(def.class).filter(f => f !== 'createdBy').map(f => {\n    const acl = fieldACLFor(def.class, f);\n    if (!acl.can(subject, 'r')) return '';\n    const canWrite = acl.can(subject, 'w') && (!editing || !acl.hasFlag('IMMUTABLE_AFTER_CREATE'));\n    const value = editing ? editing[f] : def.class._schema.properties[f].default;\n    const required = acl.hasFlag('REQUIRED');\n    return `<div class=\"crud-field-row\"><label>${fieldLabel(def.class, f)}${required ? ' <span class=\"required-mark\">*<\u002Fspan>' : ''}<\u002Flabel>${\n      canWrite ? fieldInputHtml(def.class, f, value) : `<div class=\"crud-field-readonly\">${formatCrudValue(def.class, f, value)}<\u002Fdiv>`\n    }<\u002Fdiv>`;\n  }).join('');\n}\nfunction renderCrudModal(defKey) {\n  const def = CRUD_DEFS[defKey];\n  const items = org.getCollection(def.collection);\n  const editing = crudEditingId ? items.find(x => x.id === crudEditingId) : null;\n  return `<div class=\"crud-modal-overlay\" onclick=\"if(event.target===this) closeCrudModal()\">\n    <div class=\"crud-modal\">\n      <button class=\"crud-modal-close\" title=\"Close\" onclick=\"closeCrudModal()\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\"><line x1=\"3\" y1=\"3\" x2=\"13\" y2=\"13\" stroke=\"#fff\" stroke-width=\"2\"/><line x1=\"13\" y1=\"3\" x2=\"3\" y2=\"13\" stroke=\"#fff\" stroke-width=\"2\"/><\u002Fsvg>\n      <\u002Fbutton>\n      <div class=\"crud-modal-body\">\n        <h3 style=\"margin:0 0 10px 0\">${editing ? 'Edit ' + def.title.replace(/s$/, '') : 'Add ' + def.title.replace(/s$/, '')}<\u002Fh3>\n        ${renderCrudModalBody(defKey)}\n        ${editing ? `<div style=\"margin-top:10px\"><button class=\"danger\" onclick=\"deleteCrudItem('${defKey}','${editing.id}')\" style=\"background:#fff;border:1px solid #e0b0aa;color:#c0392b;border-radius:3px;padding:5px 10px;font:11px system-ui;cursor:pointer\">Delete Record<\u002Fbutton><\u002Fdiv>` : ''}\n      <\u002Fdiv>\n      <div class=\"crud-modal-footer\">\n        <button class=\"btn-cancel\" onclick=\"closeCrudModal()\">Cancel<\u002Fbutton>\n        <button class=\"btn-save\" onclick=\"saveCrudForm('${defKey}')\">Save<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction closeCrudModal() { crudEditingId = null; renderCurrent(); }\nfunction renderCrud(defKey) {\n  const def = CRUD_DEFS[defKey];\n  const fields = schemaFields(def.class);\n  const compactFields = fields.filter(f => fieldACLFor(def.class, f).hasFlag('VISIBLE_COMPACT'));\n  const searchableFields = fields.filter(f => fieldACLFor(def.class, f).hasFlag('SEARCHABLE'));\n  const sortField = fields.find(f => fieldACLFor(def.class, f).hasFlag('SORTABLE'));\n  let items = org.getCollection(def.collection);\n  if (crudSearchTerm) {\n    const term = crudSearchTerm.toLowerCase();\n    items = items.filter(it => searchableFields.some(f => String(it[f] || '').toLowerCase().includes(term)));\n  }\n  if (sortField) items = [...items].sort((a, b) => (a[sortField] > b[sortField] ? 1 : a[sortField] < b[sortField] ? -1 : 0));\n  const totalCount = items.length;\n  const pageCount = Math.max(1, Math.ceil(totalCount / CRUD_PAGE_SIZE));\n  if (crudPage >= pageCount) crudPage = pageCount - 1;\n  if (crudPage < 0) crudPage = 0;\n  const pageItems = items.slice(crudPage * CRUD_PAGE_SIZE, crudPage * CRUD_PAGE_SIZE + CRUD_PAGE_SIZE);\n  const listHtml = pageItems.map(it => `\n    <div class=\"crud-list-item ${crudEditingId === it.id ? 'selected' : ''}\" onclick=\"selectCrudRecord('${it.id}')\">\n      ${compactFields.map(f => `<div>${fieldLabel(def.class, f)}: <b>${formatCrudValue(def.class, f, it[f])}<\u002Fb><\u002Fdiv>`).join('')}\n    <\u002Fdiv>`).join('') || `<div class=\"subtitle\">No records yet.<\u002Fdiv>`;\n  const pagerHtml = totalCount > CRUD_PAGE_SIZE ? `<div style=\"display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#555\">\n    <button onclick=\"changeCrudPage('${defKey}',-1)\" ${crudPage===0?'disabled':''} style=\"padding:4px 10px;border:1px solid #bcc7d0;border-radius:3px;background:#fff;cursor:pointer\">\\u2039 Prev<\u002Fbutton>\n    <span>Page ${crudPage+1} of ${pageCount} (${totalCount} records)<\u002Fspan>\n    <button onclick=\"changeCrudPage('${defKey}',1)\" ${crudPage>=pageCount-1?'disabled':''} style=\"padding:4px 10px;border:1px solid #bcc7d0;border-radius:3px;background:#fff;cursor:pointer\">Next \\u203a<\u002Fbutton>\n  <\u002Fdiv>` : '';\n  return `<h2>${def.title} \\u2014 Data Entry<\u002Fh2><div class=\"subtitle\">Master list \\u2014 field visibility/edit rights read from each field's FieldACL (16-byte POSIX-style descriptor); acting as <b>${SESSION.name || '\\u2014'}<\u002Fb><\u002Fdiv>` +\n    `<div class=\"crud-toolbar\"><input type=\"text\" id=\"crud-search-input\" placeholder=\"Search ${def.title.toLowerCase()}\\u2026\" value=\"${crudSearchTerm}\" oninput=\"crudSearchTerm=this.value; crudPage=0; renderCurrent(true);\" style=\"flex:1;padding:6px 8px;border:1px solid #bcc7d0;border-radius:3px;font:12px system-ui\">` +\n    `<button onclick=\"selectCrudRecord('')\" style=\"background:#3b6fd1;color:#fff;border:1px solid #3b6fd1;border-radius:3px;padding:6px 12px;font:12px system-ui;cursor:pointer;margin-left:8px\">+ Add ${def.title.replace(/s$/, '')}<\u002Fbutton><\u002Fdiv>` +\n    `<div class=\"crud-shell\"><div class=\"crud-list\" style=\"max-width:none;flex:1 1 auto\">${listHtml}${pagerHtml}<\u002Fdiv><\u002Fdiv>` +\n    (crudEditingId !== null ? renderCrudModal(defKey) : '');\n}\n\nconst toolbarIcon = new LoadingIcon();\ntoolbarIcon.mount(document.getElementById('toolbar-loading-icon'));\n// Wraps any render/data operation with the toolbar icon's start/stop \\u2014 today\n// every renderCurrent() body is synchronous in-memory data, but reports will\n// soon fetch real data (async): call withLoading(async () => { ...await fetch...\n// }) around that future work and the toolbar icon will show/hide itself with\n// no other plumbing needed.\nasync function withLoading(fn) {\n  toolbarIcon.start();\n  try { return await fn(); }\n  finally { toolbarIcon.stop(); }\n}\nrenderNav();\ninitSessionSelector();\nrenderCurrent();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
