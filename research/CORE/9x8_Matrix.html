<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Congruence Matrix: Proof of 72 ≡ 0</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --panel-bg: #161d2a;
            --accent-blue: #3b82f6;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --seed-color: #ffffff;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .header {
            margin-bottom: 24px;
        }
        .title {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .subtitle {
            margin: 6px 0 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        .canvas-container {
            position: relative;
            background: #090d16;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.02);
        }
        canvas {
            display: block;
        }
        .controls-panel {
            margin-top: 24px;
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .slider-row label {
            font-size: 14px;
            font-weight: 600;
            width: 120px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: var(--accent-blue);
            cursor: pointer;
        }
        .metrics {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 12px;
        }
        .metric-value {
            color: #38bdf8;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1 class="title">Modular Congruence Matrix: Proof of 72 ≡ 0</h1>
        <p class="subtitle">A 9x8 Toroidal projection wrapping infinity back into the core seed point</p>
    </div>

    <div class="canvas-container">
        <canvas id="matrixCanvas" width="700" height="500"></canvas>
    </div>

    <div class="controls-panel">
        <div class="slider-row">
            <label for="stepSlider">Path Progress (t):</label>
            <input type="range" id="stepSlider" min="0" max="72" value="72">
            <span id="stepDisplay" style="font-family: monospace; width: 30px; text-align: right;">72</span>
        </div>
        <div class="metrics">
            <div>Current Node Index: <span id="nodeIdx" class="metric-value">72</span></div>
            <div>Tensor Coordination: <span id="tensorCoord" class="metric-value">(0, 0)</span></div>
            <div>Congruence: <span id="congruenceVal" class="metric-value">72 ≡ 0 (mod 72)</span></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('stepSlider');
    const stepDisplay = document.getElementById('stepDisplay');
    const nodeIdxDisplay = document.getElementById('nodeIdx');
    const tensorCoordDisplay = document.getElementById('tensorCoord');
    const congruenceDisplay = document.getElementById('congruenceVal');

    const COLS = 9;
    const ROWS = 8;
    const paddingLeft = 70;
    const paddingRight = 40;
    const paddingTop = 50;
    const paddingBottom = 60;

    function getColorForStep(t) {
        if (t === 0 || t === 72) return '#ffffff';
        const hue = (t / 72) * 280;
        return `hsl(${hue}, 85%, 55%)`;
    }

    function drawMatrix(activeT) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const graphWidth = canvas.width - paddingLeft - paddingRight;
        const graphHeight = canvas.height - paddingTop - paddingBottom;
        
        const stepX = graphWidth / (COLS - 1);
        const stepY = graphHeight / (ROWS - 1);

        // Draw grid lines (Lattice Framework)
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.25)';
        ctx.lineWidth = 1;
        
        for (let i = 0; i < COLS; i++) {
            const x = paddingLeft + i * stepX;
            ctx.beginPath();
            ctx.moveTo(x, paddingTop);
            ctx.lineTo(x, canvas.height - paddingBottom);
            ctx.stroke();
        }
        for (let j = 0; j < ROWS; j++) {
            const y = canvas.height - paddingBottom - j * stepY;
            ctx.beginPath();
            ctx.moveTo(paddingLeft, y);
            ctx.lineTo(canvas.width - paddingRight, y);
            ctx.stroke();
        }

        // Draw Axes Labels
        ctx.fillStyle = '#64748b';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        
        // Horizontal Axis
        for (let i = 0; i < COLS; i++) {
            const x = paddingLeft + i * stepX;
            ctx.fillText(i, x, canvas.height - paddingBottom + 25);
        }
        ctx.fillText('Horizontal Axis: Modulo 9', paddingLeft + graphWidth / 2, canvas.height - paddingBottom + 45);

        // Vertical Axis
        ctx.textAlign = 'right';
        for (let j = 0; j < ROWS; j++) {
            const y = canvas.height - paddingBottom - j * stepY;
            ctx.fillText(j, paddingLeft - 20, y + 4);
            
            // Draw sequential loop counter index values along y axis (9, 18, 27...)
            if (j > 0) {
                ctx.fillStyle = '#94a3b8';
                ctx.fillText(j * 9, paddingLeft - 15, y - 12);
                ctx.fillStyle = '#64748b';
            }
        }

        // Vertical title orientation
        ctx.save();
        ctx.translate(20, paddingTop + graphHeight / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = 'center';
        ctx.fillText('Vertical Axis: Modulo 8', 0, 0);
        ctx.restore();

        // Draw Nodes
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                // Determine step rank
                const t = r * COLS + c;
                
                const x = paddingLeft + c * stepX;
                const y = canvas.height - paddingBottom - r * stepY;

                ctx.beginPath();
                if (t === 0 || (c === 0 && r === 0)) {
                    // Seed node
                    ctx.arc(x, y, 7, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#2563eb';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (t <= activeT) {
                    ctx.arc(x, y, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = getColorForStep(t);
                    ctx.fill();
                } else {
                    ctx.arc(x, y, 3.5, 0, 2 * Math.PI);
                    ctx.fillStyle = 'rgba(51, 65, 85, 0.4)';
                    ctx.fill();
                }
            }
        }

        // Color Spectrum Key Bar
        const gradientX = paddingLeft + 150;
        const gradientY = canvas.height - 20;
        const gradientW = 250;
        const gradientH = 10;
        
        let grad = ctx.createLinearGradient(gradientX, 0, gradientX + gradientW, 0);
        grad.addColorStop(0, 'hsl(0, 85%, 55%)');
        grad.addColorStop(0.5, 'hsl(140, 85%, 55%)');
        grad.addColorStop(1, 'hsl(280, 85%, 55%)');
        
        ctx.fillStyle = grad;
        ctx.fillRect(gradientX, gradientY, gradientW, gradientH);
        
        ctx.fillStyle = '#64748b';
        ctx.font = '10px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('0', gradientX, gradientY - 5);
        ctx.textAlign = 'right';
        ctx.fillText('60', gradientX + gradientW, gradientY - 5);
    }

    function updateMetrics(t) {
        stepDisplay.innerText = t;
        nodeIdxDisplay.innerText = t;
        
        const colCoord = t % 9;
        const rowCoord = Math.floor(t / 9) % 8;
        tensorCoordDisplay.innerText = `(${colCoord}, ${rowCoord})`;
        
        if (t === 72) {
            congruenceDisplay.innerText = "72 ≡ 0 (mod 72) [Toroid Wrapped]";
        } else {
            congruenceDisplay.innerText = `${t} ≡ ${t % 72} (mod 72)`;
        }
    }

    slider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        drawMatrix(val);
        updateMetrics(val);
    });

    // Run layout initial state
    drawMatrix(72);
    updateMetrics(72);
</script>

</body>
</html>
