<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Space: 8x9 Torus Traversal Engine</title>
    <style>
        :root {
            --bg-color: #0d131f;
            --panel-bg: #151c2c;
            --cell-empty: rgba(30, 41, 59, 0.2);
            --cell-visited: #1e3a8a;
            --cell-current: #2563eb;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .dashboard {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
        }
        /* Top Legend and Controls */
        .legend-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 12px;
        }
        .legend-items {
            display: flex;
            gap: 16px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        .ind-current { background: var(--cell-current); box-shadow: 0 0 8px var(--cell-current); }
        .ind-visited { background: var(--cell-visited); }
        .ind-vector {
            width: 16px;
            height: 0;
            border-top: 1px dashed #3b82f6;
        }
        
        .play-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        /* Rendering Canvas Grid container */
        .grid-viewport {
            background: #090d16;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.02);
            position: relative;
            margin-bottom: 20px;
        }
        canvas {
            display: block;
            width: 100%;
        }

        /* Metrics Display Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            margin-bottom: 24px;
            text-align: center;
        }
        .metric-item div:first-child {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .metric-item div:last-child {
            font-size: 18px;
            font-weight: 700;
            font-family: monospace;
        }

        /* Interactive Interface Panels */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }
        select {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        
        .timeline-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }
        .nav-btn {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.05);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-btn:hover { background: #2d3748; }
        input[type="range"] {
            flex: 1;
            accent-color: var(--cell-current);
            background: #1e293b;
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
        }
        .timeline-counter {
            font-family: monospace;
            font-size: 14px;
            width: 50px;
            text-align: right;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Top Legend Block -->
    <div class="legend-bar">
        <div class="legend-items">
            <div class="legend-item"><div class="indicator ind-current"></div><span>Current Position</span></div>
            <div class="legend-item"><div class="indicator ind-visited"></div><span>Visited Path Trail</span></div>
            <div class="legend-item"><div class="ind-vector"></div><span>Toroidal Jump Vector</span></div>
        </div>
        <button class="play-btn" id="playPauseBtn">⏸</button>
    </div>

    <!-- Main Calculation Matrix Viewport -->
    <div class="grid-viewport">
        <canvas id="spaceCanvas" width="500" height="420"></canvas>
    </div>

    <!-- Live Mathematical Traversal Readouts -->
    <div class="metrics-grid">
        <div class="metric-item">
            <div>Time Step</div>
            <div id="stepDisplay">t = 50</div>
        </div>
        <div class="metric-item">
            <div>Current Cell</div>
            <div id="cellDisplay" style="color: var(--text-main);">(6, 1)</div>
        </div>
        <div class="metric-item">
            <div>Coverage Ratio</div>
            <div id="coverageDisplay" style="color: var(--accent-blue);">71% (51/72)</div>
        </div>
    </div>

    <!-- Parameter Config Modulators -->
    <div class="controls-panel">
        <div class="control-group">
            <div class="control-label">Jump Vector Congruence</div>
            <select id="vectorSelect">
                <option value="3,2">Standard (3, 2)</option>
                <option value="5,2">Asymmetric Loop (5, 2)</option>
                <option value="1,1">Linear Step (1, 1)</option>
                <option value="7,4">Prime Hyper-Step (7, 4)</option>
            </select>
        </div>
        <div class="control-group">
            <div class="control-label">Path Progress Timeline</div>
            <div class="timeline-wrapper">
                <button class="nav-btn" id="prevBtn">&lt;</button>
                <button class="nav-btn" id="nextBtn">&gt;</button>
                <input type="range" id="timelineSlider" min="0" max="72" value="50">
                <span class="timeline-counter" id="timelineCounter">50 / 72</span>
            </div>
        </div>
    </div>
</div>
<script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');

    const playPauseBtn = document.getElementById('playPauseBtn');
    const stepDisplay = document.getElementById('stepDisplay');
    const cellDisplay = document.getElementById('cellDisplay');
    const coverageDisplay = document.getElementById('coverageDisplay');
    const vectorSelect = document.getElementById('vectorSelect');
    const timelineSlider = document.getElementById('timelineSlider');
    const timelineCounter = document.getElementById('timelineCounter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Strict 8x9 Torus geometry conditions
    const COLS = 8;
    const ROWS = 9;
    const TOTAL_NODES = COLS * ROWS; // 72 Nodes

    let activeT = 50;
    let jumpX = 3;
    let jumpY = 2;
    let isPlaying = false;
    let animationFrameId = null;

    // Computes the absolute modular chain up to a specified timestep t
    function generatePath(limitT, stepX, stepY) {
        let path = [];
        let curX = 0;
        let curY = 0;
        
        for (let t = 0; t <= limitT; t++) {
            path.push({ x: curX, y: curY });
            // Apply toroidal congruence wrap rules via standard Modulo arithmetic
            curX = (curX + stepX) % COLS;
            curY = (curY + stepY) % ROWS;
        }
        return path;
    }

    function renderEngine() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Core configuration variables for spacing layout
        const offsetLeft = 30;
        const offsetTop = 30;
        const gridW = canvas.width - offsetLeft - 20;
        const gridH = canvas.height - offsetTop - 40;
        const cellW = gridW / COLS;
        const cellH = gridH / ROWS;

        // Compute complete state arrays
        const fullPath = generatePath(activeT, jumpX, jumpY);
        const currentPos = fullPath[fullPath.length - 1];

        // Create a unique set index to calculate the pure coverage metric ratio safely
        let uniqueNodes = new Set();
        fullPath.forEach(p => uniqueNodes.add(`${p.x},${p.y}`));
        const coverageCount = uniqueNodes.size;
        const percentage = Math.round((coverageCount / TOTAL_NODES) * 100);

        // Update textual UI readouts
        stepDisplay.innerText = `t = ${activeT}`;
        cellDisplay.innerText = `(${currentPos.x}, ${currentPos.y})`;
        coverageDisplay.innerText = `${percentage}% (${coverageCount}/${TOTAL_NODES})`;
        timelineSlider.value = activeT;
        timelineCounter.innerText = `${activeT} / 72`;

        // 1. Draw Lattice Coordinate Axes Labels
        ctx.fillStyle = '#64748b';
        ctx.font = '11px monospace';
        ctx.textAlign = 'center';
        for (let c = 0; c < COLS; c++) {
            ctx.fillText(c, offsetLeft + c * cellW + cellW / 2, offsetTop - 10);
        }
        ctx.textAlign = 'right';
        for (let r = 0; r < ROWS; r++) {
            ctx.fillText(r, offsetLeft - 10, offsetTop + r * cellH + cellH / 2 + 4);
        }

        // 2. Render Lattice Node Cell Base States
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const x = offsetLeft + c * cellW;
                const y = offsetTop + r * cellH;
                const pad = 3;

                // Check node membership types across execution history
                const isCurrent = (c === currentPos.x && r === currentPos.y && activeT > 0);
                const isVisited = fullPath.some(p => p.x === c && p.y === r);

                ctx.beginPath();
                ctx.roundRect(x + pad, y + pad, cellW - pad*2, cellH - pad*2, 4);

                if (isCurrent) {
                    ctx.fillStyle = '#2563eb';
                    ctx.fill();
                    // Visual anchor high excitation border ring
                    ctx.strokeStyle = '#60a5fa';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                } else if (isVisited) {
                    ctx.fillStyle = 'rgba(30, 58, 138, 0.45)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(59, 130, 246, 0.15)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'rgba(30, 41, 59, 0.15)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        // 3. Draw Vector Traversal Interconnect Vectors (Toroidal Jump Lines)
        if (activeT > 0) {
            ctx.lineWidth = 1.2;
            ctx.setLineDash([4, 4]); // Clean dashed formatting matrix
            
            for (let i = 0; i < fullPath.length - 1; i++) {
                const p1 = fullPath[i];
                const p2 = fullPath[i + 1];

                const startX = offsetLeft + p1.x * cellW + cellW / 2;
                const startY = offsetTop + p1.y * cellH + cellH / 2;
                const endX = offsetLeft + p2.x * cellW + cellW / 2;
                const endY = offsetTop + p2.y * cellH + cellH / 2;

                // Detect topological wrap threshold boundary conditions
                const crossedWrapX = Math.abs(p2.x - p1.x) > 1;
                const crossedWrapY = Math.abs(p2.y - p1.y) > 1;

                if (!crossedWrapX && !crossedWrapY) {
                    // Standard inline adjacent displacement vector lines
                    ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                } else {
                    // Draw wrapped modular boundary projections
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    
                    // Simple partial directional projection to emphasize torus boundary flow
                    let targetX = endX;
                    let targetY = endY;
                    if (crossedWrapX) targetX = p2.x < p1.x ? startX + cellW : startX - cellW;
                    if (crossedWrapY) targetY = p2.y < p1.y ? startY + cellH : startY - cellH;
                    
                    ctx.lineTo(targetX, targetY);
                    ctx.stroke();
                }
            }
            ctx.setLineDash([]); // Reset line styles state
        }

        // Bottom Identification Text
        ctx.fillStyle = '#f1f5f9';
        ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont';
        ctx.textAlign = 'left';
        ctx.fillText('Modular Space: 8x9 Torus', offsetLeft + 4, canvas.height - 12);
    }

    // Controls Event Interface Handlers
    function updateVector() {
        const [x, y] = vectorSelect.value.split(',').map(Number);
        jumpX = x;
        jumpY = y;
        renderEngine();
    }

    function handleTimelineInput(e) {
        activeT = parseInt(e.target.value);
        renderEngine();
    }

    function stepTimeline(dir) {
        activeT = Math.max(0, Math.min(TOTAL_NODES, activeT + dir));
        renderEngine();
    }

    function runAnimation() {
        if (!isPlaying) return;
        activeT++;
        if (activeT > TOTAL_NODES) activeT = 0; // Wrap tracking sequence infinitely
        renderEngine();
        setTimeout(() => {
            animationFrameId = requestAnimationFrame(runAnimation);
        }, 150); // Fluid clock speed tick frequency throttling
    }

    playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
            playPauseBtn.innerText = '⏸';
            runAnimation();
        } else {
            playPauseBtn.innerText = '▶';
            cancelAnimationFrame(animationFrameId);
        }
    });

    vectorSelect.addEventListener('change', updateVector);
    timelineSlider.addEventListener('input', handleTimelineInput);
    prevBtn.addEventListener('click', () => stepTimeline(-1));
    nextBtn.addEventListener('click', () => stepTimeline(1));

    // Initialize Engine
    renderEngine();
</script>
</body>
</html>
